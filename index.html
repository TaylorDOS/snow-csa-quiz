<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSA Drill — ServiceNow Admin Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #12151a;
    --surface: #1a1e26;
    --surface-2: #212632;
    --border: #2b3140;
    --text: #e8eaed;
    --text-dim: #8b93a1;
    --text-faint: #5b6272;
    --accent: #f5b942;
    --accent-dim: #8a6a2a;
    --correct: #4ade80;
    --correct-bg: rgba(74, 222, 128, 0.12);
    --incorrect: #f87171;
    --incorrect-bg: rgba(248, 113, 113, 0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 80px;
  }
  .wrap{width:100%;max-width:640px;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  h1,h2,h3{font-family:'Space Grotesk', sans-serif;margin:0;}

  /* ---------- Header bar ---------- */
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:28px;
    padding-bottom:16px;
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .topbar .brand span{color:var(--accent);}
  .stat-row{
    display:flex;
    gap:18px;
    font-size:13px;
    color:var(--text-dim);
  }
  .stat-row b{color:var(--text);font-weight:600;}

  /* ---------- Setup screen ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px;
  }
  .setup-title{font-size:26px;font-weight:600;margin-bottom:8px;}
  .setup-sub{color:var(--text-dim);font-size:14.5px;line-height:1.55;margin-bottom:26px;}
  .field-label{
    font-size:12px;
    text-transform:none;
    color:var(--text-dim);
    margin-bottom:10px;
    font-weight:500;
  }
  .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
  .pill{
    padding:9px 16px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-dim);
    font-size:14px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    font-weight:500;
    transition:border-color .12s, color .12s, background .12s;
  }
  .pill:hover{border-color:var(--text-faint);color:var(--text);}
  .pill.active{
    border-color:var(--accent);
    background:rgba(245,185,66,0.1);
    color:var(--accent);
  }
  .go-btn{
    width:100%;
    padding:14px;
    border-radius:7px;
    border:none;
    background:var(--accent);
    color:#1a1305;
    font-size:15px;
    font-weight:600;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
    transition:filter .12s, transform .05s;
  }
  .go-btn:hover{filter:brightness(1.08);}
  .go-btn:active{transform:scale(0.99);}
  .go-btn:disabled{opacity:0.4;cursor:not-allowed;}

  /* ---------- Progress ---------- */
  .progress-track{
    height:4px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:24px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .25s ease;
  }

  /* ---------- Question card ---------- */
  .q-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    font-size:12.5px;
    color:var(--text-faint);
  }
  .q-tag{
    padding:3px 9px;
    border-radius:5px;
    background:var(--surface-2);
    border:1px solid var(--border);
    font-family:'IBM Plex Mono',monospace;
  }
  .q-text{
    font-size:18px;
    line-height:1.5;
    font-weight:500;
    margin-bottom:22px;
    white-space:pre-line;
  }
  .multi-hint{
    display:inline-block;
    font-size:12px;
    color:var(--accent);
    background:rgba(245,185,66,0.1);
    padding:3px 9px;
    border-radius:5px;
    margin-bottom:16px;
    font-family:'IBM Plex Mono',monospace;
  }
  .options{display:flex;flex-direction:column;gap:9px;margin-bottom:22px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 14px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface-2);
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .option:hover:not(.locked){border-color:var(--text-faint);}
  .option.selected{border-color:var(--accent);background:rgba(245,185,66,0.08);}
  .option.correct{border-color:var(--correct);background:var(--correct-bg);}
  .option.incorrect{border-color:var(--incorrect);background:var(--incorrect-bg);}
  .option.locked{cursor:default;}
  .opt-letter{
    flex:0 0 auto;
    width:24px;height:24px;
    border-radius:6px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px;
    font-weight:600;
    color:var(--text-dim);
    margin-top:1px;
  }
  .option.selected .opt-letter{border-color:var(--accent);color:var(--accent);}
  .option.correct .opt-letter{border-color:var(--correct);color:var(--correct);background:rgba(74,222,128,0.15);}
  .option.incorrect .opt-letter{border-color:var(--incorrect);color:var(--incorrect);background:rgba(248,113,113,0.15);}
  .opt-text{font-size:14.5px;line-height:1.5;padding-top:2px;}
  .result-icon{margin-left:auto;font-size:15px;padding-top:2px;flex:0 0 auto;}

  .explain{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:14px 16px;
    font-size:13.5px;
    line-height:1.6;
    color:var(--text-dim);
    margin-bottom:22px;
    display:none;
  }
  .explain b{color:var(--text);}
  .explain.show{display:block;}
  .fix-note{margin-top:10px;padding:8px 10px;border-left:3px solid var(--accent);background:rgba(245,185,66,0.08);border-radius:4px;font-size:13px;color:var(--text-dim);}
  .fix-note b{color:var(--accent);}

  .action-row{display:flex;gap:10px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:14.5px;
    font-weight:500;
    font-family:'Space Grotesk',sans-serif;
    cursor:pointer;
    transition:border-color .12s, background .12s;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn.primary{
    background:var(--accent);
    color:#1a1305;
    border:none;
    font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.08);}
  .btn:disabled{opacity:0.35;cursor:not-allowed;}

  /* ---------- Results screen ---------- */
  .score-hero{
    text-align:center;
    padding:14px 0 26px;
  }
  .score-num{
    font-family:'Space Grotesk',sans-serif;
    font-size:56px;
    font-weight:700;
    line-height:1;
  }
  .score-num span{font-size:22px;color:var(--text-dim);font-weight:500;}
  .score-label{color:var(--text-dim);font-size:13.5px;margin-top:8px;}
  .review-list{display:flex;flex-direction:column;gap:8px;margin:22px 0;}
  .review-item{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:11px 13px;
    border-radius:7px;
    border:1px solid var(--border);
    background:var(--surface-2);
    font-size:13.5px;
    cursor:pointer;
  }
  .review-item:hover{border-color:var(--text-faint);}
  .review-item .ri-mark{flex:0 0 auto;font-size:14px;margin-top:1px;}
  .review-item .ri-text{color:var(--text-dim);line-height:1.5;}
  .review-item.wrong .ri-mark{color:var(--incorrect);}
  .review-item.right .ri-mark{color:var(--correct);}

  footer{
    margin-top:26px;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    font-family:'IBM Plex Mono',monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
  /* ---------- attempts & history ---------- */
  .warn{padding:10px 12px;border:1px solid var(--incorrect);background:var(--incorrect-bg);border-radius:7px;font-size:13px;margin-bottom:18px;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;}
  .stat-grid div{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;}
  .stat-grid span{font-size:12px;color:var(--text-dim);}
  .stat-grid b{font-family:'Space Grotesk',sans-serif;font-size:20px;}
  .resume-box{border:1px solid var(--accent-dim);background:rgba(245,185,66,0.06);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;font-size:14px;}
  .link-btn{width:100%;margin-top:10px;flex:none;}
  .text-btn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;padding:4px 0;font-family:'IBM Plex Sans',sans-serif;}
  .text-btn:hover{color:var(--accent);}
  .hist-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px;}
  .trend{position:relative;height:90px;display:flex;align-items:flex-end;gap:4px;padding:0 0 0 30px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .trend .bar{flex:1;max-width:28px;background:var(--incorrect);opacity:.75;border-radius:3px 3px 0 0;}
  .trend .bar.ok{background:var(--correct);}
  .pass-line{position:absolute;left:30px;right:0;border-top:1px dashed var(--text-faint);}
  .pass-line span{position:absolute;left:-30px;top:-8px;font-size:10.5px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .attempt-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--border);background:var(--surface-2);border-radius:7px;cursor:pointer;}
  .attempt-row:hover{border-color:var(--text-faint);}
  .ar-num{font-family:'IBM Plex Mono',monospace;color:var(--text-faint);font-size:13px;min-width:30px;}
  .ar-main{flex:1;min-width:0;}
  .ar-date{font-size:14px;}
  .ar-sub{font-size:12.5px;color:var(--text-dim);margin-top:2px;}
  .ar-pct{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .ar-pct.ok{color:var(--correct);} .ar-pct.low{color:var(--incorrect);}
  .btn.danger{color:var(--incorrect);}
  .action-row{flex-wrap:wrap;}
  details.rv{border:1px solid var(--border);background:var(--surface-2);border-radius:7px;}
  details.rv summary{display:flex;gap:10px;padding:11px 13px;cursor:pointer;list-style:none;font-size:13.5px;}
  details.rv summary::-webkit-details-marker{display:none;}
  details.rv.wrong .ri-mark{color:var(--incorrect);} details.rv.right .ri-mark{color:var(--correct);}
  details.rv[open]{border-color:var(--text-faint);}
  .rv-body{padding:0 13px 13px;}
  .rv-opt{display:flex;gap:10px;align-items:flex-start;padding:7px 9px;border-radius:6px;font-size:13.5px;color:var(--text-dim);}
  .rv-opt.ans{background:var(--correct-bg);color:var(--text);}
  .rv-opt.ans .opt-letter{border-color:var(--correct);color:var(--correct);}
  .rv-opt.bad{background:var(--incorrect-bg);color:var(--text);}
  .rv-opt.bad .opt-letter{border-color:var(--incorrect);color:var(--incorrect);}
  .rv-tag{margin-left:auto;font-size:11.5px;white-space:nowrap;font-family:'IBM Plex Mono',monospace;color:var(--text-faint);}
  @media (max-width:520px){ .stat-grid{grid-template-columns:repeat(2,1fr);} .card{padding:20px;} }
  /* ---------- modes, exam timer & navigator ---------- */
  .mode{border:1px solid var(--border);background:var(--surface-2);border-radius:9px;padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:12px;}
  .mode-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .mode-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;}
  .mode-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);}
  .mode-desc{font-size:13.5px;line-height:1.55;color:var(--text-dim);}
  .mode .resume-box{background:var(--surface);}
  .jump-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-dim);}
  .jump-row label{flex:1;}
  .jump-row input{width:90px;padding:9px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:13px;}
  .jump-row input:focus{outline:none;border-color:var(--accent);}
  .jump-row .btn{flex:none;padding:9px 16px;}
  .timer{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--text);padding:2px 9px;border:1px solid var(--border);border-radius:6px;}
  .timer.low{color:var(--incorrect);border-color:var(--incorrect);background:var(--incorrect-bg);}
  .meta-actions{display:flex;gap:16px;align-items:center;}
  .text-btn.flagged{color:var(--accent);}
  .nav-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 10px;font-size:12px;color:var(--text-dim);}
  .legend{display:flex;align-items:center;gap:6px;}
  .legend .lg{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--border);margin-left:6px;}
  .legend .lg.done{background:rgba(245,185,66,0.25);border-color:var(--accent-dim);}
  .legend .lg.flag{border:2px solid var(--accent);}
  .nav-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;}
  .nav-cell{padding:6px 0;border-radius:5px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-faint);font-family:'IBM Plex Mono',monospace;font-size:11.5px;cursor:pointer;}
  .nav-cell:hover{border-color:var(--text-faint);color:var(--text);}
  .nav-cell.done{background:rgba(245,185,66,0.18);border-color:var(--accent-dim);color:var(--text);}
  .nav-cell.flag{border:2px solid var(--accent);}
  .nav-cell.cur{outline:2px solid var(--text);outline-offset:1px;color:var(--text);}
  @media (max-width:520px){ .nav-grid{grid-template-columns:repeat(6,1fr);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">CSA<span>drill</span></div>
    <div class="stat-row" id="topStats"></div>
  </div>

  <div id="app"></div>

  <footer id="pageFooter">ServiceNow CSA practice bank &middot; <span id="bankCount"></span> questions loaded</footer>
</div>

<script>
const QUESTIONS = [{"question": "The testing team needs to be able to perform activities in the test instance, as though\nthey are a member of the Service Desk group. What role would they need to be able to\nswitch between user accounts, without logging out and back in?", "options": [{"letter": "A", "text": "service_desk"}, {"letter": "B", "text": "impersonator"}, {"letter": "C", "text": "admin"}, {"letter": "D", "text": "incognito"}], "answer": ["B"], "explanation": "The impersonator role allows a user to switch to another user account and act as that\nuser without logging out and back in.This can be useful for testing purposes or for\nproviding support to other users."}, {"question": "Which tables are children of the Task table and come with the base system?\nChoose 3 answers", "options": [{"letter": "A", "text": "Incident"}, {"letter": "B", "text": "Problem"}, {"letter": "C", "text": "Change Request"}, {"letter": "D", "text": "Config"}, {"letter": "E", "text": "Dictionary"}, {"letter": "F", "text": "cmdb"}], "answer": ["A", "B", "C"], "explanation": "The Task table is a base table in ServiceNow, which means it is not extended from any\nother table. However, other tables can extend the Task table to inherit its fields and\nfunctionalities.\nIncident, Problem, and Change Request are all child tables of the Task table, meaning\nthey inherit the fields and functionalities of the Task table and add their own specific\nfields and functionalities."}, {"question": "How would you define an Access Control, to allow a user with itil role to have\npermission to create incident records?", "options": [{"letter": "A", "text": "Name: incident''; Permission: write; Role: itil"}, {"letter": "B", "text": "Name: incident Any, Operation: write, Permission: itil"}, {"letter": "C", "text": "Name: incident.*; Operation: write; Permission: itil"}, {"letter": "D", "text": "Name: incident None, Permission: create: Role: itil"}, {"letter": "E", "text": "Name: incident. None; Operation: create; Role: itil"}], "answer": ["E"], "explanation": "Create access is granted by an ACL on incident.None with Operation = create and the itil role required. \"Permission: create\" (option D) mixes up the terms: create is the ACL operation, and the role is the requirement.", "correction": {"was": "D", "basis": "Verified against ServiceNow docs"}}, {"question": "Which tool is used for creating dependencies between configuration items in the\nCMDB?", "options": [{"letter": "A", "text": "CI Relationship Editor"}, {"letter": "B", "text": "CMDB Builder"}, {"letter": "C", "text": "CI Service Manager"}, {"letter": "D", "text": "Cl Class Manager"}], "answer": ["A"], "explanation": ""}, {"question": "The Employee On-boarding team has asked for a way for managers to order computers,\nmonitors, business Cards, and cell phones for new employees. How would you proceed\nto meet this requirement?", "options": [{"letter": "A", "text": "Create Record Producer"}, {"letter": "B", "text": "Create Order Guide"}, {"letter": "C", "text": "Create Requested Item"}, {"letter": "D", "text": "Create On-boarding Bot"}], "answer": ["B"], "explanation": "An Order Guide in ServiceNow allows users (like managers) to order multiple related\nitems (e.g., computers, monitors, business cards, and cell phones) as part of a single\nrequest. It's designed to streamline complex ordering processes and guide users\nthrough selecting the right set of items for a specific purpose—like employee\nonboarding."}, {"question": "A customer has asked for the following updates to a form:\n* Make Resolution code mandatory, admin state is changed to Resolved.\n* Hide major incident check box, unless logged in user has Major incident Manager role.\nWhat type of rules (s) would you use to implement this requirement?", "options": [{"letter": "A", "text": "Dictionary Design"}, {"letter": "B", "text": "Field Limiter"}, {"letter": "C", "text": "UI Policy"}, {"letter": "D", "text": "UI Design"}, {"letter": "E", "text": "Form Constraint"}], "answer": ["C"], "explanation": "A UI Policy can make Resolution code mandatory when State is Resolved, and hide the Major Incident checkbox (using a UI policy script or condition for the role). \"Form Constraint\" is not a ServiceNow feature.", "correction": {"was": "C,E", "basis": "Corrected by reasoning / consistency with the rest of the bank"}}, {"question": "When importing spreadsheet data into ServiceNow, what is the first step in the process?", "options": [{"letter": "A", "text": "Create Import Set"}, {"letter": "B", "text": "Run Data Scrubber"}, {"letter": "C", "text": "Set Coalesce"}, {"letter": "D", "text": "Define Data Source"}, {"letter": "E", "text": "Select Import Set"}], "answer": ["A"], "explanation": ""}, {"question": "What actions are taken to filter a long list of records to show only those with the\nCategory of Hardware?", "options": [{"letter": "A", "text": "On Breadcrumb, click the > icon, type Hardware and click enter"}, {"letter": "B", "text": "On the Category column header, right-click and select Show > Hardware"}, {"letter": "C", "text": "On the list, locate and right-click on the value Hardware, select Show Matching"}, {"letter": "D", "text": "Right-click on magnifier type Hardware and click enter"}, {"letter": "E", "text": "Click Funnel icon, type Hardware and click enter"}], "answer": ["C"], "explanation": ""}, {"question": "What module do you use to access the reports that are available to you?", "options": [{"letter": "A", "text": "Report > View /Run"}, {"letter": "B", "text": "Reports > Homepage"}, {"letter": "C", "text": "Self-Service>My Reports"}, {"letter": "D", "text": "Report > Overview"}], "answer": ["A"], "explanation": ""}, {"question": "What are the steps for applying an update set to an instance?", "options": [{"letter": "A", "text": "Retrieve, Preview, Commit"}, {"letter": "B", "text": "Specify, Transform, Apply"}, {"letter": "C", "text": "Retrieve, Assess, Apply"}, {"letter": "D", "text": "Get, Test, Push"}, {"letter": "E", "text": "Pull, Review, Push"}], "answer": ["A"], "explanation": ""}, {"question": "What section on a task record is used to see the most recent updates made to a record?", "options": [{"letter": "A", "text": "Related List"}, {"letter": "B", "text": "Activity Stream"}, {"letter": "C", "text": "Audit Log"}, {"letter": "D", "text": "Timeline"}], "answer": ["B"], "explanation": ""}, {"question": "Which type of scripts run in the browser?", "options": [{"letter": "A", "text": "Policies and Client Scripts"}, {"letter": "B", "text": "Access Contral Scripts"}, {"letter": "C", "text": "script Include Scripts"}, {"letter": "D", "text": "Business Rule Scripts"}], "answer": ["A"], "explanation": ""}, {"question": "Which feature helps to define the rules to restrict the permissions of users from viewing\nand interacting with data?", "options": [{"letter": "A", "text": "Role Assignment Rules"}, {"letter": "B", "text": "Scripted User Rules"}, {"letter": "C", "text": "CRUD Rules"}, {"letter": "D", "text": "User Authentication Rules"}, {"letter": "E", "text": "Access Control (ACL)"}], "answer": ["E"], "explanation": "Access Control Lists (ACLs) in ServiceNow define who can read, write, create, or delete\nrecords in the system. ACLs apply to tables, fields, and UI elements.\nOption A (Role Assignment Rules) is incorrect because roles grant access but do not\ndefine granular security controls.\nOption B (Scripted User Rules) is incorrect because there is no such feature in\nServiceNow.\nOption C (CRUD Rules) is incorrect because CRUD (Create, Read, Update, Delete)\npermissions are enforced through ACLs.\nOption D (User Authentication Rules) is incorrect because authentication rules control\nlogin access, not data access."}, {"question": "Which roles are required to configure the form layout using Table Builder? (Choose 2\nanswers)", "options": [{"letter": "A", "text": "personalize_form"}, {"letter": "B", "text": "app_engine_admin"}, {"letter": "C", "text": "admin"}, {"letter": "D", "text": "read_only_user"}, {"letter": "E", "text": "support_specialist"}], "answer": ["A", "C"], "explanation": "In Table Builder, only users with appropriate permissions can modify form layouts.\n\nThe admin role (Option C) has full access to configure forms, tables, and relationships.\nThe personalize_form role (Option A) allows users to configure form layouts, but not\ntable structures.\nOption B (app_engine_admin) is incorrect because this role is used for managing\ncustom applications, not form layouts.\nOption D (read_only_user) is incorrect because it does not grant any configuration\npermissions.\nOption E (support_specialist) is incorrect because it is typically for support personnel\nwho handle incidents and cases, not form design."}, {"question": "How can an administrator modify the layout of a form using Table Builder?", "options": [{"letter": "A", "text": "By configuring form sections"}, {"letter": "B", "text": "By changing the database schema"}, {"letter": "C", "text": "By editing system scripts"}, {"letter": "D", "text": "By altering the page header theme"}], "answer": ["A"], "explanation": "Table Builder is a ServiceNow feature that allows administrators to modify table\nstructures, configure forms, and manage relationships within a visual interface.\nWhen modifying form layouts in Table Builder, administrators can:\nAdd, remove, or rearrange fields on the form.\nCreate new form sections to organize fields logically.\nConfigure default values and field properties.\nManage related lists and relationships between tables.\nOption B (Changing the database schema) is incorrect because modifying form layouts\ndoes not require schema changes (though Table Builder can modify schemas, it's not\nnecessary for layout changes).\nOption C (Editing system scripts) is incorrect because form layout changes do not\nrequire scripting.\nOption D (Altering the page header theme) is incorrect because themes affect the UI\nappearance, not form structure"}, {"question": "Which term best describes something that is created, has work performed upon it, and\nis eventually moved to a state of closed?", "options": [{"letter": "A", "text": "Event"}, {"letter": "B", "text": "Report"}, {"letter": "C", "text": "Task"}, {"letter": "D", "text": "Flow"}], "answer": ["C"], "explanation": "In ServiceNow, a Task is a fundamental record type that represents work that needs to\nbe completed. Tasks can be assigned to users or groups, tracked through various states,\nand eventually marked as closed when the work is completed.\nEvent (A) refers to a system-generated log of an occurrence (e.g., an email sent or a user\naction), but it is not a record that moves through states like a task.\nReport (B) is used for analyzing and visualizing data but does not track work progress.\nFlow (D) refers to Flow Designer flows, which automate processes but are not individual\nwork items themselves.\nTasks are widely used across ServiceNow applications, such as Incident Management,\nChange Management, and Service Requests, to track and manage work."}, {"question": "Which storefront is a single location for accessing pre-built spokes to quickly integrate\nwith thirdparty services to build and share content?", "options": [{"letter": "A", "text": "Integration Spoke Store"}, {"letter": "B", "text": "ServiceNow Store"}, {"letter": "C", "text": "Spoke Store"}, {"letter": "D", "text": "ServiceNow Spoke Store"}], "answer": ["B"], "explanation": "The ServiceNow Store is the primary marketplace for accessing pre-built integrations,\nknown as spokes, for ServiceNow. These spokes enable rapid integration with third-\nparty services, streamlining the development of automation and integration workflows.\nThe store includes various applications and plugins tailored for ServiceNow workflows,\nfacilitating the quick deployment of additional capabilities"}, {"question": "Which actions would you take to edit the title on an application menu? (Choose 2\nanswers)", "options": [{"letter": "A", "text": "Select Configuration > Applications, then select the application"}, {"letter": "B", "text": "Select the form for the Application, then right-click Configure > Form Designer"}, {"letter": "C", "text": "Select the Application name on the Navigator, then select the pencil icon"}, {"letter": "D", "text": "Select System Definitions > Application Menus, then select the application"}, {"letter": "E", "text": "Select System Definition > Dictionary > Application"}], "answer": ["C", "D"], "explanation": "To edit an application menu title, either use the Navigator: select the application name and click the pencil icon; or go to System Definition > Application Menus and open the application."}, {"question": "Where do you navigate to add a list of Incidents created by a user to the bottom of their\nuser record?", "options": [{"letter": "A", "text": "Context Menu > Configure > Related Lists"}, {"letter": "B", "text": "Right-click on Form > Configure > Related Cases"}, {"letter": "C", "text": "Right-click on the Form > Configure > Add Lists"}, {"letter": "D", "text": "Context Menu > Configure > Related Records"}], "answer": ["A"], "explanation": "Related Lists allow administrators to display associated records at the bottom of a\nform, such as incidents assigned to a user or requests submitted by a caller.\nSteps to Add a Related List:\nOpen a User record (e.g., sys_user table).\nClick on the Form Context Menu () > Configure > Related Lists.\nSelect Incidents (task table with condition 'Opened by = current user').\nSave changes.\nOption B (Related Cases) is incorrect because cases refer to Customer Service\nManagement (CSM), not Incident Management.\nOption C (Add Lists) is incorrect because the correct term is Related Lists, not 'Add\nLists'.\nOption D (Related Records) is incorrect because there is no such direct menu option."}, {"question": "What is the primary purpose of Form Builder in the Now Platform?", "options": [{"letter": "A", "text": "To generate analytical reports from data tables"}, {"letter": "B", "text": "To edit forms used for populating records"}, {"letter": "C", "text": "To create new tables within the platform"}, {"letter": "D", "text": "To configure system settings and permissions"}], "answer": ["B"], "explanation": "Form Builder is used to design and modify forms that users interact with when entering\nand updating records.\nKey Features of Form Builder:\nDrag-and-drop interface to add, remove, or rearrange fields.\nSupports sections, tabs, and related lists.\nEnables quick modification of forms without writing scripts.\nOption A (Generate analytical reports) is incorrect because reports are created using\nthe Report Designer, not Form Builder.\nOption C (Create new tables) is incorrect because tables are created via Table Builder\nor directly in the Table module.\nOption D (Configure system settings and permissions) is incorrect because permissions\nare managed through roles, ACLs, and system properties."}, {"question": "Which element allows administrators to add information to a form outside of existing\nfields on the record?", "options": [{"letter": "A", "text": "By duplicating a form view"}, {"letter": "B", "text": "By adding formatters to a form"}, {"letter": "C", "text": "By modifying the layout to two columns"}, {"letter": "D", "text": "By dragging fields from the form elements panel"}], "answer": ["B"], "explanation": "Formatters in ServiceNow allow administrators to add additional information to a form\nthat is not part of a table's field structure.\nCommon Formatters in ServiceNow:\nActivity Formatter -- Displays updates like comments, work notes, and system-\ngenerated logs.\nProcess Flow Formatter -- Shows the workflow stages of a record (e.g., Change Request\napproval process).\nTimeline Formatter -- Displays a chronological view of activities related to the record.\nOption A (Duplicating a form view) is incorrect because duplicating a form view only\ncreates a new layout for different users, but does not add additional information.\nOption C (Modifying the layout to two columns) is incorrect because changing the\nlayout does not add new elements, just arranges existing fields differently.\nOption D (Dragging fields from the form elements panel) is incorrect because fields\nalready exist in the table, whereas formatters provide extra contextual data."}, {"question": "Which actions can you take to open the Context Menu on a list, form, or column?\n(Choose 2 answers)", "options": [{"letter": "A", "text": "Select the Context Menu icon"}, {"letter": "B", "text": "Double click on the list, form, or column heading"}, {"letter": "C", "text": "Use Ctrl+M command"}, {"letter": "D", "text": "Right-click on the list, form, or column heading"}, {"letter": "E", "text": "Select the Context Menu related link"}], "answer": ["A", "D"], "explanation": "The Context Menu in ServiceNow provides quick access to actions related to a list,\nform, or column.\nWays to Open the Context Menu:\nSelect the Context Menu icon ( A) -- Located at the top of lists and forms.\nRight-click on the list, form, or column heading ( D) -- Opens the menu for quick actions.\nOption B (Double click on the list, form, or column heading) is incorrect because\ndouble-clicking typically edits inline fields.\nOption C (Use Ctrl+M command) is incorrect because no such shortcut exists.\nOption E (Select the Context Menu related link) is incorrect because there is no such\nlink in ServiceNow."}, {"question": "When working on a task, which field do you use to share knowledge and other\ncustomer-visible details?", "options": [{"letter": "A", "text": "Caller note"}, {"letter": "B", "text": "Customer notes"}, {"letter": "C", "text": "Additional comments"}, {"letter": "D", "text": "Description"}], "answer": ["C"], "explanation": "The 'Additional comments' field is used to communicate information that is visible to\nthe customer. This field is commonly used in Incident Management, Service Requests,\nand other task-based records.\nKey Differences Between Fields:\nAdditional Comments ( Correct Answer) -- Used for customer-facing communication.\nWork Notes -- Used for internal team communication (not visible to the customer).\nCaller Note (A) -- No such standard field exists.\nCustomer Notes (B) -- Not a standard ServiceNow field.\nDescription (D) -- Holds initial details of the issue but is not used for ongoing\ncommunication."}, {"question": "If you want to manage your personal tasks through a visual, drag-and-drop interface,\nwhat application would you use?", "options": [{"letter": "A", "text": "Visual Task Boards"}, {"letter": "B", "text": "Service Desk"}, {"letter": "C", "text": "Virtual Agent Homepage"}, {"letter": "D", "text": "Personal Task Tracker"}], "answer": ["A"], "explanation": "Visual Task Boards (VTB) provide a Kanban-style interface for tracking and managing\ntasks visually. Users can:\nCreate personal or team boards to manage tasks.\nDrag and drop task cards between different lanes (e.g., 'To Do,' 'In Progress,'\n'Completed').\nFilter and categorize work dynamically.\nTypes of Visual Task Boards:\nFreeform Boards -- Simple personal boards for organizing work.\nGuided Boards -- Based on ServiceNow lists and automatically updated.\nFlexible Boards -- A mix of Freeform and Guided boards.\nOption B (Service Desk) is incorrect because it refers to the Service Desk application for\nhandling incidents and tickets.\nOption C (Virtual Agent Homepage) is incorrect because it is used for chatbot\ninteractions, not task management.\nOption D (Personal Task Tracker) is incorrect because there is no such feature in\nServiceNow."}, {"question": "Which ServiceNow resource can be used as a blueprint to map your IT services to\nServiceNow?", "options": [{"letter": "A", "text": "Common Services Data Model (CSDM)"}, {"letter": "B", "text": "Configuration Management Database (CMDB)"}, {"letter": "C", "text": "IT Service Management (ITSM)"}, {"letter": "D", "text": "ServiceNow Wiki"}], "answer": ["A"], "explanation": "Common Services Data Model (CSDM) is a ServiceNow best-practice framework that\nstandardizes how IT services, applications, and infrastructure are structured in the\nCMDB. It provides a blueprint for aligning ServiceNow configurations with business and\nIT operations.\nWhy CSDM is Important:\nEnsures consistency in IT service mapping and asset relationships.\nHelps organizations align CMDB data with ITSM, ITOM, and other ServiceNow\napplications.\nProvides data governance and best practices to maintain data integrity.\nOption B (CMDB) is incorrect because the CMDB is the database that stores\nconfiguration items (CIs), but CSDM defines the model for structuring it.\nOption C (ITSM) is incorrect because ITSM includes processes like Incident, Problem,\nand Change Management, but does not provide a data model blueprint.\nOption D (ServiceNow Wiki) is incorrect because ServiceNow no longer uses a wiki for\ndocumentation (it has been replaced by the ServiceNow Docs Portal)."}, {"question": "Which action enables a user to view and specify date and time formats in their\ninstance?", "options": [{"letter": "A", "text": "Create a UI Script to set the default timezone"}, {"letter": "B", "text": "Ask the user to adjust the time zone on their personal computer"}, {"letter": "C", "text": "Select the User menu > Preferences > Language & Region > Set date and time format and time zone"}, {"letter": "D", "text": "Select the User menu > Preferences > Time Settings > Toggle display time zone"}, {"letter": "E", "text": "Use the system properties to correct the instance's time zone"}], "answer": ["C"], "explanation": "Users in ServiceNow can set their personal date and time format via:\nUser menu > Preferences > Language & Region > Set date and time format and time\nzone\nOption A (Create a UI Script) is incorrect because UI Scripts do not modify user\npreferences.\nOption B (Adjust the time zone on their PC) is incorrect because ServiceNow instances\nhave their own time zone settings.\nOption D (Toggle display time zone) is incorrect because there is no 'Time Settings'\noption under Preferences.\nOption E (System properties to correct time zone) is incorrect because system-wide\nproperties affect all users, but personal settings are changed via Preferences."}, {"question": "To apply a UI Policy to all views, which field should be set to true in its definition record?", "options": [{"letter": "A", "text": "Inherit"}, {"letter": "B", "text": "Reverse if false"}, {"letter": "C", "text": "On lowed"}, {"letter": "D", "text": "Global"}], "answer": ["D"], "explanation": ""}, {"question": "When creating a new notification, what must you define?\nChoose 3 answers", "options": [{"letter": "A", "text": "What is the content of the notification"}, {"letter": "B", "text": "The associated knowledge base"}, {"letter": "C", "text": "Under what conditions is the notification sent"}, {"letter": "D", "text": "Who receives the notification"}, {"letter": "E", "text": "Settings for handling inactive user accounts"}], "answer": ["A", "C", "D"], "explanation": ""}, {"question": "Security rules are defined to restrict the permission of users from viewing and\ninteracting with data. What are these security rules called?", "options": [{"letter": "A", "text": "Role Assignment Rules"}, {"letter": "B", "text": "CRUD Rules"}, {"letter": "C", "text": "Scripted User Rules"}, {"letter": "D", "text": "Access Control Rules"}, {"letter": "E", "text": "User Authentication Rules"}], "answer": ["D"], "explanation": ""}, {"question": "Which data consistency settings can be achieved using UI Policy?\nChoose 3 answers", "options": [{"letter": "A", "text": "Setting fields to accept the data with 'n' number of characters"}, {"letter": "B", "text": "Setting fields hidden"}, {"letter": "C", "text": "Setting fields to accept the data in an expected format"}, {"letter": "D", "text": "Settings fields read-only"}, {"letter": "E", "text": "Setting fields mandatory"}], "answer": ["B", "D", "E"], "explanation": ""}, {"question": "A customer wants to be able to identify and track components of their infrastructure\nthat support their ecommerce service. What ServiceNow products could support this\nrequirement?\nChoose 3 answers", "options": [{"letter": "A", "text": "Performance Analytics"}, {"letter": "B", "text": "Configuration Management (CMDB)"}, {"letter": "C", "text": "Financial Management"}, {"letter": "D", "text": "Discovery"}, {"letter": "E", "text": "Service Mapping"}], "answer": ["B", "D", "E"], "explanation": "Configuration Management (CMDB) is a product that allows users to identify and track\ncomponents of their infrastructure, such as servers, applications, databases, networks,\nand devices, and their relationships.CMDB provides a single source of truth for IT\nassets and services, and supports IT service management processes.\nDiscovery is a product that automatically scans the network and populates the CMDB\nwith the discovered infrastructure components and their attributes2.Discovery uses\nprobes, sensors, and patterns to identify and classify IT assets, and updates the CMDB\nwith any changes2.\nService Mapping is a product that creates a top-down view of the infrastructure\ncomponents that support a specific business service, such as ecommerce3.Service\nMapping uses discovery data and application traffic analysis to map the dependencies\nand relationships between IT assets and services, and displays them in a graphical\ninterface3."}, {"question": "Which feature enables business process owners to organize Flow Designer content into\nunified and digitized cross-enterprise processes via a digitized task board Interface?", "options": [{"letter": "A", "text": "Flow Designer"}, {"letter": "B", "text": "Process Automation Designer"}, {"letter": "C", "text": "Process Workflow Designer"}, {"letter": "D", "text": "Workflow Editor"}], "answer": ["B"], "explanation": ""}, {"question": "The Report Designer contains different sections for configuring your report. Which\nsection is used to specify grouping and calculations to be run against me data?", "options": [{"letter": "A", "text": "Style"}, {"letter": "B", "text": "Format"}, {"letter": "C", "text": "Data"}, {"letter": "D", "text": "Configure"}, {"letter": "E", "text": "Group by"}], "answer": ["D"], "explanation": ""}, {"question": "On the Cl Dependency View, what enables you to trace from an infrastructure item, like\na Server, to the Services that are dependent on that Server?", "options": [{"letter": "A", "text": "Service Tracer"}, {"letter": "B", "text": "Automapping Utility"}, {"letter": "C", "text": "Relationships"}, {"letter": "D", "text": "Transform Map"}], "answer": ["C"], "explanation": ""}, {"question": "An IT user calls the service desk because they need to work on task records. All they can\nsee is Self Service on their homepage when they login to the ServiceNow instance.\nWhat issue could explain this?\nChoose 2 answers", "options": [{"letter": "A", "text": "Their user account failed LDAP authentication"}, {"letter": "B", "text": "Their user account is not logged in properly"}, {"letter": "C", "text": "Their user account was not approved by their manager"}, {"letter": "D", "text": "Their user account does not have itil role"}, {"letter": "E", "text": "Their user account does not belong to any groups, which contain the itil role"}], "answer": ["D", "E"], "explanation": ""}, {"question": "What are the steps for applying an update set to an instance?", "options": [{"letter": "A", "text": "Retrieve, Preview, Commit"}, {"letter": "B", "text": "Specify, Transform, Apply"}, {"letter": "C", "text": "Retrieve, Assess, Apply"}, {"letter": "D", "text": "Get, Test, Push"}, {"letter": "E", "text": "Pull, Review, Push"}], "answer": ["A"], "explanation": ""}, {"question": "What are typical ways to create an Incident?", "options": [{"letter": "A", "text": "SMS"}, {"letter": "B", "text": "Employee Center or Portals"}, {"letter": "C", "text": "Sending Emails to ITIL-Team directly"}, {"letter": "D", "text": "Via Record Producer for Problems or Changes"}, {"letter": "E", "text": "Via Workspace"}], "answer": ["B", "E"], "explanation": "Incidents are typically created from Employee Center / portals and from workspaces (and via inbound email to the instance, phone, chat, Virtual Agent). A record producer for Problems or Changes creates problems or changes, not incidents, and emailing ITIL team members directly does not create a record.", "correction": {"was": "B,D,E", "basis": "Corrected by reasoning / consistency with the rest of the bank"}}, {"question": "What is true about Priority Lookup Rules?", "options": [{"letter": "A", "text": "Urgency is defined by Impact and Priority"}, {"letter": "B", "text": "VIP affects urgency, but not priority"}, {"letter": "C", "text": "Impact and Urgency define Priority"}, {"letter": "D", "text": "Priority is used for SLAs"}], "answer": ["C", "D"], "explanation": ""}, {"question": "Where can you define Incident inbound Actions?", "options": [{"letter": "A", "text": "System Policy > Inbound Actions > Email"}, {"letter": "B", "text": "System Policy > Actions > Inbound Actions"}, {"letter": "C", "text": "System Policy > Email > Inbound Actions"}, {"letter": "D", "text": "Incident > Incident Properties > Inbound Email Actions"}], "answer": ["C"], "explanation": "The inbound email action parses the email and responds using a script. By default, an\nemail received by the instance creates a new incident, and the body of the email is\nadded to the Additional Comments text box. More refined Inbound Email Actions can\ncreate incident tickets with more data, thus saving the incident management team\nvaluable time."}, {"question": "What are valid group types in the base instance?", "options": [{"letter": "A", "text": "catalog"}, {"letter": "B", "text": "itil"}, {"letter": "C", "text": "report"}, {"letter": "D", "text": "survey"}], "answer": ["A", "B", "D"], "explanation": ""}, {"question": "You are in a workshop with the client discussing notifications. The client asks for advice\non how to best set up notifications. What recommendations would you give for best\npractices?", "options": [{"letter": "A", "text": "Customer tend to under-do notifications"}, {"letter": "B", "text": "It is best practice to under-do notifications, since users are overwhelmed if they receive too many notifications"}, {"letter": "C", "text": "Notifications should only be sent via Email"}, {"letter": "D", "text": "Out of the Box for each change of the Incident State, a Notification gets sent to the Caller of the Incident"}], "answer": ["B"], "explanation": "Send only notifications that are needed. Users who receive too many notifications start ignoring them, so it's best practice to under-do rather than over-do them."}, {"question": "Which conditions must be met for an Inbound Email Action to execute in ServiceNow?", "options": [{"letter": "A", "text": "The incoming email must be from a verified domain."}, {"letter": "B", "text": "The incoming email type matches the inbound action type."}, {"letter": "C", "text": "The watermark or record number matches a record on the target table."}, {"letter": "D", "text": "The inbound action Conditions evaluate to true."}, {"letter": "E", "text": "All emails received by ServiceNow trigger an Inbound Email Action."}], "answer": ["B", "C", "D"], "explanation": ""}, {"question": "Identify the components commonly found in a ServiceNow Service Catalog:", "options": [{"letter": "A", "text": "SLAs, Order Guides, and Knowledge Articles"}, {"letter": "B", "text": "Catalog Items, Record Producers, and Order Guides"}, {"letter": "C", "text": "Workflows, Change Requests, and Catalog Tasks"}, {"letter": "D", "text": "Asset Management, Request Fulfillment, and Incident Management"}], "answer": ["B"], "explanation": ""}, {"question": "Which of the following is used to automate repetitive tasks and ensure consistency in\nServiceNow?", "options": [{"letter": "A", "text": "Business Rules"}, {"letter": "B", "text": "UI Policies"}, {"letter": "C", "text": "Access Control Rules"}, {"letter": "D", "text": "Service Level Agreements (SLAs)"}, {"letter": "E", "text": "Flow Designer"}], "answer": ["A", "E"], "explanation": ""}, {"question": "What is the correct navigation path to enable or disable notifications for a user in\nServiceNow?", "options": [{"letter": "A", "text": "User menu > Preferences > Notifications > Toggle Allow Notifications"}, {"letter": "B", "text": "User menu > Settings > Notifications > Toggle Notification Preferences"}, {"letter": "C", "text": "User menu > Preferences > Email > Enable/Disable Notifications"}, {"letter": "D", "text": "User menu > Notifications > Preferences > Toggle Allow Notifications"}], "answer": ["A"], "explanation": ""}, {"question": "What is the primary purpose of CMDB classifications, and how do they help\nadministrators manage Configuration Items (CIs)?", "options": [{"letter": "A", "text": "To define the physical properties of a CI and help with inventory management"}, {"letter": "B", "text": "To group CIs that share common attributes and store them in their own class tables, facilitating the definition of a class hierarchy within the CMDB"}, {"letter": "C", "text": "To track the financial information of a CI and assist with asset management"}, {"letter": "D", "text": "To create and manage relationships between CIs to enable incident troubleshooting"}], "answer": ["B"], "explanation": "CI classes group CIs that share attributes into their own class tables, forming the CMDB class hierarchy (for example cmdb_ci > cmdb_ci_server)."}, {"question": "What are the categories of reports available in ServiceNow?", "options": [{"letter": "A", "text": "My reports, Group, Department, All"}, {"letter": "B", "text": "My reports, Team, Global, All"}, {"letter": "C", "text": "My reports, Group, Global, All"}, {"letter": "D", "text": "Personal reports, Group, Global, All"}], "answer": ["C"], "explanation": ""}, {"question": "Which tab in the ServiceNow Report Designer is used to configure data sources for the\nreport?", "options": [{"letter": "A", "text": "Type"}, {"letter": "B", "text": "Data"}, {"letter": "C", "text": "Configure"}, {"letter": "D", "text": "Style"}], "answer": ["B"], "explanation": ""}, {"question": "Which report distribution option in Report Designer is not valid?", "options": [{"letter": "A", "text": "Share"}, {"letter": "B", "text": "Schedule"}, {"letter": "C", "text": "Attach to email"}, {"letter": "D", "text": "Export to PDF"}, {"letter": "E", "text": "Add to dashboard"}], "answer": ["C"], "explanation": ""}, {"question": "Which of the following capabilities is NOT a feature of Performance Analytics in\nServiceNow?", "options": [{"letter": "A", "text": "Generating historical trends by taking regular snapshots"}, {"letter": "B", "text": "Tracking performance against defined targets"}, {"letter": "C", "text": "Alerting when performance thresholds are met"}, {"letter": "D", "text": "Automatically correcting data anomalies in reports"}], "answer": ["D"], "explanation": ""}, {"question": "Which statement about responsive dashboards in ServiceNow is correct?", "options": [{"letter": "A", "text": "Homepages offer more features than responsive dashboards."}, {"letter": "B", "text": "Responsive dashboards cannot be shared with colleagues."}, {"letter": "C", "text": "Non-responsive dashboards are still available in the Utah release"}, {"letter": "D", "text": "Responsive dashboards allow you to determine the size of individual elements and create multiple tabs."}], "answer": ["D"], "explanation": "Responsive dashboards let you resize individual widgets and organise content into multiple tabs."}, {"question": "Which of the following is NOT a benefit of using Flow Designer in ServiceNow?", "options": [{"letter": "A", "text": "Requires custom scripting for all workflow automation."}, {"letter": "B", "text": "Automate
