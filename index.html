}

// ---------- EXAM ----------
function startExam(){
  const now = Date.now();
  state.exam = { id:'a'+now, startedAt:now, deadline:now + EXAM_MINUTES*60000, qids:buildExamQuestions(), sel:{}, flags:{}, idx:0 };
  saveExam(state.exam);
  renderExam();
}
function resumeExam(){
  state.exam = loadExam();
  if(!state.exam) return renderHome();
  if(state.exam.deadline <= Date.now()) return submitExam(true);
  renderExam();
}

function renderExam(){
  stopTimer(); state.screen = 'exam';
  const e = state.exam;
  const q = BY_ID[e.qids[e.idx]];
  if(!q){ e.qids.splice(e.idx, 1); e.idx = Math.min(e.idx, e.qids.length-1); saveExam(e); return renderExam(); }  // question removed from bank
  const isMulti = q.answer.length > 1;
  const chosen = new Set(e.sel[q.id] || []);
  const last = e.idx === e.qids.length - 1;
  renderTopStats();
  app.innerHTML = `
    <div class="progress-track"><div class="progress-fill" style="width:${answeredCount(e)/e.qids.length*100}%"></div></div>
    <div class="card">
      <div class="q-meta">
        <span class="q-tag">Question ${e.idx+1} of ${e.qids.length}</span>
        <span class="meta-actions">
          <button class="text-btn ${e.flags[q.id]?'flagged':''}" id="flagBtn">${e.flags[q.id] ? '⚑ Flagged' : '⚐ Flag'}</button>
          <button class="text-btn" id="exitBtn" title="The clock keeps running while you're away">Save &amp; exit</button>
        </span>
      </div>
      ${isMulti ? `<div class="multi-hint">Select ${q.answer.length} answers</div>` : ''}
      <div class="q-text">${escapeHtml(q.question)}</div>
      <div class="options">
        ${q.options.map(o => `
          <div class="option ${chosen.has(o.letter)?'selected':''}" data-letter="${o.letter}">
            <div class="opt-letter">${o.letter}</div>
            <div class="opt-text">${escapeHtml(o.text)}</div>
          </div>`).join('')}
      </div>
      <div class="action-row">
        <button class="btn" id="prevBtn" ${e.idx ? '' : 'disabled'}>← Previous</button>
        ${last ? `<button class="btn primary" id="submitBtn">Submit exam</button>` : `<button class="btn primary" id="nextBtn">Next →</button>`}
      </div>
      <div class="nav-head">
        <span>Jump to a question</span>
        <span class="legend"><i class="lg done"></i>answered <i class="lg flag"></i>flagged</span>
      </div>
      <div class="nav-grid">
        ${e.qids.map((id,i) => `<button class="nav-cell ${i===e.idx?'cur':''} ${(e.sel[id]||[]).length?'done':''} ${e.flags[id]?'flag':''}" data-i="${i}">${i+1}</button>`).join('')}
      </div>
      ${last ? '' : `<button class="btn link-btn" id="submitBtn2">Submit exam</button>`}
    </div>`;

  document.querySelectorAll('.option').forEach(el => el.onclick = () => {
    const l = el.dataset.letter;
    if(isMulti) chosen.has(l) ? chosen.delete(l) : chosen.add(l);
    else { chosen.clear(); chosen.add(l); }
    if(chosen.size) e.sel[q.id] = Array.from(chosen).sort(); else delete e.sel[q.id];
    saveExam(e); renderExam();
  });
  const go = i => { e.idx = i; saveExam(e); renderExam(); window.scrollTo(0, 0); };
  document.getElementById('prevBtn').onclick = () => go(e.idx - 1);
  const n = document.getElementById('nextBtn'); if(n) n.onclick = () => go(e.idx + 1);
  document.querySelectorAll('.nav-cell').forEach(c => c.onclick = () => go(+c.dataset.i));
  document.getElementById('flagBtn').onclick = () => { e.flags[q.id] ? delete e.flags[q.id] : e.flags[q.id] = true; saveExam(e); renderExam(); };
  document.getElementById('exitBtn').onclick = () => renderHome();
  ['submitBtn','submitBtn2'].forEach(id => { const b = document.getElementById(id); if(b) b.onclick = confirmSubmit; });

  timer = setInterval(() => {
    const left = e.deadline - Date.now();
    if(left <= 0){ submitExam(true); return; }
    const t = document.getElementById('timer');
    if(t){ t.textContent = fmtClock(left); t.classList.toggle('low', left < 5*60000); }
  }, 1000);
}

function confirmSubmit(){
  const e = state.exam;
  const open = e.qids.length - answeredCount(e), flagged = Object.keys(e.flags).filter(id => e.qids.includes(id)).length;
  const bits = [];
  if(open) bits.push(`${open} question${open>1?'s are':' is'} unanswered`);
  if(flagged) bits.push(`${flagged} ${flagged>1?'are':'is'} flagged for review`);
  if(confirm(`Submit your exam?${bits.length ? '\n\n' + bits.join(' and ') + '.' : ''}`)) submitExam(false);
}

function finishExam(e, timedOut){
  const end = Math.min(Date.now(), e.deadline);
  const answers = e.qids.filter(id => BY_ID[id]).map(qid => {
    const selected = (e.sel[qid] || []).slice().sort();
    return { qid, selected, correct: isRight(BY_ID[qid], selected) };
  });
  const correct = answers.filter(a => a.correct).length;
  const rec = { id:e.id, mode:'exam', startedAt:e.startedAt, finishedAt:end, durationSec:(end - e.startedAt)/1000,
                total:answers.length, correct, pct:Math.round(correct/answers.length*100),
                unanswered:answers.filter(a => !a.selected.length).length, timedOut:!!timedOut, answers };
  const list = loadAttempts(); list.push(rec); saveAttempts(list);
  saveExam(null);
  return rec;
}
function submitExam(timedOut){
  stopTimer();
  const rec = finishExam(state.exam, timedOut);
  state.exam = null;
  renderResults(rec);
}

// ---------- STUDY (one by one, and practising misses) ----------
function startSeq(idx){
  const s = loadSeq();
  if(idx != null) s.idx = idx;
  s.idx = Math.min(Math.max(0, s.idx), QUESTIONS.length - 1);
  state.study = { kind:'seq', qids:QUESTIONS.map(q => q.id), idx:s.idx, ans:s.ans };
  renderStudy();
}
function startPractice(qids){
  state.study = { kind:'practice', qids:shuffle(qids), idx:0, ans:{} };
  renderStudy();
}
function persistStudy(){ const s = state.study; if(s.kind === 'seq') saveSeq({ idx:s.idx, ans:s.ans }); }

function explainHtml(q){
  let html = '';
  if(q.explanation && q.explanation.trim()) html += `<div style="margin-top:6px;">${escapeHtml(q.explanation.trim())}</div>`;
  if(q.rebuilt) html += `<div class="fix-note"><b>Options rebuilt.</b> The PDF lost this question's answer options; they were reconstructed from its explanation.</div>`;
  if(q.correction) html += `<div class="fix-note"><b>Answer corrected.</b> The original question bank said ${escapeHtml(q.correction.was)}. ${escapeHtml(q.correction.basis)}.</div>`;
  return html;
}

function renderStudy(){
  stopTimer(); state.screen = 'study';
  const s = state.study, practice = s.kind === 'practice';
  const q = BY_ID[s.qids[s.idx]];

      </div>

  const optEls = document.querySelectorAll('.option');

  const selected = new Set();

  const next = () => {
    if(!last) return go(s.idx + 1);
    if(practice){
      const answers = s.qids.map(id => s.ans[id]).filter(Boolean);
      renderResults({ practice:true, correct:answers.filter(a=>a.correct).length, total:answers.length, answers });
    } else renderHome();
  };
  const reveal = sel => {
    const r = s.ans[q.id];
    optEls.forEach(el => {
      el.classList.add('locked'); el.classList.remove('selected');
      const l = el.dataset.letter, icon = el.querySelector('.result-icon');
      if(q.answer.includes(l)){ el.classList.add('correct'); icon.textContent = '✓'; }
      else if(sel.has(l)){ el.classList.add('incorrect'); icon.textContent = '✗'; }
    });
    const box = document.getElementById('explainBox');
    box.innerHTML = `<b>${r.correct ? 'Correct' : 'Correct answer: ' + q.answer.slice().sort().join(', ')}</b>` + explainHtml(q);
    box.classList.add('show');
    mainBtn.textContent = last ? (practice ? 'See results' : 'Finish') : 'Next →';
    mainBtn.disabled = false; mainBtn.dataset.locked = '1';
    mainBtn.onclick = next;
    const skip = document.getElementById('skipBtn'); if(skip) skip.remove();
    renderTopStats();
  };

  if(prior) reveal(new Set(prior.selected));
  else {
    optEls.forEach(el => el.onclick = () => {
      if(mainBtn.dataset.locked) return;
      const l = el.dataset.letter;
      if(isMulti){ selected.has(l) ? selected.delete(l) : selected.add(l); el.classList.toggle('selected'); }
      else { selected.clear(); selected.add(l); optEls.forEach(o => o.classList.remove('selected')); el.classList.add('selected'); }
      mainBtn.disabled = selected.size === 0;
    });
    mainBtn.onclick = () => {
      const sel = Array.from(selected).sort();
      s.ans[q.id] = { qid:q.id, selected:sel, correct:isRight(q, sel) };
      persistStudy(); reveal(selected);
    };
  }
  document.getElementById('prevBtn').onclick = () => go(s.idx - 1);
  const skip = document.getElementById('skipBtn'); if(skip) skip.onclick = () => go(s.idx + 1);
  const retry = document.getElementById('retryBtn'); if(retry) retry.onclick = () => { delete s.ans[q.id]; renderStudy(); };
  document.getElementById('exitBtn').onclick = () => {
    if(practice){ state.study = null; state.viewing ? renderAttemptDetail(state.viewing) : renderHome(); }
    else renderHome();   // progress is saved after every answer
  };
}

// keyboard: A–E pick an option, Enter checks / moves on, ← → step through questions
document.addEventListener('keydown', ev => {
  if(!['exam','study'].includes(state.screen) || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  if(['INPUT','TEXTAREA','BUTTON'].includes(ev.target.tagName) && ev.key === 'Enter') return;
  const click = id => { const b = document.getElementById(id); if(b && !b.disabled){ b.click(); return true; } return false; };
  const k = ev.key;
  if(/^[a-hA-H]$/.test(k)){ const o = document.querySelector(`.option[data-letter="${k.toUpperCase()}"]`); if(o){ o.click(); ev.preventDefault(); } }
  else if(k === 'ArrowLeft'){ if(click('prevBtn')) ev.preventDefault(); }
  else if(k === 'ArrowRight'){
    const m = document.getElementById('mainBtn');
    if(click('nextBtn') || click('skipBtn') || (m && m.dataset.locked && click('mainBtn'))) ev.preventDefault();
  }
  else if(k === 'Enter'){ if(click('mainBtn') || click('nextBtn')) ev.preventDefault(); }
});

// ---------- RESULTS ----------
function verdict(pct){
  return pct >= 85 ? "Solid — you're close to exam-ready."
       : pct >= PASS_PCT ? "Passing range — keep drilling the misses."
       : "Below the passing range — review the misses below.";
}
function renderResults(rec){
  stopTimer(); state.screen = 'results'; renderTopStats();
  const pct = rec.total ? Math.round(rec.correct/rec.total*100) : 0;
  const missed = rec.answers.filter(a => !a.correct);
  const attempts = loadAttempts();
  const prev = rec.practice ? null : attempts[attempts.length-2];
  const notes = [];
  if(rec.timedOut) notes.push("Time ran out, so the exam was submitted automatically");
  if(rec.unanswered) notes.push(`${rec.unanswered} left unanswered (counted as wrong)`);
  app.innerHTML = `
    <div class="card">
      <div class="score-hero">
        <div class="score-num">${rec.correct}<span>/${rec.total}</span></div>
        <div class="score-label">${pct}% correct · ${rec.practice ? 'Practice round (not saved to history)' : verdict(pct)}</div>
        ${prev ? `<div class="score-label">${pct>=prev.pct?'Up':'Down'} from ${prev.pct}% last exam${rec.durationSec?` · took ${fmtDur(rec.durationSec)}`:''}</div>` : (rec.durationSec?`<div class="score-label">Took ${fmtDur(rec.durationSec)}</div>`:'')}
        ${notes.length ? `<div class="score-label">${escapeHtml(notes.join(' · '))}</div>` : ''}
      </div>
      <div class="action-row">
        ${rec.practice ? '' : `<button class="btn" id="detailBtn">Review this exam</button>`}
        <button class="btn" id="practiceBtn" ${missed.length?'':'disabled'}>Practice ${missed.length} missed</button>
        <button class="btn primary" id="homeBtn">Done</button>
      </div>
    </div>`;
  const d = document.getElementById('detailBtn'); if(d) d.onclick = () => renderAttemptDetail(rec.id);
  document.getElementById('practiceBtn').onclick = () => startPractice(missed.map(a=>a.qid).filter(id => BY_ID[id]));
  document.getElementById('homeBtn').onclick = () => renderHome();
}

// ---------- HISTORY ----------
function renderHistory(){
  stopTimer(); state.screen = 'history'; state.viewing = null; renderTopStats();
  const list = loadAttempts().slice().reverse();
  const chrono = loadAttempts().slice(-20);
  app.innerHTML = `
    <div class="card">
      <div class="hist-head">
        <div class="setup-title" style="margin:0">Previous exams</div>
        <button class="text-btn" id="backBtn">← Back</button>
      </div>
      ${chrono.length > 1 ? `
        <div class="field-label">Score trend (last ${chrono.length})</div>
        <div class="trend">
          <div class="pass-line" style="bottom:${PASS_PCT}%"><span>${PASS_PCT}%</span></div>
          ${chrono.map(a => `<div class="bar ${a.pct>=PASS_PCT?'ok':''}" style="height:${Math.max(a.pct,3)}%" title="${escapeHtml(fmtDate(a.finishedAt))}: ${a.pct}%"></div>`).join('')}
        </div>` : ''}
      <div class="review-list">
        ${list.map((a,i) => `
          <div class="attempt-row" data-id="${a.id}">
            <div class="ar-num">#${list.length - i}</div>
            <div class="ar-main">
              <div class="ar-date">${escapeHtml(fmtDate(a.finishedAt))}</div>
              <div class="ar-sub">${a.correct}/${a.total} correct · ${fmtDur(a.durationSec)}${a.timedOut?' · timed out':''}</div>
            </div>
            <div class="ar-pct ${a.pct>=PASS_PCT?'ok':'low'}">${a.pct}%</div>
          </div>`).join('')}
      </div>
      <div class="action-row">
        <button class="btn" id="exportBtn">Export history</button>
        <button class="btn" id="importBtn">Import history</button>
        <button class="btn danger" id="clearBtn">Clear all</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>`;
  document.getElementById('backBtn').onclick = () => renderHome();
  document.querySelectorAll('.attempt-row').forEach(el => el.onclick = () => renderAttemptDetail(el.dataset.id));
  document.getElementById('exportBtn').onclick = exportHistory;
  const fileIn = document.getElementById('importFile');
  document.getElementById('importBtn').onclick = () => fileIn.click();
  fileIn.onchange = () => importHistory(fileIn.files[0]);
  document.getElementById('clearBtn').onclick = () => {
    if(confirm('Delete all saved exams? This cannot be undone (export first if you want a copy).')){ saveAttempts([]); renderHome(); }
  };
}

function exportHistory(){
  const data = JSON.stringify({ app:'csa-drill', version:1, exportedAt:Date.now(), attempts:loadAttempts() }, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = 'csa-drill-history-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
}
function importHistory(file){
  if(!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      const incoming = Array.isArray(data) ? data : data.attempts;
      if(!Array.isArray(incoming)) throw new Error('bad file');
      const list = loadAttempts(); const ids = new Set(list.map(a=>a.id));
      let added = 0;
      incoming.forEach(a => { if(a && a.id && Array.isArray(a.answers) && !ids.has(a.id)){ list.push(a); added++; } });
      list.sort((x,y)=>x.finishedAt-y.finishedAt); saveAttempts(list);
      alert(`Imported ${added} exam${added===1?'':'s'}.`); renderHistory();
    } catch(e){ alert("That file doesn't look like a CSA Drill history export."); }
  };
  rd.readAsText(file);
}

// ---------- ATTEMPT DETAIL ----------
function renderAttemptDetail(id){
  stopTimer(); state.screen = 'detail'; state.viewing = id; renderTopStats();
  const list = loadAttempts();
  const n = list.findIndex(a => a.id === id); const a = list[n];
  if(!a){ renderHistory(); return; }
  const rows = a.answers.map((x,i) => ({...x, i, q: BY_ID[x.qid]}));
  const shown = state.wrongOnly ? rows.filter(r => !r.correct) : rows;
  const wrong = rows.filter(r => !r.correct);
  app.innerHTML = `
    <div class="card">
      <div class="hist-head">
        <div>
          <div class="setup-title" style="margin:0">Exam #${n+1} · ${a.pct}%</div>
          <div class="ar-sub">${escapeHtml(fmtDate(a.finishedAt))} · ${a.correct}/${a.total} correct · ${fmtDur(a.durationSec)}</div>
        </div>
        <button class="text-btn" id="backBtn">← All exams</button>
      </div>
      <div class="pill-row" style="margin:16px 0 8px">
        <button class="pill ${state.wrongOnly?'':'active'}" data-f="all">All ${rows.length}</button>
        <button class="pill ${state.wrongOnly?'active':''}" data-f="wrong">Wrong ${wrong.length}</button>
      </div>
      <div class="review-list">
        ${shown.map(r => r.q ? `
          <details class="rv ${r.correct?'right':'wrong'}">
            <summary><span class="ri-mark">${r.correct?'✓':r.selected.length?'✗':'–'}</span><span class="ri-text"><b>Q${r.i+1}.</b> ${escapeHtml(r.q.question.replace(/\s+/g,' '))}</span></summary>
            <div class="rv-body">
              ${r.q.options.map(o => {
                const isAns = r.q.answer.includes(o.letter), picked = r.selected.includes(o.letter);
                return `<div class="rv-opt ${isAns?'ans':''} ${picked&&!isAns?'bad':''}"><span class="opt-letter">${o.letter}</span><span>${escapeHtml(o.text)}</span><span class="rv-tag">${isAns&&picked?'your answer ✓':isAns?'correct':picked?'your answer ✗':''}</span></div>`;
              }).join('')}
              <div class="explain show" style="margin:10px 0 0"><b>Correct answer: ${r.q.answer.join(', ')}</b> · You chose ${r.selected.join(', ') || 'nothing'}${explainHtml(r.q)}</div>
            </div>
          </details>` : `<div class="review-item"><div class="ri-text">Q${r.i+1}: this question is no longer in the bank.</div></div>`).join('')}
      </div>
      <div class="action-row">
        <button class="btn danger" id="delBtn">Delete exam</button>
        <button class="btn primary" id="practiceBtn" ${wrong.length?'':'disabled'}>Practice ${wrong.length} missed</button>
      </div>
    </div>`;
  document.getElementById('backBtn').onclick = renderHistory;
  document.querySelectorAll('.pill[data-f]').forEach(p => p.onclick = () => { state.wrongOnly = p.dataset.f === 'wrong'; renderAttemptDetail(id); });
  document.getElementById('practiceBtn').onclick = () => startPractice(wrong.filter(r=>r.q).map(r => r.qid));
  document.getElementById('delBtn').onclick = () => {
    if(confirm('Delete this exam from your history?')){ saveAttempts(list.filter(x => x.id !== id)); list.length > 1 ? renderHistory() : renderHome(); }
  };
}

// ---------- init ----------
renderHome();

</script>
