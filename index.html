ariable Set for the four variables, then add that variable set to each of the 80 catalog items."}, {"letter": "C", "text": "Create a Record Producer that contains the four fields; then add to the record producer related list on the Catalog Items."}, {"letter": "D", "text": "Create a Flow Designer Action, with Variable Set Data Pill, then apply flow to all of the 80 catalog items."}, {"letter": "E", "text": "Create an Order Guide, which includes all variables; then copy and hide variables as needed."}], "answer": ["B"], "explanation": "A single variable set holding the four variables can be added to all 80 items, so the variables are defined and maintained in one place."}, {"question": "A task worker asks how they can monitor any updates occurring to records assigned to\nhim, like responses from customers. What do you suggest?", "options": [{"letter": "A", "text": "On My Work list, select the Activity Stream icon to show a frame with live updates"}, {"letter": "B", "text": "Click on the eyeglass icon to expand the Monitor frame"}, {"letter": "C", "text": "Open an Agent workspace tab for each record he wants to monitor"}, {"letter": "D", "text": "Select Service Desk > My Work Dashboard"}], "answer": ["A"], "explanation": ""}, {"question": "What access does a user need to be able to import articles to a knowledge base?", "options": [{"letter": "A", "text": "sn_knowledge_import"}, {"letter": "B", "text": "sn_knowledge_contribute"}, {"letter": "C", "text": "Can contribute"}, {"letter": "D", "text": "Can import"}], "answer": ["C"], "explanation": ""}, {"question": "When importing data from a spreadsheet, which step defines where the incoming data\ncolumns will be written in the receiving table?", "options": [{"letter": "A", "text": "Schedule Transform"}, {"letter": "B", "text": "Field Matching"}, {"letter": "C", "text": "Select Data Source"}, {"letter": "D", "text": "Create Transform Map"}, {"letter": "E", "text": "Load Data"}], "answer": ["D"], "explanation": ""}, {"question": "To apply a UI Policy to all views, which field should be set to true in its definition record?", "options": [{"letter": "A", "text": "Global"}, {"letter": "B", "text": "Reverse if false"}, {"letter": "C", "text": "On load"}, {"letter": "D", "text": "Inherit"}], "answer": ["A"], "explanation": ""}, {"question": "What are the steps for importing data using an import set?", "options": [{"letter": "A", "text": "Select source file; Run automap; Transform data; Clean up target table"}, {"letter": "B", "text": "Identity source; Import transform map; Run transformer, Verify import"}, {"letter": "C", "text": "Setup LDAP; Test map; Create update set; Run import; Apply update set"}, {"letter": "D", "text": "Load the data; Create transform map; Transform data; Clean up import table"}], "answer": ["D"], "explanation": ""}, {"question": "Which one of the following statements describes the contents of the Configuration\nManagement Database (CMDB)?", "options": [{"letter": "A", "text": "The CMDB contains data about tangible and intangible business assets"}, {"letter": "B", "text": "The CMDB contains the Business Rules that direct the intangible, configurable assets used by a company"}, {"letter": "C", "text": "The CMDB archives all Service Management PaaS equipment metadata and usage statistics"}, {"letter": "D", "text": "The CMDB contains ITIL process data pertaining to configuration items"}], "answer": ["A"], "explanation": "The CMDB stores data about tangible and intangible business assets (configuration items) and their relationships."}, {"question": "Which type of scripts run in the browser?", "options": [{"letter": "A", "text": "Script Include Scripts"}, {"letter": "B", "text": "Access Control Scripts"}, {"letter": "C", "text": "Business Rule Scripts"}, {"letter": "D", "text": "UI Policies and Client Scripts"}], "answer": ["D"], "explanation": ""}, {"question": "Which modules can you use to create a new table? (Choose two.)", "options": [{"letter": "A", "text": "Dictionary"}, {"letter": "B", "text": "Schema Map"}, {"letter": "C", "text": "Tables"}, {"letter": "D", "text": "Tables & Columns"}], "answer": ["C", "D"], "explanation": ""}, {"question": "Which one of the following describes the primary operations performed against tables\nin the ServiceNow platform?", "options": [{"letter": "A", "text": "Create, Read, Upload, Delete"}, {"letter": "B", "text": "Capture, Rate, Write, Develop"}, {"letter": "C", "text": "Create, Rate, Update, Delete"}, {"letter": "D", "text": "Create, Read, Write, Delete"}], "answer": ["D"], "explanation": ""}, {"question": "How is a user defined in ServiceNow?", "options": [{"letter": "A", "text": "A user is a record stored in the Profile [sys_user_profile] table"}, {"letter": "B", "text": "A user is a record stored in the User [sys_user] table"}, {"letter": "C", "text": "A user is a record stored in the User Preference [sys_user_preference] table"}, {"letter": "D", "text": "A user is a field in the LDAP integration"}], "answer": ["B"], "explanation": ""}, {"question": "Which ServiceNow utility gives a Service Desk agent the ability to trace from a Service\nhaving an issue, to see which CIs supporting that service have active issues?", "options": [{"letter": "A", "text": "CI Dependency View"}, {"letter": "B", "text": "Event Management Homepage"}, {"letter": "C", "text": "Service Dashboard"}, {"letter": "D", "text": "CI Health Dashboard"}], "answer": ["A"], "explanation": ""}, {"question": "Which feature enables business process owners to organize Flow Designer content into\nunified and digitized cross-enterprise processes via a digitized task board interface?", "options": [{"letter": "A", "text": "Flow Designer"}, {"letter": "B", "text": "Workflow Editor"}, {"letter": "C", "text": "Process Workflow Designer"}, {"letter": "D", "text": "Process Automation Designer"}], "answer": ["D"], "explanation": ""}, {"question": "An IT user calls the service desk because they need to work on task records. All they can o an instance?", "options": [{"letter": "A", "text": "Preview, Save, Commit"}, {"letter": "B", "text": "Preview, Retrieve, Commit"}, {"letter": "C", "text": "Retrieve, Commit, Preview"}, {"letter": "D", "text": "Retrieve, Preview, Commit"}], "answer": ["D"], "explanation": ""}, {"question": "A customer asks you to make the following updates to a form:\n1. When Caller field is populated, automatically look up caller location and load it in the\nLocation field.\n2. Add notice at the top of the page when the record is submitted.\nWhat type of script would you use to meet this requirement?", "options": [{"letter": "A", "text": "UI script"}, {"letter": "B", "text": "Server script"}, {"letter": "C", "text": "JavaScript"}, {"letter": "D", "text": "Client script"}], "answer": ["D"], "explanation": ""}, {"question": "Where do Ul Policies run?", "options": [{"letter": "A", "text": "Client-side (browser)"}, {"letter": "B", "text": "Knowledge Base"}, {"letter": "C", "text": "Server-side (database)"}, {"letter": "D", "text": "Within server-side scripts"}], "answer": ["A"], "explanation": ""}, {"question": "You are creating a catalog item for ordering a new desktop computer. The computers\nhave these options:\nColor: Black or Silver -\nRAM: 32 MB or 64MB -\nKeyboard: Standard or Ergonomic -\nMonitor: 24 inch or 32 inch -\nHow would you add these options to the catalog item form?", "options": [{"letter": "A", "text": "Add choices"}, {"letter": "B", "text": "Add variables"}, {"letter": "C", "text": "Add UI options"}, {"letter": "D", "text": "Add fields"}], "answer": ["B"], "explanation": "In ServiceNow, when you want to add options (like color, RAM size, keyboard type, and\nmonitor size) to a catalog item form, you would use variables. These are the input fields\nthat allow the user to make selections or provide data when ordering the item.\n Option       Description\n              Choices are a type of variable, but they're used when you need to define a\n A. Add       list of options for a field (like color or RAM size). You will need to create a\n choices      choice list for each option, but variables are the actual field types on the\n              form.\n              This is the correct approach because you need to create variables for\n     B. Add\n              each option (e.g., Color, RAM, Keyboard, Monitor) to display them on the\n variables\n              form.\n C. Add UI    UI options are related to the behavior of the user interface (like visibility or\n options      making a field read-only), not to adding choices.\n D. Add       Fields refer to the underlying database structure. In this case, you need to\n fields       add variables, not fields, for the catalog item form."}, {"question": "Which form element displays the list of activities, or history, on a task form?", "options": [{"letter": "A", "text": "Action Formatter"}, {"letter": "B", "text": "Activity Formatter"}, {"letter": "C", "text": "Action Stream"}, {"letter": "D", "text": "Sidebar"}], "answer": ["B"], "explanation": ""}, {"question": "What is the function of user impersonation?", "options": [{"letter": "A", "text": "Testing and visibility"}, {"letter": "B", "text": "Activate verbose logging"}, {"letter": "C", "text": "View custom perspectives"}, {"letter": "D", "text": "Unlock Application master list"}], "answer": ["A"], "explanation": ""}, {"question": "Which action enables a user to view and specify date and time formats in their\ninstance?", "options": [{"letter": "A", "text": "Select the User menu > Preferences > Time Settings > Toggle display time zone"}, {"letter": "B", "text": "Ask the user to adjust the time zone on their personal computer"}, {"letter": "C", "text": "Use the system properties to correct the instance's time zone"}, {"letter": "D", "text": "Select the User menu > Preferences > Language & Region > Set date and time format and time zone"}, {"letter": "E", "text": "Create a UI Script to set the default timezone"}], "answer": ["D"], "explanation": "Users set their own date/time format and time zone from User menu > Preferences > Language & Region. System properties change instance-wide defaults, not the user's own preference.", "correction": {"was": "C", "basis": "Verified against ServiceNow docs"}}, {"question": "What information does the System Dictionary contain?", "options": [{"letter": "A", "text": "The human-readable labels and language settings"}, {"letter": "B", "text": "The definition for each table and column"}, {"letter": "C", "text": "The information on how tables relate to each other"}, {"letter": "D", "text": "The language dictionary used for spell checking"}], "answer": ["B"], "explanation": ""}, {"question": "Which storefront is a single location for accessing pre-built spokes, to quickly integrate\nwith third party services to build and share content?", "options": [{"letter": "A", "text": "ServiceNow Store"}, {"letter": "B", "text": "Integration Spoke Store"}, {"letter": "C", "text": "Spoke Store"}, {"letter": "D", "text": "ServiceNow Spoke Store"}], "answer": ["A"], "explanation": ""}, {"question": "When working on a form, what is the difference between Insert and Update operations?", "options": [{"letter": "A", "text": "Insert creates a new record and Update saves changes, both remain on the form"}, {"letter": "B", "text": "Insert creates a new record and Update saves changes, both exit the form"}, {"letter": "C", "text": "Insert saves changes and exits the form, Update saves changes and remains on the form"}, {"letter": "D", "text": "Insert saves changes and remains on the form, Update saves changes and exits the form"}], "answer": ["B"], "explanation": "Insert creates a new record, Update saves changes to the current record, and both then leave the form. (Save and Insert and Stay keep you on the form.)"}, {"question": "The display sequence is controlled in a Service Catalog Item using which of the\nfollowing?", "options": [{"letter": "A", "text": "The Default Value field in the Catalog Item form"}, {"letter": "B", "text": "The Sequence field in the Catalog Item form"}, {"letter": "C", "text": "The Order field in the Variable form"}, {"letter": "D", "text": "The Choice field in the Variable form"}], "answer": ["C"], "explanation": ""}, {"question": "Which group of permissions is used to control Application and Module access?", "options": [{"letter": "A", "text": "Access Control Rules"}, {"letter": "B", "text": "UI Policies"}, {"letter": "C", "text": "Roles"}, {"letter": "D", "text": "Assignment Rules"}], "answer": ["C"], "explanation": ""}, {"question": "Create Incident, Password Reset, and Report outage: what do these services in the\nService Catalog have in common?", "options": [{"letter": "A", "text": "They direct the user to a record producer"}, {"letter": "B", "text": "They direct the user to a catalog property"}, {"letter": "C", "text": "They direct the user to a catalog UI policy"}, {"letter": "D", "text": "They direct the user to a catalog client script"}], "answer": ["A"], "explanation": "The three services in the Service Catalog - Incident, Password Reset, and Report\nOutage - have in common that they all direct the user to a record producer. A record\nproducer is a form that allows users to create a new record, such as an incident or a\npassword reset request, in the ServiceNow platform. When a user requests any of these\nservices, they are directed to a record producer where they can fill out the required\ninformation and submit the request.\nWhile the specific details of each record producer may vary depending on the service\nbeing requested, the commonality between them is that they all serve as the starting\npoint for creating a new record in the ServiceNow platform."}, {"question": "What is the Import Set Table?", "options": [{"letter": "A", "text": "A table where data will be placed, post-transformation"}, {"letter": "B", "text": "A table that determines relationships"}, {"letter": "C", "text": "A staging area for imported records"}, {"letter": "D", "text": "A repository for Update Set information"}], "answer": ["C"], "explanation": "Import Set Table is a staging area for imported records in ServiceNow. It is used to\nimport data from various sources into ServiceNow tables. Import Set Tables provide a\ntemporary holding area for records imported from a data source such as a CSV file, an\nExcel file, or a database table. Once the records are imported into the Import Set Table,\nthey can be transformed and then moved to the appropriate ServiceNow table. The\nImport Set Table is typically used in conjunction with Transform Maps, which define how\nthe imported data is transformed and mapped to ServiceNow tables"}, {"question": "What is a characteristic of importing data into ServiceNow?", "options": [{"letter": "A", "text": "An existing Transform Map can be used one time on the same import set"}, {"letter": "B", "text": "Coalesce fields are used only after running Transform"}, {"letter": "C", "text": "Any user can manage and set up import sets"}, {"letter": "D", "text": "An existing Transform Map can be used multiple times on the same import set"}], "answer": ["D"], "explanation": ""}, {"question": "Which of the following allows a user to edit field values in a list without opening the\nform?", "options": [{"letter": "A", "text": "Data Editor"}, {"letter": "B", "text": "Edit Menu"}, {"letter": "C", "text": "List Editor"}, {"letter": "D", "text": "Form Designer"}], "answer": ["C"], "explanation": ""}, {"question": "Which three Variable Types can be added to a Service Catalog Item?", "options": [{"letter": "A", "text": "True/False, Multiple Choice, and Ordered"}, {"letter": "B", "text": "True/False, Checkbox, and Number List"}, {"letter": "C", "text": "Number List, Single Line Text, and Reference"}, {"letter": "D", "text": "Multiple Choice, Select Box, and Checkbox"}], "answer": ["D"], "explanation": ""}, {"question": "Reports can be created from which different places in the platform? (Choose two.)", "options": [{"letter": "A", "text": "List column heading"}, {"letter": "B", "text": "Metrics module"}, {"letter": "C", "text": "Statistics module"}, {"letter": "D", "text": "View / Run module"}], "answer": ["A", "D"], "explanation": ""}, {"question": "How are Workflows moved between instances?", "options": [{"letter": "A", "text": "Workflows are moved using Update Sets"}, {"letter": "B", "text": "Workflows are moved using Transform Maps"}, {"letter": "C", "text": "Workflows are moved using Application Sets"}, {"letter": "D", "text": "Workflows cannot be moved between instances"}], "answer": ["A"], "explanation": "Update Sets are used to move customizations and configurations from one ServiceNow\ninstance to another. Workflows, being a type of customization, can be moved between\ninstances using Update Sets. When you create an Update Set, you can add workflows to\nit, along with any related components such as tables, fields, business rules, and UI\npages. Once you have created an Update Set, you can then export it from the source\ninstance and import it into the target instance. This allows you to move workflows and\nother customizations between instances as needed."}, {"question": "The baseline Service Catalog homepage contains links to which of the following\ncomponents?", "options": [{"letter": "A", "text": "Record Producers, Order Guides, and Catalog Items"}, {"letter": "B", "text": "Order Guides, Item Variables, and flows"}, {"letter": "C", "text": "Order Guides, Catalog Items, and flows"}, {"letter": "D", "text": "Record Producers, Order Guides, and Item Variables"}], "answer": ["A"], "explanation": ""}, {"question": "Where can Admins check which release is running on an ServiceNow instance?", "options": [{"letter": "A", "text": "Memory Stats module"}, {"letter": "B", "text": "Stats module"}, {"letter": "C", "text": "System.upgraded table"}, {"letter": "D", "text": "Transactions log"}], "answer": ["B"], "explanation": ""}, {"question": "A knowledge article must be which of the following states to display to a user?", "options": [{"letter": "A", "text": "Published"}, {"letter": "B", "text": "Drafted"}, {"letter": "C", "text": "Retired"}, {"letter": "D", "text": "Reviewed"}], "answer": ["A"], "explanation": ""}, {"question": "What is the name of the conversational bot platform that provides assistance to help\nusers obtain information, make decisions, and perform common tasks?", "options": [{"letter": "A", "text": "Answer Agent"}, {"letter": "B", "text": "live Feed"}, {"letter": "C", "text": "Virtual Agent"}, {"letter": "D", "text": "Connect Chat"}], "answer": ["C"], "explanation": ""}, {"question": "What is the purpose of a Related List?", "options": [{"letter": "A", "text": "To create a one-to-many relationship"}, {"letter": "B", "text": "To dot-walk to a core table"}, {"letter": "C", "text": "To present related fields"}, {"letter": "D", "text": "To present related records"}], "answer": ["D"], "explanation": ""}, {"question": "Which term best describes something that is created, has worked performed upon it,\nand is eventually moved to a state of closed?", "options": [{"letter": "A", "text": "report"}, {"letter": "B", "text": "flow"}, {"letter": "C", "text": "event"}, {"letter": "D", "text": "task"}], "answer": ["D"], "explanation": ""}, {"question": "Which are valid Service Now User Authentication Methods? (Choose three.)", "options": [{"letter": "A", "text": "XML feed"}, {"letter": "B", "text": "Local database"}, {"letter": "C", "text": "LDAP"}, {"letter": "D", "text": "SSO"}, {"letter": "E", "text": "FTP authentication"}], "answer": ["B", "C", "D"], "explanation": ""}, {"question": "Knowledge Base Search results can be sorted by which of the following? (Choose\nthree.)", "options": [{"letter": "A", "text": "Most recent update"}, {"letter": "B", "text": "Popularity"}, {"letter": "C", "text": "Relevancy"}, {"letter": "D", "text": "Manager assignment"}, {"letter": "E", "text": "Number of views"}], "answer": ["A", r"}, {"letter": "C", "text": "Formatter"}, {"letter": "D", "text": "Assignment Rule"}], "answer": ["A"], "explanation": ""}, {"question": "How is a group defined in ServiceNow?", "options": [{"letter": "A", "text": "A group is one record stored in the Group Type [sys_user_group_type] table"}, {"letter": "B", "text": "A group is one record stored in the Group [sys_user_group] table"}, {"letter": "C", "text": "A group defines a set of users that share the same location"}, {"letter": "D", "text": "A group defines a set of users that share the same job title"}], "answer": ["B"], "explanation": ""}, {"question": "What is a role in ServiceNow?", "options": [{"letter": "A", "text": "A role is one record in the Role [user_sys_role] table"}, {"letter": "B", "text": "A role is a set of modules for a particular application"}, {"letter": "C", "text": "A role is one record in the Role [sys_user_role] table"}, {"letter": "D", "text": "A role is a persona used in Live Feed Chat"}], "answer": ["C"], "explanation": ""}, {"question": "What is a Notification?", "options": [{"letter": "A", "text": "A new Knowledge article created by a Business Rule"}, {"letter": "B", "text": "A tool for alerting users that events that concern them have occurred"}, {"letter": "C", "text": "A message through Connect related to a Change Request"}, {"letter": "D", "text": "An email file attachment"}], "answer": ["B"], "explanation": ""}, {"question": "Which one of the following is NOT a type of Visual Task Board?", "options": [{"letter": "A", "text": "Flexible"}, {"letter": "B", "text": "Freeform"}, {"letter": "C", "text": "Feature"}, {"letter": "D", "text": "Guided boards"}], "answer": ["C"], "explanation": ""}, {"question": "What is the path an Administrator could take to view the fulfillment stage task list for an\norder placed by a user?", "options": [{"letter": "A", "text": "RITM (Number)>REQ (Number)>PROCUREMENT (Number)"}, {"letter": "B", "text": "REQ (Number)>RITM (Number)>PROCUREMENT (Number)"}, {"letter": "C", "text": "REQ (Number)>RITM (Number)>TASK (Number)"}, {"letter": "D", "text": "FULFILLMENT (Number)>RITM (Number)>TASK (Number)"}], "answer": ["C"], "explanation": ""}, {"question": "What is (are) best practice(s) regarding users/groups/roles? (Choose two.)", "options": [{"letter": "A", "text": "You should never assign roles to groups."}, {"letter": "B", "text": "You should assign roles to users."}, {"letter": "C", "text": "You should add users to groups."}, {"letter": "D", "text": "You should assign roles to groups."}], "answer": ["C", "D"], "explanation": ""}, {"question": "What are two ways to generate an Event? (Choose two.)", "options": [{"letter": "A", "text": "Business Rule"}, {"letter": "B", "text": "Workflow"}, {"letter": "C", "text": "Log entry"}, {"letter": "D", "text": "Knowledge article publication"}], "answer": ["A", "B"], "explanation": ""}, {"question": "Which core table in the ServiceNow platform provides a series of standard fields used\non each of the tables that extend it, such as the Incident [incident] and\nProblem [problem] tables?", "options": [{"letter": "A", "text": "Task [task]"}, {"letter": "B", "text": "Assignment [assignment]"}, {"letter": "C", "text": "Service [service]"}, {"letter": "D", "text": "Workflow [workflow]"}], "answer": ["A"], "explanation": ""}, {"question": "Which of the following statements describes how data is organized in a table?", "options": [{"letter": "A", "text": "A column is a field in the database and a record is one user"}, {"letter": "B", "text": "A column is one field and a record is one row"}, {"letter": "C", "text": "A column is one field and a record is one column"}, {"letter": "D", "text": "A column contains data from one user and a record is one set of fields"}], "answer": ["B"], "explanation": ""}, {"question": "What is a sys_id?", "options": [{"letter": "A", "text": "Unique 32-character identifier that is assigned to every record"}, {"letter": "B", "text": "A client-side Business Rule"}, {"letter": "C", "text": "A server-side Business Rule"}, {"letter": "D", "text": "Unique 64-character identifier that is assigned to every record"}], "answer": ["A"], "explanation": ""}, {"question": "When creating a global custom table named `abc`, what is the table name that is\nautomatically assigned by the platform?", "options": [{"letter": "A", "text": "snc_abc"}, {"letter": "B", "text": "abc"}, {"letter": "C", "text": "u_abc"}, {"letter": "D", "text": "sys_abc"}], "answer": ["C"], "explanation": ""}, {"question": "Access Control rules may provide access security for which of the following database\nobjects?", "options": [{"letter": "A", "text": "For a specific role, group, or user"}, {"letter": "B", "text": "For a specific row, column, or table"}, {"letter": "C", "text": "For specific groups"}, {"letter": "D", "text": "For a specific CMDB Configuration item"}], "answer": ["B"], "explanation": ""}, {"question": "What is the primary application used to load data into ServiceNow?", "options": [{"letter": "A", "text": "Service Level Management"}, {"letter": "B", "text": "Configuration"}, {"letter": "C", "text": "System Import Sets"}, {"letter": "D", "text": "System Update Sets"}], "answer": ["C"], "explanation": ""}, {"question": "Which of the following steps can be used to import new data into ServiceNow from a\nspreadsheet?", "options": [{"letter": "A", "text": "Select Data Source, Schedule Transform"}, {"letter": "B", "text": "Load Data, Create Transform Map, Run Transform"}, {"letter": "C", "text": "Define Data Source, Select Transform Map, Run Transform"}, {"letter": "D", "text": "Select Import Set, Select Transform Map, Run Transform"}], "answer": ["B"], "explanation": ""}, {"question": "Which tool is used for creating dependencies between configuration items in the\nCMDB?", "options": [{"letter": "A", "text": "CI Relationship Editor"}, {"letter": "B", "text": "CMDB Builder"}, {"letter": "C", "text": "CI Service Manager"}, {"letter": "D", "text": "Cl Class Manager"}], "answer": ["A"], "explanation": ""}, {"question": "Which term refers to application menus and modules which you may want to access\nquickly and often?", "options": [{"letter": "A", "text": "Breadcrumb"}, {"letter": "B", "text": "Favorite"}, {"letter": "C", "text": "Tag"}, {"letter": "D", "text": "Bookmark"}], "answer": ["B"], "explanation": ""}, {"question": "Which one of the following is an accurate list of changes that are captured in an Update\nSet?", "options": [{"letter": "A", "text": "Changes made to: tables, forms, schedules, and client scripts"}, {"letter": "B", "text": "Changes made to: tables, forms, Business Rules, and data records"}, {"letter": "C", "text": "Changes made to: tables, forms, groups, and configuration items (CIs)"}, {"letter": "D", "text": "Changes made to: table, forms, views, and fields"}], "answer": ["D"], "explanation": ""}, {"question": "What are the steps to retrieve an Update Set?", "options": [{"letter": "A", "text": "Verify Update Set is Complete, Retrieve, Preview, Apply"}, {"letter": "B", "text": "Verify Update Set is Complete, Test Connection, Apply"}, {"letter": "C", "text": "Verify Update Set is Complete, Test Connection, Commit"}, {"letter": "D", "text": "Verify Update Set is Complete, Retrieve, Preview, Commit"}], "answer": ["D"], "explanation": ""}, {"question": "IntegrationHub enables execution of third-party APIs as a part of a flow. These\nintegrations are referred to as", "options": [{"letter": "A", "text": "an action"}, {"letter": "B", "text": "a spoke"}, {"letter": "C", "text": "a connection"}, {"letter": "D", "text": "an integration step"}], "answer": ["B"], "explanation": ""}, {"question": "Which of the following protects applications by identifying and restricting access to\navailable files and data?", "options": [{"letter": "A", "text": "Application Configuration"}, {"letter": "B", "text": "Verbose Log"}, {"letter": "C", "text": "Access Control Rules"}, {"letter": "D", "text": "Application Scope"}], "answer": ["D"], "explanation": ""}, {"question": "Which one statement correctly describes Access Control rule evaluation?", "options": [{"letter": "A", "text": "Table access rules are evaluated from the general to the specific"}, {"letter": "B", "text": "If more than one rule applies to a record, the older rule is evaluated first"}, {"letter": "C", "text": "If a row level rule and a field level rule exist, both rules must be true before an operation is allowed"}, {"letter": "D", "text": "The role with the most permissions evaluates the rules first."}], "answer": ["C"], "explanation": "A user must pass both the table (row) level rule and the field level rule before the operation is allowed."}, {"question": "ServiceNow contains a resource which provides the following:\n✑ A standard and shared set of service related definitions across ServiceNow products\nand platform that will enable and support true service level reporting.\n✑ A CMDB framework across our products and platform that will enable and support\nmultiple configuration strategies.\nWhat resource do these statements describe?", "options": [{"letter": "A", "text": "Common Services Data Model (CSDM)"}, {"letter": "B", "text": "Information Technology Service Management (ITSM)"}, {"letter": "C", "text": "Configuration Management Database (CMDB)"}, {"letter": "D", "text": "Information Technology Infrastructure Library (ITIL)"}], "answer": ["A"], "explanation": ""}, {"question": "The ServiceNow platform includes which types of interfaces? (Choose three.)", "options": [{"letter": "A", "text": "Now Mobile Apps"}, {"letter": "B", "text": "Agent Control Center"}, {"letter": "C", "text": "Back Office Dashboard"}, {"letter": "D", "text": "Service Portals"}, {"letter": "E", "text": "Now Platform® User Interfaces"}, {"letter": "F", "text": "Field Service Taskboard"}], "answer": ["A", "D", "E"], "explanation": ""}, {"question": "What is generated from the Service Catalog once a user places an order for an item or\nservice?", "options": [{"letter": "A", "text": "A change request"}, {"letter": "B", "text": "An Order Guide"}, {"letter": "C", "text": "A request"}, {"letter": "D", "text": "An SLA"}], "answer": ["C"], "explanation": ""}, {"question": "You are showing your customer a new form that you have created for their new\napplication. They would like to add a field to the form. Where could you do that?\n(Choose two.)", "options": [{"letter": "A", "text": "Select Fields and Columns module"}, {"letter": "B", "text": "Right click on form header, select Configure > Form Layout"}, {"letter": "C", "text": "Click on context menu, select Configure > Form Designer"}, {"letter": "D", "text": "Select Field Class Manager module"}], "answer": ["B", "C"], "explanation": ""}, {"question": "Which ServiceNow resource is a framework that ensures the data your ServiceNow\napplication requires maps correctly to the appropriate CMDB tables?", "options": [{"letter": "A", "text": "Common Service Data Model (CSDM)"}, {"letter": "B", "text": "Service Mapping Utility (SMU)"}, {"letter": "C", "text": "Service Schema Map (SSM)"}, {"letter": "D", "text": "CMDB Class Manager (CMDBCM)"}, {"letter": "E", "text": "CI Class Manager (CICM)"}], "answer": ["A"], "explanation": ""}, {"question": "What do you activate when you want to add applications or functionality within your\ndevelopment instance?", "options": [{"letter": "A", "text": "App Package"}, {"letter": "B", "text": "Updated Pack"}, {"letter": "C", "text": "Patch"}, {"letter": "D", "text": "Plugin"}, {"letter": "E", "text": "App Updated Set"}], "answer": ["D"], "explanation": ""}, {"question": "What is used frequently to move customizations from one instance to another?", "options": [{"letter": "A", "text": "Update Sets"}, {"letter": "B", "text": "Code Sets"}, {"letter": "C", "text": "Update Packs"}, {"letter": "D", "text": "Configuration Logs"}, {"letter": "E", "text": "Remote Sets"}, {"letter": "F", "text": "Local Sets"}, {"letter": "G", "text": "Code Packs"}], "answer": ["A"], "explanation": ""}, {"question": "What icon do you use to change the label on a Favorite?", "options": [{"letter": "A", "text": "Clock"}, {"letter": "B", "text": "Hamburger"}, {"letter": "C", "text": "Pencil"}, {"letter": "D", "text": "Three dots"}, {"letter": "E", "text": "Triangle."}, {"letter": "F", "text": "Star"}], "answer": ["C"], "explanation": ""}, {"question": "What feature can track the amount of time that a task has been open, to ensure that\ntasks are completed within an allotted time?", "options": [{"letter": "A", "text": "Task Escalation Clock"}, {"letter": "B", "text": "Service Level Agreements"}, {"letter": "C", "text": "Inactivity Monitor"}, {"letter": "D", "text": "Response Time Clock"}, {"letter": "E", "text": "Business Time Remaining"}], "answer": ["B"], "explanation": ""}, {"question": "A Service Catalog may include which of the following components?", "options": [{"letter": "A", "text": "Order Guides, Exchange Rates, Calendars"}, {"letter": "B", "text": "Order Guides, Catalog Items, and Interceptors"}, {"letter": "C", "text": "Catalog Items, Asset Contracts, Task Surveys"}, {"letter": "D", "text": "Record Producers, Order Guides, and Catalog Items"}], "answer": ["D"], "explanation": "", "added": true}, {"question": "Which icon would you double click, to expand and collapse the list of all Applications and Modules?", "options": [{"letter": "A", "text": "Star"}, {"letter": "B", "text": "Clock"}, {"letter": "C", "text": "Application"}, {"letter": "D", "text": "Funnel"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "Two departments (HR Onboarding and Facilities) have come to you, asking for a way for employees to request event room set up services. The requirements are the same for the form and the task routing to the Facilities' assignment group. ✑ For HR, the item will be used primarily for the Onboarding coordinators, for employee orientation sessions. ✑ For Facilities, the item will be used for anyone in the company who needs room set up services. However, both departments have their own service catalogs. What do you do, to support these requirements?", "options": [{"letter": "A", "text": "Create one Catalog Item for HR Event Room Set Up and one for Facilities Event Room Set Up; then publish each to the appropriate Catalog."}, {"letter": "B", "text": "Create one Catalog Item for Event Room Set Up; then publish to both Catalogs."}, {"letter": "C", "text": "Create one Catalog Item for Event Room Set Up; then publish to the Parent Catalog, which is accessible to both HR and Facilities."}, {"letter": "D", "text": "Create one Catalog Item for Event Room Set Up; then use ACLs to control access."}], "answer": ["B"], "explanation": "", "added": true}, {"question": "Which collaboration tool is available from the banner, using the bubble icon?", "options": [{"letter": "A", "text": "Now Messenger"}, {"letter": "B", "text": "Agent Chat"}, {"letter": "C", "text": "Connect Chat"}, {"letter": "D", "text": "Collaborate Now"}, {"letter": "E", "text": "Live Feed"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "What is a key difference between Reporting and Performance Analytics?", "options": [{"letter": "A", "text": "Performance Analytics contains snapshots of data taken over time; Reporting shows only the data as it is, at the moment the report is run."}, {"letter": "B", "text": "Performance Analytics can show trends; Reports cannot."}, {"letter": "C", "text": "Reports can be run on a scheduled basis; Performance Analytics cannot."}, {"letter": "D", "text": "Performance Analytics data can be published to Dashboards; Reports cannot."}, {"letter": "E", "text": "Performance Analytics shows KPIs; Reporting does not."}], "answer": ["A"], "explanation": "", "added": true}, {"question": "A manager wants to view a snapshot of month-end Sales performance data, as compared to Sales targets. In addition, the manager wants to be able to see those monthly numbers trended over time, and forecasted into the future. What capability do you suggest for this manager?", "options": [{"letter": "A", "text": "Scheduled Reports, a custom snapshot table, and a Trend report"}, {"letter": "B", "text": "Scheduled Reports and Excel"}, {"letter": "C", "text": "Scheduled Reports, a custom snapshot table, and a Projection report"}, {"letter": "D", "text": "Performance Analytics"}, {"letter": "E", "text": "Key Performance Indicators"}], "answer": ["D"], "explanation": "", "added": true}, {"question": "Which one of the following statements is a recommendation from ServiceNow about Update Sets?", "options": [{"letter": "A", "text": "Avoid using the Default Update set as an Update Set for moving customizations from instance to instance"}, {"letter": "B", "text": "Before moving customizations from instance to instance with Update Sets, ensure that both instances are different versions"}, {"letter": "C", "text": "Use the Baseline Update Set to store the contents of items after they are changed the first time"}, {"letter": "D", "text": "Once an Update Set is closed as \"Complete\", change it back to \"In Progress\" until it is applied to another instance"}], "answer": ["A"], "explanation": "The Default update set captures changes that aren't in a user-created update set. It is recommended not to use the Default update set to move customizations between instances; use a named, user-created update set instead.", "added": true}, {"question": "Which statement correctly describes the differences between a Client Script and a Business Rule?", "options": [{"letter": "A", "text": "A Client Script executes before a record is loaded and a Business Rule executes after a record is loaded"}, {"letter": "B", "text": "A Client Script executes on the server and a Business Rule executes on the client"}, {"letter": "C", "text": "A Client Script executes on the client and a Business Rule executes on the server"}, {"letter": "D", "text": "A Client Script executes before a record is loaded and a Business Rule executes after a record is updated"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "What is the result of the order in which access controls are evaluated?", "options": [{"letter": "A", "text": "Ensures user has access to the fields in a table, before considering their access to the table"}, {"letter": "B", "text": "Ensures user can get to work as quickly as possible"}, {"letter": "C", "text": "Ensures user has access to the application, before evaluating access to a module within the application"}, {"letter": "D", "text": "Ensures user has access to a table, before evaluating access to a field in the table"}], "answer": ["D"], "explanation": "ACL evalutes access to table first (specific to general) then it evaluates field (specific to general)", "added": true}, {"question": "You have been asked to configure a form so an employee could order tablet and select the standard accessory options to purchase with it. These standard options are: carrying case, screen cleaner, tablet stand, and screen protector. What approach would you take? (Choose three.)", "options": [{"letter": "A", "text": "Create Catalog Item for the Tablet, and add a variable set to the form, for the accessory options."}, {"letter": "B", "text": "Create a Record producer, and on the form, add a check box variable for each accessory option."}, {"letter": "C", "text": "On Shopping Cart configuration, select option to show the Add Accessories button."}, {"letter": "D", "text": "Create one Catalog item for each: tablet, carrying case, screen cleaner, tablet stand, and screen protector."}, {"letter": "E", "text": "Create Catalog Item for the tablet, and on the form, add a check box variable for each accessory option."}], "answer": ["A", "D", "E"], "explanation": "", "added": true}, {"question": "Which one of the following statements applies to a set of fields when they are coalesced during an import?", "options": [{"letter": "A", "text": "If a match is found using the coalesce fields, the existing record is updated with the information being imported"}, {"letter": "B", "text": "If a match is not found using the coalesce fields, the system does not create a Transform Map"}, {"letter": "C", "text": "If a match is found using the coalesce fields, the system creates a new record"}, {"letter": "D", "text": "If a match is not found using the coalesce fields, the existing record is updated with the information being imported"}], "answer": ["A"], "explanation": "", "added": true}, {"question": "Which one of the following statements is true about Column Context Menus?", "options": [{"letter": "A", "text": "It displays actions such as creating quick reports, configuring the list, and exporting data"}, {"letter": "B", "text": "It displays actions related to filtering options, assigning tags, and search"}, {"letter": "C", "text": "It displays actions related to viewing and filtering the entire list"}, {"letter": "D", "text": "It displays actions such as view form, view related task, and add relationship"}], "answer": ["A"], "explanation": "Column Context Menus a.k.a Column Options – found on the header of each field (the 3 dots on the left of field header) B – Assigning tags is on “Actions on selected rows” tab and search is the tab with magnifying glass. Both is on the top right corner. C- This is actually true but A is more precise. So A is the answer D – these actions are on each row/record, on the “i” (info) icon not on Column Context Menu", "added": true}, {"question": "When managing tags, you can adjust who is able to see it. What are the visibility options? (Choose three.)", "options": [{"letter": "A", "text": "Groups and Users"}, {"letter": "B", "text": "Me"}, {"letter": "C", "text": "Roles and Permissions"}, {"letter": "D", "text": "Everyone"}, {"letter": "E", "text": "Admins"}], "answer": ["A", "B", "D"], "explanation": "", "added": true}, {"question": "In what order are Access Controls evaluated?", "options": [{"letter": "A", "text": "Field-level - most specific to most general; then Table-level - most specific to most general"}, {"letter": "B", "text": "Field-level - most general to most specific; then Row-level - most specific to most general"}, {"letter": "C", "text": "Table-level - most specific to most general; then Field-level - most specific to most general"}, {"letter": "D", "text": "Table-level - most specific to most general, then Row-level - most specific to most general"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "When looking at a long list of records, you want to quickly filter, to show only those which have Short Description containing email. How might you do that?", "options": [{"letter": "A", "text": "Click List Magnifier to expand column search, on Short Description, type email, click enter"}, {"letter": "B", "text": "On Search box, select text, type email, click enter"}, {"letter": "C", "text": "Click List Magnifier to expand column search, on Short Description, type *email, click enter"}, {"letter": "D", "text": "Click List Magnifier to expand column search, on Short Description, type %email, click enter"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "When using the Load Data and Transform Map process, what is the Mapping Assist used for?", "options": [{"letter": "A", "text": "Mapping fields using the Import Log"}, {"letter": "B", "text": "Mapping fields using Transform History"}, {"letter": "C", "text": "Mapping fields using an SLA"}, {"letter": "D", "text": "Mapping fields using a Field Map"}], "answer": ["D"], "explanation": "", "added": true}, {"question": "On a form, which type of field has this icon which can be clicked, to see a preview of the associated record?", "options": [{"letter": "A", "text": "Lookup"}, {"letter": "B", "text": "Preview"}, {"letter": "C", "text": "Reference"}, {"letter": "D", "text": "Snapshot"}, {"letter": "E", "text": "Quickview"}, {"letter": "F", "text": "Drilldown"}], "answer": ["C"], "explanation": "The button is preview but there is no Preview Field Type in ServiceNow. So the only logical answer is Reference.", "added": true}, {"question": "How would you distinguish between a Base Class table and a Parent Class table?", "options": [{"letter": "A", "text": "Extended tables are always extended from Parent tables. Extended tables are usually extended from Base tables."}, {"letter": "B", "text": "Extended tables can be extended from Parent tables or Base tables; but they cannot be extended from both."}, {"letter": "C", "text": "Base Class tables always have tables extended from them. Parent tables do not have tables extended from them."}, {"letter": "D", "text": "Base Class table is not extended from another table, Parent class tables may be extended from another table."}], "answer": ["D"], "explanation": "A table that extends another table is called a child class, and the table it extends is the parent class. A table can be both a parent and child class both extending and providing extensions for other tables. A parent class that is not an extension of another table is called a base class.", "added": true}, {"question": "How would you navigate to the Schema map for a table?", "options": [{"letter": "A", "text": "System Definition > Tables; Select Table; Go to Related links and click Show Schema Map"}, {"letter": "B", "text": "System Dictionary > Show Schema Map; Select Table"}, {"letter": "C", "text": "System Definition > Show Schema Map; Select Table"}, {"letter": "D", "text": "System Definition > Dictionary; Select Table; Go to Related links and click Show Schema Map"}], "answer": ["A"], "explanation": "", "added": true}, {"question": "Here is an example of the criteria set for a knowledge base: • Companies: ACME North America • Departments: HR • Groups: ACME Managers • Match All: Yes In this example, what users would have access to this knowledge base?", "options": [{"letter": "A", "text": "Members of the ACME Manager group, who are also members of HR Department and part of ACME North America"}, {"letter": "B", "text": "Employees of ACME North America, who are members of HR Department or the ACME Managers group"}, {"letter": "C", "text": "Users which are members of either ACME North America, or HR Department, or ACME Managers group"}, {"letter": "D", "text": "Members of the ACME Managers group, and HR department, regardless of geography"}], "answer": ["A"], "explanation": "", "added": true}, {"question": "When adding a related list to a form, you choose the related list from the list collector. What is an example of a related list you might see on the list collector? (Choose three.)", "options": [{"letter": "A", "text": "Problem==Parent"}, {"letter": "B", "text": "HR Case->Parent"}, {"letter": "C", "text": "Catalog Task->Parent"}, {"letter": "D", "text": "Outage->Task number"}, {"letter": "E", "text": "Release Phase==Parent"}], "answer": ["B", "C", "D"], "explanation": "Related lists in the collector are shown as Table->Field (the reference field that links the tables), for example Catalog Task->Parent or Outage->Task number. The '==' format is not used. (The source bank marked this answer as uncertain.)", "added": true}, {"question": "How is the ServiceNow platform set up so that Administrators can easily configure their instances to send an email at the end of an upgrade?", "options": [{"letter": "A", "text": "Administrators can update the email notification named \"System Upgraded\" in the System Logs module by adding the appropriate User to receive it."}, {"letter": "B", "text": "Administrators can update the email notification named \"System Upgraded\" in the Notifications module by adding the appropriate User to receive it."}, {"letter": "C", "text": "Administrators can write a Client Script to send out an email to the Administrator when an Update is complete."}, {"letter": "D", "text": "Administrators can write a Business Rule to send out an email to the Administrator when an Update is complete."}], "answer": ["B"], "explanation": "", "added": true}, {"question": "For your implementation, the following tables are extended from each other: • Incident table is extended from Task table. • Super Incident table is extended from Incident table. In this situation, which table(s) are Parent, Child and Base tables? (Choose five.)", "options": [{"letter": "A", "text": "Super Incident table is a Parent table"}, {"letter": "B", "text": "Incident table is a Child table"}, {"letter": "C", "text": "Super Incident table is a Base table"}, {"letter": "D", "text": "Incident table is a Base table"}, {"letter": "E", "text": "Task table is a Child table"}, {"letter": "F", "text": "Incident table is a Parent table"}, {"letter": "G", "text": "Super Incident table is a Child table"}, {"letter": "H", "text": "Task table is a Parent table"}, {"letter": "I", "text": "Task table is a Base table"}], "answer": ["B", "F", "G", "H", "I"], "explanation": "", "added": true}, {"question": "Which of the following statement describes the purpose of an Order Guide?", "options": [{"letter": "A", "text": "Order Guides restrict the number of items in an order to only one item per request"}, {"letter": "B", "text": "Order Guide provide a list of guidelines for Administrators on how to set up item variables"}, {"letter": "C", "text": "Order Guide provide the ability to order multiple, related items as one request"}, {"letter": "D", "text": "Order Guides take the user directly to the checkout without prompting for information"}], "answer": ["C"], "explanation": "An Order Guide in ServiceNow is a feature used in the Service Catalog to help users request multiple related items or services in a structured and streamlined way. Purpose: It simplifies complex requests by bundling related items together under a single request flow. Example Use Case: An \"Onboarding Order Guide\" for new employees might include: • A laptop • Access to certain applications • A mobile phone • Security badge", "added": true}, {"question": "You are editing a new incident record and would like the \"Save\" button to be located on the Form header. Which action would need to be taken for that button to appear?", "options": [{"letter": "A", "text": "Context Menu > Form Design > add the “Save” button."}, {"letter": "B", "text": "All > System Properties > UI Properties > Turn on the “glide.ui.advanced” property."}, {"letter": "C", "text": "All > System Properties > UI Properties > Turn on the “Save” button."}, {"letter": "D", "text": "Context Menu > Form Layout > add the “Save” button."}], "answer": ["C"], "explanation": "", "added": true}, {"question": "Which features ensures data consistency while importing data using import sets and web services?", "options": [{"letter": "A", "text": "UI Policy"}, {"letter": "B", "text": "Data Policy"}, {"letter": "C", "text": "Business Rule"}, {"letter": "D", "text": "Client Script"}, {"letter": "E", "text": "CSDM"}], "answer": ["B"], "explanation": "", "added": true}, {"question": "An order from the Service Catalog has been placed. Two records in the Platform are created as a result. Which two records are associated with this newly ordered item? (Choose two.)", "options": [{"letter": "A", "text": "A record of sc_req_item table"}, {"letter": "B", "text": "A record of sc_task"}, {"letter": "C", "text": "An incident record"}, {"letter": "D", "text": "A change record"}, {"letter": "E", "text": "A problem record"}], "answer": ["A", "B"], "explanation": "", "added": true}, {"question": "As it relates to ServiceNow reporting, which of the following statements describes what a metric can do?", "options": [{"letter": "A", "text": "A metric is a report gauge used on homepages to display real-time data"}, {"letter": "B", "text": "A metric is a time measurement used to report the effectiveness of workflows and SLAs"}, {"letter": "C", "text": "A metric is used to measure and evaluate the effectiveness of IT service management processes"}, {"letter": "D", "text": "A metric is a comparative measurement used to report the effectiveness of flows and SLAs."}], "answer": ["C"], "explanation": "", "added": true}, {"question": "If users would like to locate and assign a task to themselves in the Platform, what action could they perform from the list view to make the assignment? (Choose two.)", "options": [{"letter": "A", "text": "Select the record using the check box, then select the Person icon"}, {"letter": "B", "text": "Select the record using the check box then select the Assign To Me UI action on the List Header"}, {"letter": "C", "text": "Double click on the Assigned to value, type the name of the user, and select the green check"}, {"letter": "D", "text": "Right click on the Task number and select the Assign to me option in the menu"}, {"letter": "E", "text": "Select the Task number, and select the Assign to me UI action on the form"}], "answer": ["C", "D"], "explanation": "", "added": true}, {"question": "Which action enables personalization in a form for the admin role, only?", "options": [{"letter": "A", "text": "Navigate to sys_form_properties.list and set the property glide.ui.enable_personalize_form.admin to true."}, {"letter": "B", "text": "Navigate to Context Menu > Configure > Form Layout and select ‘Enable Personalization’ and Enter the ‘admin’ role."}, {"letter": "C", "text": "Navigate to Context Menu > Configure > Table and add the role ‘Admin’ in the ‘Available User’ list box."}, {"letter": "D", "text": "Navigate to sys_properties.list find the property glide.ui.personalize_form.role and set the Value to admin."}], "answer": ["D"], "explanation": "", "added": true}, {"question": "What is a schema map?", "options": [{"letter": "A", "text": "A schema map enables administrators to define records from specific tables as trouble sources for Configuration Items"}, {"letter": "B", "text": "A schema map graphically organizes the visual task boards for the CMDB"}, {"letter": "C", "text": "A schema map graphically displays the k record, how would an administrator change the priority choice options?", "options": [{"letter": "A", "text": "In the Context menu of the form, select Configure Options"}, {"letter": "B", "text": "Right-click the Priority Label > select Configure Lists"}, {"letter": "C", "text": "Right-click the Priority Label > select Configure Choices"}, {"letter": "D", "text": "Open the Data Dictionary > select Values"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "Your customer wants to update a notification so it is sent to the Caller's Manager. Which action supports this requirement?", "options": [{"letter": "A", "text": "On the 'Who will receive' tab on the Notification record add the Caller field, then dot walk to the Caller's Manager field to add it."}, {"letter": "B", "text": "On the Notification record create a flow and include a notification in the flow for \"All receivers\"."}, {"letter": "C", "text": "On the 'Send to' tab on the Notification record, add the Caller field, then dot walk to the Caller’s Manager field to add it."}, {"letter": "D", "text": "On the 'Send to' tab on the Notification record, set \"Who will receive\" to Subscribable."}], "answer": ["A"], "explanation": "", "added": true}, {"question": "How is the Event Log different from the Event Registry?", "options": [{"letter": "A", "text": "Event Log contains generated Events, the Event Registry is a table of Event definitions"}, {"letter": "B", "text": "Event Log is formatted in the Log style, the Event Registry displays different fields"}, {"letter": "C", "text": "Event Log lists Events that were triggered by integrations, the Event Registry lists the Events that were triggered during the day (24-hour period)"}, {"letter": "D", "text": "Event Log is the same as the Event Registry"}], "answer": ["A"], "explanation": "", "added": true}, {"question": "What is a Dictionary Override?", "options": [{"letter": "A", "text": "A Dictionary Override is an incoming customer update in an Update Set which applies to the same objects as a newer local customer update"}, {"letter": "B", "text": "A Dictionary Override is the addition, modification, or removal of anything that could have an effect on IT services"}, {"letter": "C", "text": "A Dictionary Override is a task within a flow that requests an action before the flow can continue"}, {"letter": "D", "text": "A Dictionary Override sets field properties in extended tables"}], "answer": ["D"], "explanation": "dictionary overrides can be used to set field properties in extended tables in ServiceNow. An extended table is a custom database table that is created by extending an existing base table in the platform. When you create an extended table, you can specify which fields from the base table you want to include in the new table, as well as any additional fields that are specific to the extended table. You can use dictionary overrides to modify the properties of fields in an extended table in much the same way as you would for fields in a base table. For example, you might use a dictionary override to change the label or description of a field, or to specify a default value or a custom picker for that field. It is important to note that dictionary overrides apply to the specific field that they are defined for, and do not affect other fields in the same table or in related tables. So if you want to modify the properties of multiple fields in an extended table, you will need to create separate dictionary overrides for each field.", "added": true}, {"question": "What is a Record Producer?", "options": [{"letter": "A", "text": "A Record Producer is a type of Catalog Item that is used for Requests, not Services"}, {"letter": "B", "text": "A Record Producer creates user records"}, {"letter": "C", "text": "A Record Producer is a type of Catalog Item that provides easy ordering by bundling requests"}, {"letter": "D", "text": "A Record Producer is a type of a Catalog Item that allows users to create task-based records from the Service Catalog"}], "answer": ["D"], "explanation": "In the context of IT service management and ServiceNow platform, a Record Producer is a type of Catalog Item that enables users to create new records of a specified table and task-based records from the Service Catalog interface. It is a form-based interface that presents users with fields and options to fill in, which then generates a new record in the designated table with the entered information. Record Producers are often used to facilitate user self-service and automate the creation of records for various types of requests, such as incidents, change requests, or service requests. They can also be used to bundle multiple requests into a single, easyto-use interface, making it simpler for users to order multiple services or items at once.", "added": true}, {"question": "What module in the Service Catalog application does an Administrator access to begin creating a new item?", "options": [{"letter": "A", "text": "Maintain Categories"}, {"letter": "B", "text": "Maintain Items"}, {"letter": "C", "text": "Content Items"}, {"letter": "D", "text": "Items"}], "answer": ["B"], "explanation": "", "added": true}, {"question": "Which of the following statements is true when a new table is created by extending another table?", "options": [{"letter": "A", "text": "The new table archives the parent table and assumed its roles in the database"}, {"letter": "B", "text": "The new table inherits all of the Business Rules, Client Scripts, and UI Policies of the parent table, but none of the existing fields"}, {"letter": "C", "text": "The new table inherits all of the fields of the parent table and can also contain new fields unique to itself"}, {"letter": "D", "text": "The new table inherits all of the fields, but does not inherit Access Control rules, Client Scripts, and UI Policies of the parent table"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "Which one of the following statements describes the purpose of a Service Catalog flow?", "options": [{"letter": "A", "text": "A Service Catalog flow generates three basic components: item variable types, tasks, and approvals"}, {"letter": "B", "text": "Although a Service Catalog flow cannot send notifications, the flow drives complex fulfillment processes"}, {"letter": "C", "text": "A Service Catalog flow is used to drive complex fulfillment processes and sends notifications to defined users or groups"}, {"letter": "D", "text": "A Service Catalog flow generates three basic components: item variable types, tasks, and notifications"}], "answer": ["C"], "explanation": "Service Catalog flows are designed to automate and orchestrate complex processes related to service fulfillment, such as provisioning resources or handling service requests. Additionally, they can incorporate notifications to inform stakeholders about the progress or completion of these processes.", "added": true}, {"question": "What is the difference between a UI Policy and Data Policy?", "options": [{"letter": "A", "text": "Data Policies run when data is entered through the form, by an Import Set, or by web services, while UI Policies are set only by web services"}, {"letter": "B", "text": "Data Policies can be converted into UI Policies, but UI Policies cannot be converted into Data Policies"}, {"letter": "C", "text": "Data Policies run regardless of how data is entered into ServiceNow, while UI Policies are used for form interactions"}, {"letter": "D", "text": "Data Policies run only after UI Policies run successfully"}], "answer": ["C"], "explanation": "", "added": true}, {"question": "What do you need to do before you can use an Application-based trigger in your flow?", "options": [{"letter": "A", "text": "Activate application trigger spoke"}, {"letter": "B", "text": "Activate trigger security rules"}, {"letter": "C", "text": "Activate application spoke, and plug-ins as needed"}, {"letter": "D", "text": "Assign Application trigger role [sn_app st to specify First Line [sn_first_line] role"}, {"letter": "B", "text": "Create Catalog Item and use the Not Available list to specify the Manager Group"}, {"letter": "C", "text": "Create Catalog Item and use the Available For list to specify ITIL [itil] role"}, {"letter": "D", "text": "Create Order Guide and use the User Criteria list to specify First Line [sn_first_line] role"}], "answer": ["B"], "explanation": "", "added": true}, {"question": "What needs to be specified, when creating a Business Rule? (Choose four.)", "options": [{"letter": "A", "text": "UI Action"}, {"letter": "B", "text": "Table"}, {"letter": "C", "text": "Assignment group"}, {"letter": "D", "text": "Notification recipients"}, {"letter": "E", "text": "Script to run"}, {"letter": "F", "text": "Update set"}, {"letter": "G", "text": "Form view"}, {"letter": "H", "text": "When to run (timing)"}, {"letter": "I", "text": "Condition to evaluate"}], "answer": ["B", "E", "H", "I"], "explanation": "Every business rule defines what table it runs against, when it runs (before/after/async/display), the conditions to evaluate, and the script to run based on that evaluation.", "rebuilt": true, "added": true}, {"question": "If you have the Impersonate role, what type of user are you not able to impersonate?", "options": [{"letter": "A", "text": "Customer"}, {"letter": "B", "text": "VIP"}, {"letter": "C", "text": "System Administrator"}, {"letter": "D", "text": "Approver"}, {"letter": "E", "text": "Catalog User"}], "answer": ["C"], "explanation": "Users with the impersonator role can impersonate other users to troubleshoot and validate their experience, but they cannot impersonate a System Administrator. This keeps administrative access secure.", "added": true, "recovered": true}, {"question": "In ServiceNow, what feature allows users to save shortcuts to frequently used applications and modules for easy access?", "options": [{"letter": "A", "text": "Quick Link"}, {"letter": "B", "text": "Favorite"}, {"letter" ns in ServiceNow? (Choose three.)", "options": [{"letter": "A", "text": "Form buttons, form links, and list buttons"}, {"letter": "B", "text": "System properties and user notifications"}, {"letter": "C", "text": "Dashboard widgets and user role assignments"}, {"letter": "D", "text": "List choices and list links"}, {"letter": "E", "text": "Form context menu items and list context menu items"}], "answer": ["A", "D", "E"], "explanation": "UI Actions can appear as form buttons, form links, form context menu items, list buttons, list links, list choices and list context menu items.", "added": true, "recovered": true}, {"question": "What is the advised depth for nesting categories in ServiceNow?", "options": [{"letter": "A", "text": "1-2 levels deep"}, {"letter": "B", "text": "3-4 levels deep"}, {"letter": "C", "text": "No limit"}, {"letter": "D", "text": "4-5 levels deep"}], "answer": ["A"], "explanation": "Keep catalog categories shallow (1-2 levels) so users can find items quickly.", "added": true, "recovered": true}, {"question": "Which statement best describes the request management process in ServiceNow?", "options": [{"letter": "A", "text": "It automates the deployment of service requests"}, {"letter": "B", "text": "It involves creating and managing knowledge articles"}, {"letter": "C", "text": "It is primarily for tracking software development projects"}, {"letter": "D", "text": "It begins after placing an order and includes workflows that facilitate approval and fulfillment tasks"}, {"letter": "E", "text": "It is used to resolve incidents reported by end-users"}], "answer": ["D"], "explanation": "Request management starts once an order is placed, then runs flows/workflows that drive approvals and fulfillment tasks.", "added": true, "recovered": true}, {"question": "Which of the following components are part of a filter condition in ServiceNow? (Choose three.)", "options": [{"letter": "A", "text": "Table"}, {"letter": "B", "text": "Field"}, {"letter": "C", "text": d against ServiceNow docs"}}, {"question": "What is a child class in ServiceNow?", "options": [{"letter": "A", "text": "A table that extends another table"}, {"letter": "B", "text": "A table that defines multiple records on a list"}, {"letter": "C", "text": "A field that references another table"}, {"letter": "D", "text": "A unique identifier for a record"}], "answer": ["A"], "explanation": "A child class is a table that extends another table. It inherits the parent class's fields and can add its own.", "added": true, "recovered": true}, {"question": "What is the purpose of a load-balanced instance in ServiceNow?", "options": [{"letter": "A", "text": "To distribute traffic across multiple servers for performance"}, {"letter": "B", "text": "To store backup data in multiple locations"}, {"letter": "C", "text": "To provide a read-only environment for testing"}, {"letter": "D", "text": "To ensure data is shared among multiple customers"}], "answer": ["A"], "explanation": "Load balancing distributes user traffic across multiple application nodes for performance and availability.", "added": true, "recovered": true}, {"question": "What URL format is typically used for ServiceNow instances?", "options": [{"letter": "A", "text": "https://service-now.<instance name>.com"}, {"letter": "B", "text": "https://<instance name>.servicenow.com"}, {"letter": "C", "text": "https://<instance name>.service-now.com"}, {"letter": "D", "text": "https://service.now.<instance name>.com"}], "answer": ["C"], "explanation": "Instances use the format https://<instance name>.service-now.com.", "added": true, "recovered": true}, {"question": "What is an example of a customization task in ServiceNow?", "options": [{"letter": "A", "text": "Adding fields to a form"}, {"letter": "B", "text": "Configuring list views"}, {"letter": "C", "text": "Enhancing a portal widget to display lists with complex access controls"}, {"letter": "D", "text": "Creating a service catalog"}], "answer": ["C"], "explanation": // ---------- constants ----------
const EXAM_SIZE = 60;
const EXAM_MINUTES = 90;
const PASS_PCT = 70;
const STORE_KEY = 'csa_drill_attempts_v1';
const CURRENT_KEY = 'csa_drill_current_v1';
const SEQ_KEY = 'csa_drill_sequential_v1';

// ---------- helpers ----------
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s){ return s.replace(/\s+/g,' ').trim().toLowerCase(); }
function hash(str){ let h=5381; for(let i=0;i<str.length;i++){ h=((h<<5)+h+str.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m>=60 ? `${Math.floor(m/60)}h ${m%60}m` : `${m}m ${String(s).padStart(2,'0')}s`; }
function fmtClock(ms){ const sec=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`; }
function isRight(q, sel){ return sel.length === q.answer.length && sel.every(l => q.answer.includes(l)); }

// The bank came from a PDF, so sentences are hard-wrapped mid-line. Join them back into
// paragraphs, keeping a line break where a list item (•, ✑, *, -, 1.) starts and where the
// text carries on after a list.
const LIST_ITEM = /^([•✑*\-–]|\d+[.)]\s)/;
function cleanText(s, isExplain){
  if(!s) return s;
  let t = '', inList = false;
  for(const l of s.replace(/\r/g,'').split('\n').map(l => l.trim()).filter(Boolean)){
    const item = LIST_ITEM.test(l);
    const afterList = !item && inList && /[.?!:]$/.test(t) && /^[A-Z(]/.test(l);
    t += !t ? l : (item || afterList ? '\n' : ' ') + l;
    if(item) inList = true; else if(afterList) inList = false;
  }
  if(isExplain) t = t.replace(/([a-z])\.([A-Z])/g, '$1. $2');   // "back in.This" -> "back in. This"
  return t;
}
QUESTIONS.forEach(q => {
  q.question = cleanText(q.question);
  if(q.explanation) q.explanation = cleanText(q.explanation, true);
  q.options.forEach(o => o.text = cleanText(o.text));
});

// stable ids so saved attempts still point at the right question after edits elsewhere in the bank
QUESTIONS.forEach(q => { q.id = hash(norm(q.question) + '|' + q.options.map(o=>norm(o.text)).join('|')); q.key = norm(q.question); });
const BY_ID = Object.fromEntries(QUESTIONS.map(q => [q.id, q]));

// ---------- storage ----------
let storageOK = true;
const mem = {};
function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ storageOK = false; return key in mem ? mem[key] : fallback; }
}
function save(key, val){
  mem[key] = val;
  try { val == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(val)); } catch(e){ storageOK = false; }
}
const loadAttempts = () => load(STORE_KEY, []);
const saveAttempts = list => save(STORE_KEY, list);
const saveExam = e => save(CURRENT_KEY, e);
function loadExam(){
  const c = load(CURRENT_KEY, null);
  if(c && !c.deadline){   // attempt left over from the older untimed version: carry answers over, start the clock now
    const sel = {}; (c.answers||[]).forEach(a => { if(a.selected.length) sel[a.qid] = a.selected; });
    const now = Date.now();
    const e = { id:c.id, startedAt:now, deadline:now + EXAM_MINUTES*60000, qids:c.qids, sel, flags:{}, idx:Math.min((c.answers||[]).length, c.qids.length-1) };
    saveExam(e); return e;
  }
  return c;
}
const loadSeq = () => load(SEQ_KEY, { idx:0, ans:{} });
const saveSeq = s => save(SEQ_KEY, s);

// ---------- exam building ----------
function buildExamQuestions(){
  const seen = new Set();
  loadAttempts().forEach(a => a.answers.forEach(x => seen.add(x.qid)));
  const unseen = shuffle(QUESTIONS.filter(q => !seen.has(q.id)));
  const rest = shuffle(QUESTIONS.filter(q => seen.has(q.id)));
  const picked = [], keys = new Set();
  for(const q of unseen.concat(rest)){
    if(picked.length >= EXAM_SIZE) break;
    if(keys.has(q.key)) continue;           // no duplicate question text in one exam
    keys.add(q.key); picked.push(q.id);
  }
  return shuffle(picked);                   // mix unseen and seen so their order gives nothing away
}

// ---------- state ----------
let state = { screen:'home', exam:null, study:null, viewing:null, wrongOnly:false };
let timer = null;
function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
const app = document.getElementById('app');
const topStats = document.getElementById('topStats');
document.getElementById('bankCount').textContent = QUESTIONS.length;
const answeredCount = e => e.qids.filter(id => (e.sel[id]||[]).length).length;

function renderTopStats(){
  if(state.screen === 'exam'){
    const e = state.exam, left = e.deadline - Date.now();
    topStats.innerHTML = `<div>Answered <b>${answeredCount(e)}</b> / ${e.qids.length}</div><div class="timer ${left<5*60000?'low':''}" id="timer">${fmtClock(left)}</div>`;
  } else if(state.screen === 'study'){
    const s = state.study, done = s.qids.map(id => s.ans[id]).filter(Boolean);
    topStats.innerHTML = `<div>Answered <b>${done.length}</b> / ${s.qids.length}</div><div>Correct <b>${done.filter(a=>a.correct).length}</b></div>`;
  } else {
    const n = loadAttempts().length;
    topStats.innerHTML = n ? `<div><b>${n}</b> exam${n>1?'s':''} saved</div>` : '';
  }
}

  const last = attempts[attempts.length-1];
  const best = attempts.reduce((m,a)=>Math.max(m, a.pct), 0);

  app.innerHTML = `
    <div class="card">
      <div class="setup-title">Ready to drill?</div>
      <div class="setup-sub">${QUESTIONS.length} questions in the bank. Run a timed exam, or work through the bank one question at a time.</div>
      ${!storageOK ? `<div class="warn">This browser is blocking local storage, so progress is kept only until you close the page. Use Export to keep a copy.</div>` : ''}
      ${note ? `<div class="warn">${escapeHtml(note)}</div>` : ''}
      ${attempts.length ? `
        <div class="stat-grid">
          <div><span>Exams taken</span><b>${attempts.length}</b></div>
          <div><span>Last score</span><b>${last.pct}%</b></div>
          <div><span>Best score</span><b>${best}%</b></div>
          <div><span>Bank covered</span><b>${Math.round(seen.size/QUESTIONS.length*100)}%</b></div>
        </div>` : ''}

      <div class="mode">
        <div class="mode-head"><div class="mode-title">Exam simulation</div><div class="mode-tag">${EXAM_SIZE} Q · ${EXAM_MINUTES} min</div></div>
        <div class="mode-desc">${EXAM_SIZE} random questions against a ${EXAM_MINUTES}-minute clock, like the real CSA. Answers stay hidden until you submit. You can move back and forth and flag questions to revisit. When time runs out the exam submits itself.</div>
        ${exam ? `
          <div class="resume-box">
            <div>Exam in progress: <b>${answeredCount(exam)} of ${exam.qids.length}</b> answered · <b>${fmtClock(exam.deadline-Date.now())}</b> left</div>
            <div class="action-row">
              <button class="btn" id="discardBtn">Discard</button>
              <button class="btn primary" id="resumeBtn">Resume exam</button>
            </div>
          </div>` : `<button class="go-btn" id="startBtn">Start exam</button>`}
      </div>

      <div class="mode">
        <div class="mode-head"><div class="mode-title">Study, one by one</div><div class="mode-tag">${seqDone} / ${QUESTIONS.length} done${seqDone?` · ${Math.round(seqRight/seqDone*100)}%`:''}</div></div>
        <div class="mode-desc">Go through the whole bank in order. The answer and explanation show right after you check each question, and your place is saved.</div>
        <div class="action-row">
          ${seqDone || seq.idx ? `<button class="btn" id="seqResetBtn">Start over</button><button class="btn primary" id="seqBtn">Continue at Q${seq.idx+1}</button>`
                               : `<button class="btn primary" id="seqBtn">Start at Q1</button>`}
        </div>
        <div class="jump-row">
          <label for="jumpIn">Jump to question</label>
          <input type="number" id="jumpIn" min="1" max="${QUESTIONS.length}" placeholder="1–${QUESTIONS.length}">
          <button class="btn" id="jumpBtn">Go</button>
        </div>
      </div>

      <button class="btn link-btn" id="historyBtn" ${attempts.length ? '' : 'disabled'}>View previous exams</button>
    </div>`;
  const s = document.getElementById('startBtn'); if(s) s.onclick = startExam;
  const r = document.getElementById('resumeBtn'); if(r) r.onclick = resumeExam;
  const d = document.getElementById('discardBtn'); if(d) d.onclick = () => { if(confirm('Discard the exam in progress? It will not be saved to your history.')){ saveExam(null); renderHome(); } };
  document.getElementById('seqBtn').onclick = () => startSeq();
  const sr = document.getElementById('seqResetBtn'); if(sr) sr.onclick = () => { if(confirm('Clear your study progress and start again from Q1?')){ saveSeq({ idx:0, ans:{} }); startSeq(); } };
  const jumpIn = document.getElementById('jumpIn');
  const jump = () => { const n = parseInt(jumpIn.value, 10); if(n >= 1 && n <= QUESTIONS.length) startSeq(n-1); else jumpIn.focus(); };
  document.getElementById('jumpBtn').onclick = jump;
  jumpIn.onkeydown = ev => { if(ev.key === 'Enter') jump(); };
