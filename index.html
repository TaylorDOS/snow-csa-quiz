s the function of an Application-based trigger in Flow Designer?", "options": [{"letter": "A", "text": "To run a flow when a record is created or updated"}, {"letter": "B", "text": "To execute a flow at specified dates and times"}, {"letter": "C", "text": "To start a flow based on specific conditions within an application"}, {"letter": "D", "text": "To trigger a flow when a user logs in"}], "answer": ["C"], "explanation": ""}, {"question": "What is a Spoke in the context of ServiceNow Flow Designer?", "options": [{"letter": "A", "text": "A tool for scheduling recurring tasks"}, {"letter": "B", "text": "A dedicated application for managing task records like incidents"}, {"letter": "C", "text": "An integration hub for connecting third-party APIs"}, {"letter": "D", "text": "A component that automates hardware asset management"}], "answer": ["B"], "explanation": ""}, {"question": "How does IntegrationHub enhance the capabilities of ServiceNow Flow Designer?", "options": [{"letter": "A", "text": "By providing a code-free environment for creating powerful actions"}, {"letter": "B", "text": "By limiting the integration to only ServiceNow applications"}, {"letter": "C", "text": "By requiring custom scripting for each integration"}, {"letter": "D", "text": "By offering only basic integration functionalities"}], "answer": ["A"], "explanation": "IntegrationHub supports a wide range of integrations, not limited to ServiceNow\napplications, making it a versatile tool for expanding the functionality of Flow Designer."}, {"question": "Which type of trigger is NOT available in ServiceNow Flow Designer?", "options": [{"letter": "A", "text": "Record-based trigger"}, {"letter": "B", "text": "Date-based trigger"}, {"letter": "C", "text": "Application-based trigger"}, {"letter": "D", "text": "User-based trigger"}], "answer": ["D"], "explanation": ""}, {"question": "What makes Flow Designer preferable for automating processes compared to\ntraditional business rules?", "options": [{"letter": "A", "text": "It requires more coding knowledge"}, {"letter": "B", "text": "It offers a visual interface and reusable actions"}, {"letter": "C", "text": "It is less flexible than business rules"}, {"letter": "D", "text": "It does not support integrations"}], "answer": ["B"], "explanation": ""}, {"question": "What is the primary advantage of using variable sets in the Service Catalog?", "options": [{"letter": "A", "text": "They allow end users to create their own variables."}, {"letter": "B", "text": "They enhance the security of the Service Catalog."}, {"letter": "C", "text": "They automatically create reports for catalog items."}, {"letter": "D", "text": "They ensure catalog items are always approved."}, {"letter": "E", "text": "They reduce redundancy and save time by reusing variables across multiple catalog items."}], "answer": ["E"], "explanation": "A variable set is a reusable group of variables, which avoids recreating the same variables on many catalog items."}, {"question": "Which variable set type is used to capture data in a grid layout for multiple entities?", "options": [{"letter": "A", "text": "Single-row variable set"}, {"letter": "B", "text": "Multi-row variable set"}, {"letter": "C", "text": "Grid variable set"}, {"letter": "D", "text": "Matrix variable set"}, {"letter": "E", "text": "List variable set"}], "answer": ["B"], "explanation": ""}, {"question": "Which variable types cannot be included in a multi-row variable set (MRVS)?", "options": [{"letter": "A", "text": "Checkbox, Select box, Reference"}, {"letter": "B", "text": "Attachment, Break, HTML"}, {"letter": "C", "text": "Single-line text, Multi-line text, Date"}, {"letter": "D", "text": "Email, Label, IP Address"}, {"letter": "E", "text": "Rich Text Label, Container Start, Macro"}], "answer": ["B", "E"], "explanation": ""}, {"question": "How does using a variable set improve the efficiency of managing multiple catalog\nitems?", "options": [{"letter": "A", "text": "By allowing catalog editors to create their own variables."}, {"letter": "B", "text": "By allowing changes to variables to be made in one place and reflected across all associated catalog items."}, {"letter": "C", "text": "By creating individual variables for each catalog item separately."}, {"letter": "D", "text": "By generating automatic approvals for catalog items."}, {"letter": "E", "text": "By enhancing the security of catalog items."}], "answer": ["B"], "explanation": "Because a variable set is shared, a change made to it once is reflected in every catalog item that uses it."}, {"question": "Which roles are needed to provide read, write, and update access to a variable set?", "options": [{"letter": "A", "text": "Roles assigned by a catalog administrator"}, {"letter": "B", "text": "Roles assigned by end users"}, {"letter": "C", "text": "Roles assigned by Service Desk agents"}, {"letter": "D", "text": "Roles assigned by catalog managers"}, {"letter": "E", "text": "Roles assigned by system administrators"}], "answer": ["A", "E"], "explanation": ""}, {"question": "What happens when a variable set is modified?", "options": [{"letter": "A", "text": "The changes are reflected across all catalog items associated with the variable set."}, {"letter": "B", "text": "Only new catalog items will use the updated variable set."}, {"letter": "C", "text": "The changes are applied only to the variable set itself."}, {"letter": "D", "text": "A new variable set is created with the modifications."}, {"letter": "E", "text": "The changes need to be manually applied to each catalog item."}], "answer": ["A"], "explanation": ""}, {"question": "Which variable type in the Service Catalog allows users to upload, download, update,\nand delete files as attachments?", "options": [{"letter": "A", "text": "Attachment variable"}, {"letter": "B", "text": "File upload variable"}, {"letter": "C", "text": "Document variable"}, {"letter": "D", "text": "File manager variable"}, {"letter": "E", "text": "Multi-file variable"}], "answer": ["A"], "explanation": ""}, {"question": "What is the primary function of the Check box variable in the Service Catalog?", "options": [{"letter": "A", "text": "To allow selection between multiple options"}, {"letter": "B", "text": "To enable or disable options"}, {"letter": "C", "text": "To upload attachments"}, {"letter": "D", "text": "Check if a field is true or false"}, {"letter": "E", "text": "Allow users to modify the data on the field"}], "answer": ["B"], "explanation": ""}, {"question": "Which variable type in the Service Catalog is used to display a formatted label with\nadvanced formatting options, including images and links?", "options": [{"letter": "A", "text": "HTML variable"}, {"letter": "B", "text": "Rich Text Label variable"}, {"letter": "C", "text": "Label variable"}, {"letter": "D", "text": "Formatted Label variable"}, {"letter": "E", "text": "Text Display variable"}], "answer": ["B"], "explanation": "Rich Text Label variable allows for advanced formatting, including the insertion of\nimages and links, using the TinyMCE rich text editor. This variable type is useful for\ncreating visually rich and informative labels on catalog item forms. It supports HTML\n\ntags, making it highly customizable. However, it is not supported in multi-row variable\nsets, condition builders, or reports.\nThe HTML variable also allows for advanced content but does not provide the same\nformatted label capabilities as the Rich Text Label variable."}, {"question": "Which variable type can be used to create a group of radio buttons that select a value\nfrom a predefined list?", "options": [{"letter": "A", "text": "Multiple choice variable"}, {"letter": "B", "text": "Select box variable"}, {"letter": "C", "text": "Lookup multiple choice variable"}, {"letter": "D", "text": "Radio button variable"}, {"letter": "E", "text": "List collector variable"}], "answer": ["A"], "explanation": "Multiple choice variable in the Service Catalog is used to create a group of radio\nbuttons, allowing users to select a single value from a list of predefined options. This\nvariable type is ideal for questions requiring a single selection from multiple choices. In\ncontrast, the Select box variable creates a dropdown list, and the List collector\nvariable allows selecting multiple records from a table."}, {"question": "What is the role of the Container start, Container split, and Container end variables in\nthe Service Catalog?", "options": [{"letter": "A", "text": "To define a layout for holding more variables"}, {"letter": "B", "text": "To insert a UI page into the catalog item"}, {"letter": "C", "text": "To create a collapsible section"}, {"letter": "D", "text": "To enable selection between multiple options"}, {"letter": "E", "text": "To validate user input"}], "answer": ["A"], "explanation": "Container start, Container split, and Container end variables define a layout for\nholding more variables within a container. These variables enable the creation of\norganized, multi-column layouts within a form. The Container split variable divides the\nlayout into two or three columns, and the Container start and end variables mark the\nbeginning and end of the container layout. Containers can be nested and used within\nvariable sets."}, {"question": "Which variable type is best suited for capturing multi-line text input in a Service Catalog\nitem?", "options": [{"letter": "A", "text": "Single-line text variable"}, {"letter": "B", "text": "Multi-line text variable"}, {"letter": "C", "text": "Wide single-line text variable"}, {"letter": "D", "text": "Text area variable"}, {"letter": "E", "text": "Rich Text Label variable"}], "answer": ["B"], "explanation": ""}, {"question": "Which variable type in the Service Catalog allows users to specify an email address and\nensures it contains valid email formatting?", "options": [{"letter": "A", "text": "URL variable"}, {"letter": "B", "text": "IP Address variable"}, {"letter": "C", "text": "Email variable"}, {"letter": "D", "text": "Single-line text variable"}, {"letter": "E", "text": "Multi-line text variable"}], "answer": ["C"], "explanation": ""}, {"question": "Which variable type should you use to create a selectable list of values derived from a\nquery to a table?", "options": [{"letter": "A", "text": "Select box variable"}, {"letter": "B", "text": "Lookup select box variable"}, {"letter": "C", "text": "Multiple choice variable"}, {"letter": "D", "text": "List collector variable"}, {"letter": "E", "text": "Lookup multiple choice variable"}], "answer": ["B"], "explanation": "Lookup select box variable creates a selectable list of values derived from a query to a\ntable. It is similar to the Multiple choice variable but uses data from a specified table to\npopulate the choice list. This variable is particularly useful for dynamic lists where the\navailable options depend on data within the system. The List collector variable allows\nmultiple selections, whereas the Lookup select box variable is designed for single\nselection from a queried list."}, {"question": "What is the purpose of the Break variable in the Service Catalog?", "options": [{"letter": "A", "text": "To create a horizontal line as a formatting element"}, {"letter": "B", "text": "To insert a UI macro into the catalog item"}, {"letter": "C", "text": "To enable selection between multiple options"}, {"letter": "D", "text": "To create a collapsible section"}, {"letter": "E", "text": "To validate user input"}], "answer": ["A"], "explanation": ""}, {"question": "When a catalog task is created by the Flow Designer flow, what should its initial state\nbe?", "options": [{"letter": "A", "text": "Draft"}, {"letter": "B", "text": "Open"}, {"letter": "C", "text": "In Progress"}, {"letter": "D", "text": "Pending"}, {"letter": "E", "text": "Ready"}], "answer": ["B"], "explanation": ""}, {"question": "How can fulfillers access a catalog task record if they have received a notification?", "options": [{"letter": "A", "text": "By navigating to Service Desk > Tasks"}, {"letter": "B", "text": "By contacting the Service Desk"}, {"letter": "C", "text": "By searching for the task ID manually"}, {"letter": "D", "text": "By following the link in the notification"}], "answer": ["D"], "explanation": ""}, {"question": "What should happen to the state of a catalog task when work is ready to begin?", "options": [{"letter": "A", "text": "The state should be updated from Open to Closed"}, {"letter": "B", "text": "The state should be updated from Open to Work in Progress"}, {"letter": "C", "text": "The state should be updated from Work in Progress to Open"}, {"letter": "D", "text": "The system changes the State to in In Progress, if Task is opened by the assigned user"}, {"letter": "E", "text": "The state should be updated from Pending to Work in Progress"}, {"letter": "F", "text": "The state should be updated from Resolved to Closed"}], "answer": ["B"], "explanation": ""}, {"question": "What is a primary function of list categories in Workspaces?", "options": [{"letter": "A", "text": "Retrieve records from the database"}, {"letter": "B", "text": "Group records that agents need to do their work"}, {"letter": "C", "text": "Filter records based on user preferences"}, {"letter": "D", "text": "Display records directly in the list pane"}, {"letter": "E", "text": "Configure security settings for records"}], "answer": ["B"], "explanation": ""}, {"question": "When setting up a new list category in a ServiceNow workspace, what additional step\nmust be taken to ensure it appears correctly?", "options": [{"letter": "A", "text": "Assign security roles to the list category"}, {"letter": "B", "text": "Configure the list layout"}, {"letter": "C", "text": "Add list filters to the category"}, {"letter": "D", "text": "Link the category to a specific user group"}, {"letter": "E", "text": "Set the visibility settings for the category"}], "answer": ["C"], "explanation": "Adding filters: To ensure that a new list category appears correctly in a ServiceNow\nworkspace, it is essential to add list filters. Without these filters, the category will not\ndisplay any records and may not appear as expected."}, {"question": "How do filtered lists (UX Lists) in Workspace differ from list categories in classic lists?", "options": [{"letter": "A", "text": "Filtered lists retrieve records when clicked, while list categories do not."}, {"letter": "B", "text": "List categories allow user customization, filtered lists do not."}, {"letter": "C", "text": "Filtered lists are visible to administrators only."}, {"letter": "D", "text": "List categories are used for security purposes, filtered lists for display."}, {"letter": "E", "text": "Filtered lists cannot be customized."}], "answer": ["A"], "explanation": "Retrieving records: The key difference between filtered lists (UX Lists) and list\ncategories in ServiceNow is that filtered lists retrieve records when clicked, whereas list\ncategories do not. Filtered lists provide a way to view specific sets of records based on\nthe applied filters.\nGrouping vs. retrieving: List categories are used to group records that agents need for\ntheir work, but do not retrieve records by themselves. This distinction is important for\nunderstanding how data is organized and accessed within ServiceNow."}, {"question": "In a ServiceNow workspace, what advantage do classic lists offer compared to working\nwithin a workspace?", "options": [{"letter": "A", "text": "Enhanced user customization options"}, {"letter": "B", "text": "Ease of use with fewer feature differences"}, {"letter": "C", "text": "Improved data retrieval speed"}, {"letter": "D", "text": "Better integration with third-party tools"}, {"letter": "E", "text": "More advanced filtering capabilities"}], "answer": ["B"], "explanation": ""}, {"question": "Which of the following statements is true about list categories in ServiceNow?", "options": [{"letter": "A", "text": "They appear in the list pane but do not retrieve records when clicked."}, {"letter": "B", "text": "They are used to configure security settings for records."}, {"letter": "C", "text": "They automatically display all records in a table."}, {"letter": "D", "text": "They provide advanced filtering options for users."}, {"letter": "E", "text": "They can be customized by individual users."}], "answer": ["A"], "explanation": ""}, {"question": "What is an advantage of using lists in a ServiceNow workspace?", "options": [{"letter": "A", "text": "Classic lists function similarly with ease of use."}, {"letter": "B", "text": "Workspaces offer fewer customization options."}, {"letter": "C", "text": "Lists are only available in workspaces."}, {"letter": "D", "text": "Workspaces provide no additional functionality."}, {"letter": "E", "text": "Lists in workspaces cannot be filtered."}], "answer": ["A"], "explanation": ""}, {"question": "What is a view in ServiceNow?", "options": [{"letter": "A", "text": "A function to generate reports and dashboards."}, {"letter": "B", "text": "A version of a list or form that defines which fields appear and in what order."}, {"letter": "C", "text": "A feature to create workflows and automation."}, {"letter": "D", "text": "A tool to manage user roles and permissions."}, {"letter": "E", "text": "A method to define user authentication settings."}], "answer": ["B"], "explanation": ""}, {"question": "How can a user switch between different views of columns on a list in ServiceNow?", "options": [{"letter": "A", "text": "Use the Application Navigator to select a different view."}, {"letter": "B", "text": "Navigate to the User Profile settings and modify the list view."}, {"letter": "C", "text": "Right-click on the column header and select Change View."}, {"letter": "D", "text": "Go to System Settings and configure the list view settings."}, {"letter": "E", "text": "Open the List Control Menu, select View, and then choose the desired view name."}], "answer": ["E"], "explanation": ""}, {"question": "What are the criteria used to sort a list displayed to a user for the first time in\nServiceNow?", "options": [{"letter": "A", "text": "Date field, Status field, Priority field, Owner field"}, {"letter": "B", "text": "Order field, Number field, Name field, Display field"}, {"letter": "C", "text": "ID field, Description field, Assigned field, Location field"}, {"letter": "D", "text": "Modified field, Source field, Target field, Value field"}, {"letter": "E", "text": "Created field, Updated field, Type field, Category field"}], "answer": ["B"], "explanation": ""}, {"question": "What type of relationship allows a field within a table to hold a reference to a record on\nanother table?", "options": [{"letter": "A", "text": "One-to-Many"}, {"letter": "B", "text": "Many-to-Many"}, {"letter": "C", "text": "Database Views"}, {"letter": "D", "text": "Extensions"}], "answer": ["A"], "explanation": "One-to-Many relationship allows a field within a table to hold a reference to a record\non another table. For example, the Caller field on the Incident table allows users to\nselect a record from the User table."}, {"question": "Which relationship type involves two or more tables that can be related in a bi-\ndirectional manner?", "options": [{"letter": "A", "text": "One-to-Many"}, {"letter": "B", "text": "Many-to-Many"}, {"letter": "C", "text": "Extensions"}, {"letter": "D", "text": "Database Views"}], "answer": ["B"], "explanation": ""}, {"question": "What type of field allows a user to select multiple records on a table defined by the glide\nlist?", "options": [{"letter": "A", "text": "Document ID Fields"}, {"letter": "B", "text": "Reference Fields"}, {"letter": "C", "text": "Glide List"}, {"letter": "D", "text": "Database Views"}], "answer": ["C"], "explanation": "Glide List allows a user to select multiple records on a table defined by the glide list. An\nexample of this is the Watchlist field on the Incident table, which allows users to select\nany record or records on the User table."}, {"question": "Which ServiceNow feature allows tables to be joined using the Database Views plugin?", "options": [{"letter": "A", "text": "One-to-Many"}, {"letter": "B", "text": "Extensions"}, {"letter": "C", "text": "Database Views"}, {"letter": "D", "text": "Many-to-Many"}], "answer": ["C"], "explanation": ""}, {"question": "How does the extension model in ServiceNow determine the attributes of a table?", "options": [{"letter": "A", "text": "By creating unique records for each table"}, {"letter": "B", "text": "By defining one or more database tables to store the parent and child classes"}, {"letter": "C", "text": "By linking multiple tables into a single list"}, {"letter": "D", "text": "By using reference fields to connect tables"}], "answer": ["B"], "explanation": "The inheritance of fields\nfrom parent classes to child classes is managed through the extension model, and it\ndetermines the number of tables created, the derivation of fields, and the replication of\nrecords."}, {"question": "What is the purpose of using Dictionary overrides in ServiceNow?", "options": [{"letter": "A", "text": "To define a field on an extended table differently from the parent table"}, {"letter": "B", "text": "To link tables using reference fields"}, {"letter": "C", "text": "To create system fields in a new table"}, {"letter": "D", "text": "To join tables using the Database Views plugin"}], "answer": ["A"], "explanation": "Dictionary overrides in ServiceNow provide the ability to define a field on an extended\ntable differently from the field on the parent table. This allows overriding default values,\nfield dependencies, or read-only status of a field, ensuring customized behavior for\nspecific needs."}, {"question": "Which field type allows users to select a record from any table in the instance?", "options": [{"letter": "A", "text": "Reference Fields"}, {"letter": "B", "text": "Glide List"}, {"letter": "C", "text": "Document ID Fields"}, {"letter": "D", "text": "Database Views"}], "answer": ["C"], "explanation": "Document ID Fields allow users to select a record from any table in the instance. This\nprovides flexibility in linking records across different tables, such as selecting a\ndocument field on the Translated Text table."}, {"question": "What is the main difference between a parent class and a child class in ServiceNow?", "options": [{"letter": "A", "text": "A parent class inherits fields from a child class"}, {"letter": "B", "text": "A child class inherits fields from a parent class"}, {"letter": "C", "text": "A parent class and a child class have no relationship"}, {"letter": "D", "text": "A child class defines the database structure for a parent class"}], "answer": ["B"], "explanation": ""}, {"question": "What type of relationship model is used when a student can register for many classes,\nand a class can include many students?", "options": [{"letter": "A", "text": "One-to-Many"}, {"letter": "B", "text": "Many-to-Many"}, {"letter": "C", "text": "Database Views"}, {"letter": "D", "text": "Extensions"}], "answer": ["B"], "explanation": ""}, {"question": "What is a baseline implementation in ServiceNow?", "options": [{"letter": "A", "text": "A customized instance tailored to the customer's requirements"}, {"letter": "B", "text": "A set of installed applications on a ServiceNow instance before any configuration or customization"}, {"letter": "C", "text": "An instance used solely for testing purposes"}, {"letter": "D", "text": "A shared environment where multiple customers' data is mixed"}], "answer": ["B"], "explanation": "The baseline is the set of applications installed on an instance before any configuration or customization."}, {"question": "What characterizes a ServiceNow instance?", "options": [{"letter": "A", "text": "A unique environment specific to a customer"}, {"letter": "B", "text": "A generic environment shared by multiple customers"}, {"letter": "C", "text": "An offline version of the ServiceNow platform"}, {"letter": "D", "text": "A read-only version of a ServiceNow environment"}], "answer": ["A"], "explanation": ""}, {"question": "Which of the following is NOT a typical ServiceNow environment?", "options": [{"letter": "A", "text": "Production"}, {"letter": "B", "text": "Staging"}, {"letter": "C", "text": "Non-production"}, {"letter": "D", "text": "Development"}], "answer": ["B"], "explanation": ""}, {"question": "How are ServiceNow instances typically hosted?", "options": [{"letter": "A", "text": "On individual customer servers exclusively"}, {"letter": "B", "text": "In a peer-to-peer network across customer locations"}, {"letter": "C", "text": "In local servers within the customer’s premises"}, {"letter": "D", "text": "In ServiceNow Data Centers around the world"}], "answer": ["D"], "explanation": ""}, {"question": "What is the significance of a multi-instance, single-tenant architecture in ServiceNow?", "options": [{"letter": "A", "text": "It allows multiple customers to share the same data instance"}, {"letter": "B", "text": "It provides a single database for all customers"}, {"letter": "C", "text": "It ensures data isolation and customization for each customer"}, {"letter": "D", "text": "It limits the ability to customize the instance for individual customers"}], "answer": ["C"], "explanation": ""}, {"question": "What flexibility do ServiceNow customers have regarding instance types?", "options": [{"letter": "A", "text": "They can obtain additional non-production instances for testing"}, {"letter": "B", "text": "They can merge instances with other customers"}, {"letter": "C", "text": "They are restricted to a single instance type"}, {"letter": "D", "text": "They can only use production instances for all activities"}], "answer": ["A"], "explanation": "ServiceNow customers can obtain additional non-production instances for activities\nlike User Acceptance Testing (UAT), development, and quality assurance (QA). This\nflexibility ensures thorough testing and development without impacting the production\nenvironment."}, {"question": "What is the primary focus of configuration in a ServiceNow instance?", "options": [{"letter": "A", "text": "Tasks that can be done without code"}, {"letter": "B", "text": "Writing scripts to automate processes"}, {"letter": "C", "text": "Enhancing widgets with complex access controls"}, {"letter": "D", "text": "Developing custom applications from scratch"}], "answer": ["A"], "explanation": "Configuration in a ServiceNow instance primarily focuses on tasks that can be done\nwithout writing code. This includes actions like updating list categories on forms, adding\nfields, configuring list views, and creating service catalogs."}, {"question": "What is the purpose of customization in a ServiceNow instance?", "options": [{"letter": "A", "text": "To add additional functionality not existing in the platform"}, {"letter": "B", "text": "To update list views and categories"}, {"letter": "C", "text": "To create standard service catalogs"}, {"letter": "D", "text": "To configure fields on forms"}], "answer": ["A"], "explanation": "Customization in ServiceNow is done to add functionality that does not exist in the\nplatform by default. This typically involves coding and is used to meet specific customer\nrequirements.\nExamples include enhancing portal widgets with complex access controls and adding\ntables for special billing requirements. Differentiating between configuration and\ncustomization ensures appropriate task handling."}, {"question": "Which of the following tasks is an example of configuration in ServiceNow?", "options": [{"letter": "A", "text": "Updating the list of categories on a form"}, {"letter": "B", "text": "Enhancing a portal widget"}, {"letter": "C", "text": "Adding a table for special billing requirements"}, {"letter": "D", "text": "Creating a new script to automate processes"}], "answer": ["A"], "explanation": ""}, {"question": "Why are update sets used in ServiceNow?", "options": [{"letter": "A", "text": "To create new instances from scratch"}, {"letter": "B", "text": "To package changes for moving into production environments"}, {"letter": "C", "text": "To merge instances with other customers"}, {"letter": "D", "text": "To configure list views and categories"}], "answer": ["B"], "explanation": ""}, {"question": "Which of the following is NOT an example of a configuration task in ServiceNow?", "options": [{"letter": "A", "text": "Enhancing a portal widget"}, {"letter": "B", "text": "Adding fields to a form"}, {"letter": "C", "text": "Updating list views"}, {"letter": "D", "text": "Creating a service catalog"}], "answer": ["A"], "explanation": ""}, {"question": "What should be done if you need to publish customizations to an application repository\nin ServiceNow?", "options": [{"letter": "A", "text": "Use update sets to package the changes"}, {"letter": "B", "text": "Manually replicate the changes in each environment"}, {"letter": "C", "text": "Directly modify the production instance"}, {"letter": "D", "text": "Merge instances to share customizations"}], "answer": ["A"], "explanation": ""}, {"question": "What is a key difference between configuration and customization in ServiceNow?", "options": [{"letter": "A", "text": "Customization is always done first, followed by configuration"}, {"letter": "B", "text": "Configuration requires more technical expertise than customization"}, {"letter": "C", "text": "Customization cannot be packaged using update sets"}, {"letter": "D", "text": "Configuration typically involves tasks without code, while customization involves coding"}], "answer": ["D"], "explanation": "Configuration uses the platform's built-in tools without code; customization involves writing code."}, {"question": "How can applications and application features be activated in ServiceNow?", "options": [{"letter": "A", "text": "By contacting ServiceNow support"}, {"letter": "B", "text": "Through plugins"}, {"letter": "C", "text": "By using a personal developer instance"}, {"letter": "D", "text": "Via the ServiceNow Store"}], "answer": ["B", "D"], "explanation": ""}, {"question": "Where can you navigate to find all available applications in ServiceNow?", "options": [{"letter": "A", "text": "System Applications > All Available Applications > All"}, {"letter": "B", "text": "System Definition > All Applications"}, {"letter": "C", "text": "System Definition > Plugins"}, {"letter": "D", "text": "Self-Service > Plugins"}], "answer": ["A"], "explanation": ""}, {"question": "What is a personal developer instance used for in ServiceNow?", "options": [{"letter": "A", "text": "Providing free services to end-users"}, {"letter": "B", "text": "Deploying applications to production"}, {"letter": "C", "text": "Managing all ServiceNow instances in an organization"}, {"letter": "D", "text": "Exploring and testing applications before purchasing"}], "answer": ["D"], "explanation": "Using Personal Developer Instances: A personal developer instance in ServiceNow is\nprimarily used for exploring and testing applications before they are purchased or\ndeployed to a production environment. This instance allows developers and\nadministrators to experiment with features and configurations without affecting live\nsystems."}, {"question": "What should be done if your company hasn't purchased a paid license for a plugin?", "options": [{"letter": "A", "text": "Search for a free alternative plugin"}, {"letter": "B", "text": "Activate the plugin without a license"}, {"letter": "C", "text": "Use the plugin in a personal developer instance"}, {"letter": "D", "text": "Request information from ServiceNow during the plugin installation"}], "answer": ["D"], "explanation": ""}, {"question": "Which type of data might be included in some plugins to illustrate common use cases?", "options": [{"letter": "A", "text": "Sensitive user data"}, {"letter": "B", "text": "Production data"}, {"letter": "C", "text": "Historical transaction data"}, {"letter": "D", "text": "Demo data"}], "answer": ["D"], "explanation": ""}, {"question": "How do system administrators typically activate published plugins in ServiceNow?", "options": [{"letter": "A", "text": "By contacting ServiceNow support"}, {"letter": "B", "text": "By selecting the plugin and clicking 'Activate'"}, {"letter": "C", "text": "By developing a custom plugin"}, {"letter": "D", "text": "By using the personal developer instance"}], "answer": ["B"], "explanation": ""}, {"question": "What should be done if a plugin depends on other plugins in ServiceNow?", "options": [{"letter": "A", "text": "Deactivate all other plugins"}, {"letter": "B", "text": "Contact ServiceNow support for guidance"}, {"letter": "C", "text": "Ignore the dependencies and proceed with activation"}, {"letter": "D", "text": "Ensure the dependent plugins are activated first"}], "answer": ["D"], "explanation": ""}, {"question": "What levels of security does ServiceNow implement before an end user can perform\nCRUD operations on a table?", "options": [{"letter": "A", "text": "User Authentication/Login, Application and Modules Access, Database Access"}, {"letter": "B", "text": "User Authorization, Module Access, Database Encryption"}, {"letter": "C", "text": "User Login, Application Control, Record Access"}, {"letter": "D", "text": "Authentication, Role Management, Data Access"}], "answer": ["A"], "explanation": ""}, {"question": "How are Access Control rules evaluated in ServiceNow?", "options": [{"letter": "A", "text": "From the most general field rule to the most general table rule"}, {"letter": "B", "text": "From the most general table rule to the most specific field rule"}, {"letter": "C", "text": "From the most specific table rule to the most specific field rule"}, {"letter": "D", "text": "From the most specific table rule to the most general field rule"}], "answer": ["D"], "explanation": "Table ACLs are matched first, from the most specific (incident) to the most general (*). Field ACLs are then matched from the most specific (incident.number) to the most general (*.*). So evaluation runs from the most specific table rule to the most general field rule.", "correction": {"was": "C", "basis": "Verified against ServiceNow docs (wording of the options is ambiguous)"}}, {"question": "What are the three security modules typically used by the System Administrator in\nServiceNow?", "options": [{"letter": "A", "text": "System Properties, User Administration, Data Management"}, {"letter": "B", "text": "User Authentication, Module Access, Database Access"}, {"letter": "C", "text": "System Properties > Security, System Security > Access Control (ACL), System Security > High Security Settings"}, {"letter": "D", "text": "System Security > General Settings, System Maintenance, Application Administration"}], "answer": ["C"], "explanation": ""}, {"question": "Which table access control rule applies to the entire table and all its records in\nServiceNow?", "options": [{"letter": "A", "text": "table.field"}, {"letter": "B", "text": "field.*"}, {"letter": "C", "text": "table.*"}, {"letter": "D", "text": "table.--None--"}], "answer": ["D"], "explanation": "Summary: The table.--None-- access control rule in ServiceNow applies to the entire\ntable and all its records.\nDetails: This rule does not specify any specific field, meaning it covers the entire table.\nIt ensures that any access control defined under this rule applies to every record within\nthe table. Understanding the scope of table access control rules is essential for proper\ndata security management in ServiceNow.\nBy setting this rule, administrators can enforce security policies across all records in a\ntable without needing to define individual field-level controls, streamlining the security\nmanagement process."}, {"question": "What is the function of the 'security_admin' role in ServiceNow?", "options": [{"letter": "A", "text": "To allow users to create and manage custom applications"}, {"letter": "B", "text": "To enable users to perform all system administration tasks"}, {"letter": "C", "text": "To grant elevated privileges to manage Access Control Lists (ACLs)"}, {"letter": "D", "text": "To manage user passwords and authentication methods"}], "answer": ["C"], "explanation": ""}, {"question": "How does ServiceNow implement row-level and column-level security?", "options": [{"letter": "A", "text": "Through roles and groups"}, {"letter": "B", "text": "With system properties"}, {"letter": "C", "text": "Using Access Control rules"}, {"letter": "D", "text": "By user authentication methods"}], "answer": ["C"], "explanation": "Summary: ServiceNow implements row-level and column-level security using Access\nControl rules.\nDetails: Access Control rules in ServiceNow are designed to restrict user permissions\nat both the row-level (individual records) and column-level (specific fields within\nrecords). These rules ensure that users can only access the data they are authorized to\nview or modify, enhancing the security and integrity of the system.\nRow-level security restricts access to specific records within a table, while column-\nlevel security restricts access to specific fields within those records. Administrators can\ndefine these rules to enforce fine-grained control over data access based on user roles,\nconditions, and scripts."}, {"question": "What are the main components defined in an Access Control rule in ServiceNow?", "options": [{"letter": "A", "text": "Roles, Groups, Permissions"}, {"letter": "B", "text": "Tables, Fields, Scripts"}, {"letter": "C", "text": "Operation, Object, Permissions"}, {"letter": "D", "text": "Roles, Conditions, Permissions"}], "answer": ["C"], "explanation": ""}, {"question": "Which statement is true about Access Control rules in ServiceNow?", "options": [{"letter": "A", "text": "They only apply to tables and not to fields"}, {"letter": "B", "text": "They can be defined at both the table and field levels"}, {"letter": "C", "text": "They are only evaluated during user login"}, {"letter": "D", "text": "They cannot restrict CRUD operations"}], "answer": ["B"], "explanation": ""}, {"question": "In ServiceNow, what does the 'table.*' Access Control rule signify?", "options": [{"letter": "A", "text": "It applies to all fields not covered by a table.field rule"}, {"letter": "B", "text": "It applies to specific fields within a table"}, {"letter": "C", "text": "It grants full access to all tables"}, {"letter": "D", "text": "It restricts access to all tables"}], "answer": ["A"], "explanation": "Summary: The 'table.*' Access Control rule in ServiceNow applies to all fields not\ncovered by a table.field rule.\nDetails: This wildcard rule ensures that any fields within a table that do not have a\nspecific Access Control rule defined (table.field) will be governed by the 'table.*' rule.\nThis helps in simplifying the management of Access Control rules by covering all\nunspecified fields under a general rule, reducing the need for creating individual rules\nfor every field.\nBy using 'table.*', administrators can streamline the security management process while\nensuring comprehensive access control over the entire table structure."}, {"question": "What happens if a user passes a table ACL rule but fails a field ACL rule in ServiceNow?", "options": [{"letter": "A", "text": "The user is granted access to the entire table and all fields"}, {"letter": "B", "text": "The user is denied access to the specific field but can access other fields in the table"}, {"letter": "C", "text": "The user is denied access to the entire table"}, {"letter": "D", "text": "The user can still modify the specific field"}], "answer": ["B"], "explanation": ""}, {"question": "What is the primary purpose of the Access Control List (ACL) in ServiceNow?", "options": [{"letter": "A", "text": "To log user activities"}, {"letter": "B", "text": "To restrict user permissions on tables and fields"}, {"letter": "C", "text": "To create reports and dashboards"}, {"letter": "D", "text": "To manage user roles and groups"}], "answer": ["B"], "explanation": "Summary: The primary purpose of the Access Control List (ACL) in ServiceNow is to\nrestrict user permissions on tables and fields.\nDetails: ACLs are security rules that define which users have access to specific\nresources within the ServiceNow platform. By setting ACLs, administrators can control\nwho can view, create, update, or delete data at both the table and field levels, ensuring\nthat only authorized users have the necessary permissions to perform these actions.\nACLs play a crucial role in maintaining data security and integrity, providing a robust\nmechanism for enforcing access control policies within the system."}, {"question": "Which of the following actions can be restricted by an Access Control rule in\nServiceNow?", "options": [{"letter": "A", "text": "Execute scripts on a record or UI page"}, {"letter": "B", "text": "Define relationships between tables"}, {"letter": "C", "text": "Automatically logout inactive users"}, {"letter": "D", "text": "Modify system properties"}], "answer": ["A", "B"], "explanation": ""}, {"question": "What are the three levels of security provided by ServiceNow before CRUD operations\ncan be performed?", "options": [{"letter": "A", "text": "Authentication, Authorization, Encryption"}, {"letter": "B", "text": "User Authentication/Login, Application and Modules Access, Database Access"}, {"letter": "C", "text": "User Login, Role Management, Data Access"}, {"letter": "D", "text": "Authentication, Module Control, Record Access"}], "answer": ["B"], "explanation": ""}, {"question": "What does the 'table.--None--' Access Control rule signify in ServiceNow?", "options": [{"letter": "A", "text": "It applies to all fields within a table"}, {"letter": "B", "text": "It applies to specific fields within a table"}, {"letter": "C", "text": "It applies to the entire table and all its records"}, {"letter": "D", "text": "It grants full access to the table"}], "answer": ["C"], "explanation": ""}, {"question": "What is the function of the 'Operation' component in an Access Control rule?", "options": [{"letter": "A", "text": "To define the valid actions the system can take"}, {"letter": "B", "text": "To specify the entity being secured"}, {"letter": "C", "text": "To list the required roles and conditions"}, {"letter": "D", "text": "To determine the order of rule evaluation"}], "answer": ["A"], "explanation": "Summary: The 'Operation' component in an Access Control rule defines the valid\nactions the system can take, such as CRUD operations.\nDetails: Access Control rules in ServiceNow specify security policies for accessing\ndata and functionalities. The 'Operation' component indicates the specific actions\n(Create, Read, Update, Delete) that the rule governs. This allows administrators to\ncontrol what actions users can perform on different objects within the platform.\nBy configuring the 'Operation' component, administrators can enforce precise security\ncontrols that align with organizational policies and data protection requirements."}, {"question": "Which of the following best describes the 'security_admin' role in ServiceNow?", "options": [{"letter": "A", "text": "Grants elevated privileges to manage Access Control Lists (ACLs)"}, {"letter": "B", "text": "Enables users to create and manage custom applications"}, {"letter": "C", "text": "Allows users to perform all system administration tasks"}, {"letter": "D", "text": "Manages user passwords and authentication methods"}], "answer": ["A"], "explanation": ""}, {"question": "What is the purpose of Access Control rules in ServiceNow?", "options": [{"letter": "A", "text": "To restrict user permissions on tables and fields"}, {"letter": "B", "text": "To log user activities"}, {"letter": "C", "text": "To create reports and dashboards"}, {"letter": "D", "text": "To manage user roles and groups"}], "answer": ["A"], "explanation": ""}, {"question": "Which component of an Access Control rule defines the entity being secured?", "options": [{"letter": "A", "text": "Operation"}, {"letter": "B", "text": "Permissions"}, {"letter": "C", "text": "Conditions"}, {"letter": "D", "text": "Object"}], "answer": ["D"], "explanation": "Summary: The 'Object' component of an Access Control rule defines the entity being\nsecured, such as a table or a specific field.\nDetails: In ServiceNow, Access Control rules are used to manage security policies for\naccessing data and functionalities. The 'Object' component specifies what the rule is\nprotecting, which can be a table, a specific field within a table, or a combination of\nboth.\nBy defining the 'Object', administrators can create detailed and specific security rules\nthat control access to different parts of the system, ensuring that only authorized users\ncan interact with the specified entities."}, {"question": "What is the primary purpose of CI Identification Rules in ServiceNow's CMDB?", "options": [{"letter": "A", "text": "To classify CIs into different categories."}, {"letter": "B", "text": "To uniquely identify and differentiate Configuration Items (CIs)."}, {"letter": "C", "text": "To manage CI relationships."}, {"letter": "D", "text": "To delete duplicate CIs from the CMDB."}, {"letter": "E", "text": "To automatically create new CI records."}], "answer": ["B"], "explanation": "Identification rules are used to uniquely identify CIs based on their attributes, which prevents duplicates. Creating new CI records is done by the Identification and Reconciliation Engine when no match is found; it is not the purpose of the rules themselves.", "correction": {"was": "B,E", "basis": "Verified against ServiceNow docs"}}, {"question": "How does ServiceNow determine if a new CI matches an existing CI in the CMDB?", "options": [{"letter": "A", "text": "By manually checking each CI record."}, {"letter": "B", "text": "By comparing the new CI's attributes against the CI Identification Rules."}, {"letter": "C", "text": "By evaluating the CI's relationships."}, {"letter": "D", "text": "By running a background script to find duplicates."}, {"letter": "E", "text": "By using predefined templates for each CI class."}], "answer": ["B"], "explanation": ""}, {"question": "Which CI attribute is commonly used in CI Identification Rules?", "options": [{"letter": "A", "text": "Serial Number"}, {"letter": "B", "text": "Date of Purchase"}, {"letter": "C", "text": "Warranty Period"}, {"letter": "D", "text": "Maintenance Schedule"}, {"letter": "E", "text": "Manufacturer"}], "answer": ["A"], "explanation": ""}, {"question": "What happens if no match is found when evaluating a new CI against existing CI\nIdentification Rules?", "options": [{"letter": "A", "text": "An error is logged."}, {"letter": "B", "text": "A new CI record is created."}, {"letter": "C", "text": "The CI is ignored."}, {"letter": "D", "text": "The user is prompted for more information."}, {"letter": "E", "text": "The system retries the identification process."}], "answer": ["B"], "explanation": ""}, {"question": "What is a common consequence if CI Identification Rules are not properly defined?", "options": [{"letter": "A", "text": "Duplicate CIs may exist in the CMDB."}, {"letter": "B", "text": "The CMDB will not be able to store any new CIs."}, {"letter": "C", "text": "CI relationships will be automatically created."}, {"letter": "D", "text": "The CMDB data will be deleted."}, {"letter": "E", "text": "System performance will improve."}], "answer": ["A"], "explanation": ""}, {"question": "Which role focuses on preventing incidents and reducing the impact of incidents that\ncannot be prevented?", "options": [{"letter": "A", "text": "Service Owner"}, {"letter": "B", "text": "Incident Manager"}, {"letter": "C", "text": "Problem Manager"}, {"letter": "D", "text": "Major Incident Manager"}, {"letter": "E", "text": "Problem Coordinator"}], "answer": ["C"], "explanation": ""}, {"question": "What role is the first line of support for new incidents?", "options": [{"letter": "A", "text": "Incident Manager"}, {"letter": "B", "text": "Service Desk Agent"}, {"letter": "C", "text": "Major Incident Manager"}, {"letter": "D", "text": "Problem Coordinator"}, {"letter": "E", "text": "Level 2 Support"}], "answer": ["B"], "explanation": ""}, {"question": "What role involves overseeing incident and problem management processes to ensure\ncompliance and follow-up?", "options": [{"letter": "A", "text": "Problem Coordinator"}, {"letter": "B", "text": "Process Owner"}, {"letter": "C", "text": "Service Desk Agent"}, {"letter": "D", "text": "Incident Manager"}, {"letter": "E", "text": "Level 2 Support"}], "answer": ["B"], "explanation": ""}, {"question": "What role involves managing and coordinating the resources for problem management\nto prevent incidents?", "options": [{"letter": "A", "text": "Service Desk Agent"}, {"letter": "B", "text": "Problem Manager"}, {"letter": "C", "text": "Major Incident Manager"}, {"letter": "D", "text": "Incident Manager"}, {"letter": "E", "text": "Problem Coordinator"}], "answer": ["B"], "explanation": ""}, {"question": "Which role is the first point of contact for incidents and responsible for initial resolution\nefforts?", "options": [{"letter": "A", "text": "Problem Coordinator"}, {"letter": "B", "text": "Incident Manager"}, {"letter": "C", "text": "Service Desk Agent"}, {"letter": "D", "text": "Level 2 Support"}, {"letter": "E", "text": "Major Incident Manager"}], "answer": ["C"], "explanation": "The Service Desk Agent is the first point of contact and first line of support for new incidents, and attempts initial resolution. The Incident Manager oversees the process.", "correction": {"was": "B", "basis": "Corrected by reasoning / consistency with the rest of the bank"}}, {"question": "Which role is responsible for overseeing the initial incident reports and attempts to\nresolve them?", "options": [{"letter": "A", "text": "Problem Coordinator"}, {"letter": "B", "text": "Incident Manager"}, {"letter": "C", "text": "Service Desk Agent"}, {"letter": "D", "text": "Major Incident Manager"}, {"letter": "E", "text": "Level 2 Support"}], "answer": ["B"], "explanation": ""}, {"question": "What does the Common Service Data Model (CSDM) provide within the ServiceNow\nplatform?", "options": [{"letter": "A", "text": "A framework that supports multiple configuration strategies within CMDB."}, {"letter": "B", "text": "A set of processes for ITSM implementation."}, {"letter": "C", "text": "A service that automatically fixes past implementations."}, {"letter": "D", "text": "A guide for coding practices in ServiceNow."}, {"letter": "E", "text": "A set of tools for automated software testing."}], "answer": ["A"], "explanation": ""}, {"question": "Which of the following statements is NOT true about CSDM?", "options": [{"letter": "A", "text": "CSDM provides guidance on service modeling."}, {"letter": "B", "text": "CSDM includes best practices for CMDB data management."}, {"letter": "C", "text": "CSDM is a SKU or product to buy."}, {"letter": "D", "text": "CSDM defines out-of-the-box CMDB core tables."}, {"letter": "E", "text": "CSDM offers recommended mappings."}], "answer": ["C"], "explanation": ""}, {"question": "What role does ServiceNow Discovery play in the platform?", "options": [{"letter": "A", "text": "Provides a guide for ITSM implementation."}, {"letter": "B", "text": "Automatically fixes discovered configuration issues."}, {"letter": "C", "text": "Scans the network to inventory devices and applications."}, {"letter": "D", "text": "Is a product that needs to be purchased separately."}], "answer": ["C"], "explanation": ""}, {"question": "What is a key characteristic of the CSDM framework?", "options": [{"letter": "A", "text": "Provides prescriptive guidelines for service modeling within the CMDB."}, {"letter": "B", "text": "Offers a product to purchase."}, {"letter": "C", "text": "Automates the service reporting process."}, {"letter": "D", "text": "Includes a set of process guides for ITSM, APM, EM, and other products."}], "answer": ["A"], "explanation": ""}, {"question": "Which component is NOT part of the CSDM framework?", "options": [{"letter": "A", "text": "Process guides for ITSM implementation."}, {"letter": "B", "text": "Out-of-the-box CMDB core tables."}, {"letter": "C", "text": "Standard terms and definitions."}, {"letter": "D", "text": "Best practices for data modeling."}], "answer": ["A"], "explanation": "The Common Service Data Model (CSDM) does not include process guides for ITSM\nimplementation. Instead, it focuses on providing standard terms and definitions, best\npractices for data modeling, and out-of-the-box CMDB core tables."}, {"question": "How does Service Mapping complement ServiceNow Discovery?", "options": [{"letter": "A", "text": "By providing automated fixes for discovered issues."}, {"letter": "B", "text": "By augmenting the CMDB with IT relationships and dependencies between CIs."}, {"letter": "C", "text": "By scanning the network for devices and applications."}, {"letter": "D", "text": "By serving as a guide for coding practices."}], "answer": ["B"], "explanation": "Service Mapping complements ServiceNow Discovery by augmenting the CMDB with\nIT relationships and dependencies between Configuration Items (CIs). This top-down\napproach provides a comprehensive view of how IT components comprise a service.\nWhile Discovery identifies devices and applications on the network, Service Mapping\nhelps understand the connections and dependencies between these elements,\nensuring accurate service representation within the CMDB."}, {"question": "Which of the following is NOT a feature of ServiceNow Discovery?", "options": [{"letter": "A", "text": "Provides a top-down approach to mapping services."}, {"letter": "B", "text": "Helps identify dependencies between devices and applications."}, {"letter": "C", "text": "Updates the CMDB with accurate data."}, {"letter": "D", "text": "Scans eports that they are not able to see modules on the application navigator,\nwhat can you do, to see what modules are visible to them?", "options": [{"letter": "A", "text": "Look up their password, so you can login with their account"}, {"letter": "B", "text": "Initiate a Connect Chat session"}, {"letter": "C", "text": "Install the Bomgar plug-in"}, {"letter": "D", "text": "Impersonate the user"}, {"letter": "E", "text": "Launch a NowChat window"}], "answer": ["D"], "explanation": ""}, {"question": "While showing a customer their incident form, they ask to change the Priority values to\ndisplay their internal terminology P1, P2, P3, P4. They want it to be consistent across all\nTasks. How would you do that?\nRight click on Priority and select what?", "options": [{"letter": "A", "text": "Configure Lists"}, {"letter": "B", "text": "Show Options"}, {"letter": "C", "text": "Configure Task"}, {"letter": "D", "text": "Show Choices"}, {"letter": "E", "text": "Show Choice List"}, {"letter": "F", "text": "Configure Options"}], "answer": ["E"], "explanation": ""}, {"question": "What is the platform name for the User table?", "options": [{"letter": "A", "text": "u_users"}, {"letter": "B", "text": "sys_users"}, {"letter": "C", "text": "x_users"}, {"letter": "D", "text": "sys_user"}], "answer": ["D"], "explanation": ""}, {"question": "Your customer would like to create a new template to notify users who are affected by\nnetwork outages at their site. Which module would you use to create a new notification?", "options": [{"letter": "A", "text": "System Notification > Email > Notifications"}, {"letter": "B", "text": "Administration > Notification Overview"}, {"letter": "C", "text": "System Properties > Email > Settings"}, {"letter": "D", "text": "User Preferences > Email > Notifications"}, {"letter": "E", "text": "Click Gear > Notifications > New"}], "answer": ["A"], "explanation": ""}, {"question": "When designing a flow, how do you reference data from a record, in that flow?", "options": [{"letter": "A", "text": "Drag the table icon onto the flow definition"}, {"letter": "B", "text": "Use the condition builder to specify the desired values"}, {"letter": "C", "text": "Specify the source table on the data pill related list"}, {"letter": "D", "text": "Drag the data pill onto the flow definition"}, {"letter": "E", "text": "Add the table reference using the slush bucket"}], "answer": ["D"], "explanation": ""}, {"question": "Which tool is used to define relationships between fields in an import set table and a\ntarget table?", "options": [{"letter": "A", "text": "Transform Schema"}, {"letter": "B", "text": "Schema Map"}, {"letter": "C", "text": "Dictionary Map"}, {"letter": "D", "text": "Transform Map"}, {"letter": "E", "text": "Field Transformer"}, {"letter": "F", "text": "Import Designer"}], "answer": ["D"], "explanation": ""}, {"question": "Which ServiceNow capability provides assistance to help users obtain information,\nmake decisions, and perform common work tasks via a messaging interface?", "options": [{"letter": "A", "text": "Agent Workspace"}, {"letter": "B", "text": "Chat bot"}, {"letter": "C", "text": "Virtual Agent"}, {"letter": "D", "text": "Knowledge Chat"}, {"letter": "E", "text": "Now Support"}], "answer": ["C"], "explanation": ""}, {"question": "Which feature allows you to automate business logic for a particular application or\nprocess such as approvals, tasks notifications, and record operations?", "options": [{"letter": "A", "text": "Flows"}, {"letter": "B", "text": "Action Sequences"}, {"letter": "C", "text": "Action Sets"}, {"letter": "D", "text": "Task Flows"}, {"letter": "E", "text": "Flow Diagrams"}], "answer": ["A"], "explanation": ""}, {"question": "From a form, what would you click to add additional fields to the form? (Choose two.)", "options": [{"letter": "A", "text": "Context Menu > Form > Layout"}, {"letter": "B", "text": "Context Menu > Configure > Form Layout"}, {"letter": "C", "text": "Context Menu > Configure > Form Design"}, {"letter": "D", "text": "Right click on header > Add > Field"}, {"letter": "E", "text": "Context Menu > Form > Designer"}, {"letter": "F", "text": "Right click on header > Configure > UX Dashboard"}], "answer": ["B", "C"], "explanation": ""}, {"question": "What is the name of the table relationship, where two or more tables are related in a bi-\ndirectional relationship, so that the related records are visible from both tables in a\nrelated list?", "options": [{"letter": "A", "text": "Database View"}, {"letter": "B", "text": "Many to Many"}, {"letter": "C", "text": "One to Many"}, {"letter": "D", "text": "Extended"}], "answer": ["B"], "explanation": ""}, {"question": "On a Form header, what is the three bar icon called?", "options": [{"letter": "A", "text": "Pancake icon"}, {"letter": "B", "text": "Additional Actions or Context Menu"}, {"letter": "C", "text": "Hamburger icon"}, {"letter": "D", "text": "Cake icon"}], "answer": ["B"], "explanation": ""}, {"question": "Group records are stored in which table?", "options": [{"letter": "A", "text": "Group [sn_user_group]"}, {"letter": "B", "text": "Group [sys_user_group]"}, {"letter": "C", "text": "Group [s_sys_group]"}, {"letter": "D", "text": "Group [u_sys_group]"}], "answer": ["B"], "explanation": ""}, {"question": "A REQ number in the Service Catalog represents`¦", "options": [{"letter": "A", "text": "the order number."}, {"letter": "B", "text": "the stage."}, {"letter": "C", "text": "the task to complete."}, {"letter": "D", "text": "the individual item in the order."}], "answer": ["A"], "explanation": ""}, {"question": "What function do you use to add buttons, links, and context menu items on forms and\nlists?", "options": [{"letter": "A", "text": "UI Policies"}, {"letter": "B", "text": "UI Settings"}, {"letter": "C", "text": "UI Actions"}, {"letter": "D", "text": "UI Config"}], "answer": ["C"], "explanation": ""}, {"question": "On a Business Rule, the When setting determines at what point the rule executes. What\nare the options for specifying that timing?", "options": [{"letter": "A", "text": "Before, After, Async, Display"}, {"letter": "B", "text": "Prior to, Synchronous, on Update"}, {"letter": "C", "text": "Insert, Update, Delete, Query"}, {"letter": "D", "text": "Before, Synchronous, Scheduled Job, View"}], "answer": ["A"], "explanation": ""}, {"question": "What are different types of Data Sources, which may be imported into ServiceNow?\n(Choose four.)", "options": [{"letter": "A", "text": "Local Sources (i.e. XML, CSV, Excel)"}, {"letter": "B", "text": "Implementation Spoke"}, {"letter": "C", "text": "DataHub"}, {"letter": "D", "text": "JDBC Connection"}, {"letter": "E", "text": "Network Server"}, {"letter": "F", "text": "LDAP Connection"}], "answer": ["A", "D", "E", "F"], "explanation": "An Import Set is used to import data from various data sources and then map that data\ninto ServiceNow tables.\nYou can import data from:\n• A local source file (i.e. XML, CSV, Excel)\n• A network server by providing a path and authentication information\n• An LDAP connection\n• A JDBC connection"}, {"question": "What are the components that make up a filter condition? (Choose three.)", "options": [{"letter": "A", "text": "Operator"}, {"letter": "B", "text": "Match Criteria"}, {"letter": "C", "text": "Value"}, {"letter": "D", "text": "Column"}, {"letter": "E", "text": "Field"}], "answer": ["A", "C", "E"], "explanation": ""}, {"question": "When impersonating a user for testing purposes, what is the best way to return the\ninstance, logged in with your user account?", "options": [{"letter": "A", "text": "Turn your computer off and on again"}, {"letter": "B", "text": "Clear browser cache"}, {"letter": "C", "text": "End Impersonation"}, {"letter": "D", "text": "Log out and back in"}], "answer": ["C"], "explanation": "You only have to logout and back in if your using Elevated role such as security_admin"}, {"question": "What controls the publishing and retiring process for n of permissions"}, {"letter": "B", "text": "A set of user access policies"}, {"letter": "C", "text": "A Persona in a workflow"}, {"letter": "D", "text": "A set of access control rules"}], "answer": ["A"], "explanation": ""}, {"question": "Which would NOT appear in the History section of the Application Navigator?", "options": [{"letter": "A", "text": "Records"}, {"letter": "B", "text": "UI Pages"}, {"letter": "C", "text": "Lists"}, {"letter": "D", "text": "Forms"}], "answer": ["B"], "explanation": ""}, {"question": "A user is complaining that they are seeing a blank page, when they click Create New,\nfrom your custom Inventory application. You have confirmed that they can see the\nInventory application, and the Create New module on the application navigator. What\ncould be the cause of this issue?", "options": [{"letter": "A", "text": "Create New module has a broken link"}, {"letter": "B", "text": "Known intermittent issue with UI15"}, {"letter": "C", "text": "User should be using Chrome instead of Explorer for their browser"}, {"letter": "D", "text": "User has read role, but not the write role on the Inventory table"}, {"letter": "E", "text": "User session has timed out"}], "answer": ["D"], "explanation": ""}, {"question": "What resource can you use to view details of the tables and configuration items (CIs)\nassociated with a particular use case?", "options": [{"letter": "A", "text": "Scenario Dashboard"}, {"letter": "B", "text": "CI Use Case Modeler"}, {"letter": "C", "text": "CMDB Use Case Modeler"}, {"letter": "D", "text": "Common Service Data Model (CSDM) product view"}], "answer": ["D"], "explanation": ""}, {"question": "What are advantages of using Flow Designer? (Choose three.)", "options": [{"letter": "A", "text": "Supports advanced developers"}, {"letter": "B", "text": "Enables complicated scripting"}, {"letter": "C", "text": "Reduces technical debt"}, {"letter": "D", "text": "Less manual scripting"}, {"letter": "E", "text": "Smooth integration with 3rd party systems"}], "answer": ["C", "D", "E"], "explanation": ""}, {"question": "Your customer requires that they be able to monitor which users are performing\nimpersonations in their instance. What would you do to meet that requirement?", "options": [{"letter": "A", "text": "Add the role Log Write [sn_log_write] to the Impersonator Group"}, {"letter": "B", "text": "Create user update set for impersonation tracking"}, {"letter": "C", "text": "Activate the glide.sys.log_impersonation prop"}, {"letter": "D", "text": "From User icon, select Elevate Roles"}, {"letter": "E", "text": "On the Impersonator role record, right click and select Create Log"}], "answer": ["C"], "explanation": ""}, {"question": "When a flow runs an action, it generates a runtime value, which stays the same for the\nduration of the flow. What is the name of this runtime value?", "options": [{"letter": "A", "text": "Trigger runtime value"}, {"letter": "B", "text": "Sequence runtime value"}, {"letter": "C", "text": "Starting runtime value"}, {"letter": "D", "text": "Data pill runtime value"}, {"letter": "E", "text": "Input runtime value"}], "answer": ["D"], "explanation": "In ServiceNow, a data pill is a draggable token that represents dynamic data from a\nrecord, action, or previous step in a flow. When you run a flow or subflow, each data pill\ngets replaced with its run-time value—i.e., the actual data from the record or context\nat the time of execution."}, {"question": "The wait time for end users is based on the round-trip between the client and the server.\nWhat activities are included in the round-trips?", "options": [{"letter": "A", "text": "Request + Response"}, {"letter": "B", "text": "Save + Update"}, {"letter": "C", "text": "Write + Read"}, {"letter": "D", "text": "Submit + Query"}, {"letter": "E", "text": "Insert + Verify"}], "answer": ["A"], "explanation": ""}, {"question": "When importing data, what happens to imported rows, if no coalesce field is specified?", "options": [{"letter": : "User [s_user]"}], "answer": ["A"], "explanation": ""}, {"question": "What ServiceNow feature can be triggered by events, and is used to inform users about\nactivities or updates in ServiceNow?", "options": [{"letter": "A", "text": "Notifications"}, {"letter": "B", "text": "Alerts"}, {"letter": "C", "text": "Texts"}, {"letter": "D", "text": "Events"}, {"letter": "E", "text": "Emails"}], "answer": ["A"], "explanation": ""}, {"question": "Which ServiceNow capability allows you to provide knowledge articles, via a\nconversational messaging interface?", "options": [{"letter": "A", "text": "Agent Assist"}, {"letter": "B", "text": "Virtual Agent"}, {"letter": "C", "text": "Now Messenger"}, {"letter": "D", "text": "Connect Agent"}], "answer": ["B"], "explanation": ""}, {"question": "Which role can manage multiple knowledge bases?", "options": [{"letter": "A", "text": "knowledge_base_admin"}, {"letter": "B", "text": "kb_admin"}, {"letter": "C", "text": "sn_kb_admin"}, {"letter": "D", "text": "knowledge_admin"}], "answer": ["D"], "explanation": ""}, {"question": "What are benefits of assigning work tasks to a group, rather than to an individual?\n(Choose four.)", "options": [{"letter": "A", "text": "Group members can choose their tasks from My Groups Work"}, {"letter": "B", "text": "Groups can assign tasks to users based on on-call schedules"}, {"letter": "C", "text": "Site support members can pick tasks, based on Location"}, {"letter": "D", "text": "Groups can assign tasks to users based on skills"}, {"letter": "E", "text": "Group members can avoid tasks, which are nearing SLA breach"}, {"letter": "F", "text": "Groups can assign tasks to users based on availability"}], "answer": ["A", "B", "D", "F"], "explanation": ""}, {"question": "What ServiceNow feature allows you to include data from a secondary related table on\na report?", "options": [{"letter": "A", "text": "SQL"}, {"letter": "B", "text": "Dot Walking"}, {"letter": "C", "text": "Outer Join"}, {"letter": "D", "text": "Joins"}], "answer": ["B"], "explanation": "Dot-walking in ServiceNow is used to access fields from related tables through a\nreference field."}, {"question": "What attributes can you manage, using System Properties > Basic Configuration UI16?\n(Choose five.)", "options": [{"letter": "A", "text": "Browser tab title"}, {"letter": "B", "text": "Module text color"}, {"letter": "C", "text": "Preferred browser"}, {"letter": "D", "text": "Base theme"}, {"letter": "E", "text": "Font style"}, {"letter": "F", "text": "Animation style"}, {"letter": "G", "text": "Header background color"}, {"letter": "H", "text": "Banner Image"}], "answer": ["A", "B", "D", "G", "H"], "explanation": ""}, {"question": "Which of the following is used to initiate a flow?", "options": [{"letter": "A", "text": "A Trigger"}, {"letter": "B", "text": "Core Action"}, {"letter": "C", "text": "A spoke"}, {"letter": "D", "text": "An Event"}], "answer": ["A"], "explanation": "A trigger (record, schedule or application trigger) starts a flow. Actions and spokes are what the flow runs once it has started."}, {"question": "Which field (or fields) is used as a unique key during imports?", "options": [{"letter": "A", "text": "Match Fields"}, {"letter": "B", "text": "Coalesce Fields"}, {"letter": "C", "text": "Key Fields"}, {"letter": "D", "text": "Sys IDs"}], "answer": ["B"], "explanation": ""}, {"question": "You are asked to create an option in the Service Catalog, which will allow a user to click\nGet Help and describe the issue they are having. These forms should create incident\nrecords, which are automatically routed to the Service Desk. Which method would you\nuse?", "options": [{"letter": "A", "text": "Create Record Producer"}, {"letter": "B", "text": "Create Catalog Item"}, {"letter": "C", "text": "Create Order Guide"}, {"letter": "D", "text": "Create Content Item"}], "answer": ["A"], "explanation": "Record producers are a type of Catalog Item that creates task based records e.g.\nincident. Not all Catalog Items are Record producers"}, {"question": "Which tool graphically displays an infrastructure view for a configuration item (CI) and\nits relationship with other CIs?", "options": [{"letter": "A", "text": "Schema Map"}, {"letter": "B", "text": "Dependency View"}, {"letter": "C", "text": "Dependency Map"}, {"letter": "D", "text": "Database View"}], "answer": ["B"], "explanation": "In ServiceNow, a \"Dependency View\" is a graphical representation of the dependencies\nbetween Configuration Items (CIs) in an IT infrastructure. A dependency view provides a\nvisual representation of the relationships between CIs and the services they support,\nenabling IT teams to quickly understand the impact of changes, troubleshoot issues,\nand plan for future improvements"}, {"question": "What are examples of Core tables in the ServiceNow platform?", "options": [{"letter": "A", "text": "Configuration, Connect, Chat"}, {"letter": "B", "text": "Team, Party, Awards"}, {"letter": "C", "text": "User, Task, Incident"}, {"letter": "D", "text": "Work, Caller, Timecard"}], "answer": ["C"], "explanation": ""}, {"question": "Which tab on the knowledge base record, would you use to identify the sets of users\nwho are able to read articles in that knowledge base?", "options": [{"letter": "A", "text": "Access List"}, {"letter": "B", "text": "Can Access"}, {"letter": "C", "text": "Accessible to"}, {"letter": "D", "text": "Can Read"}], "answer": ["D"], "explanation": ""}, {"question": "What are the main components of the Form Design interface? (Choose three.)", "options": [{"letter": "A", "text": "Field Layout"}, {"letter": "B", "text": "Page Header"}, {"letter": "C", "text": "Field Navigator"}, {"letter": "D", "text": "Field Picker"}, {"letter": "E", "text": "Form Layout"}], "answer": ["B", "C", "E"], "explanation": ""}, {"question": "What is used to determine user access to knowledge bases or a knowledge article?", "options": [{"letter": "A", "text": "sn_kb_read, sn_article_read"}, {"letter": "B", "text": "Privacy Settings"}, {"letter": "C", "text": "Read Access Flag"}, {"letter": "D", "text": "User Criteria"}], "answer": ["D"], "explanation": ""}, {"question": "What are the three key tables in an enterprise CMDB? (Choose three.)", "options": [{"letter": "A", "text": "cmdb"}, {"letter": "B", "text": "sn_cmdb_bak"}, {"letter": "C", "text": "cmdb_rel_ci"}, {"letter": "D", "text": "sn_cmdb"}, {"letter": "E", "text": "cmdb_bak"}, {"letter": "F", "text": "cmdb_ci"}, {"letter": "G", "text": "sn_cmdb_ci"}], "answer": ["A", "C", "F"], "explanation": ""}, {"question": "What is the best practice related to using the Default Update Set for moving\ncustomizations between instances?", "options": [{"letter": "A", "text": "Merge Default update sets before moving between instances"}, {"letter": "B", "text": "Submit Default update set to application repository"}, {"letter": "C", "text": "You should not use the Default Update sets for moving between instances"}, {"letter": "D", "text": "Keep Default update set to maximum of 20 records, for troubleshooting purposes"}], "answer": ["C"], "explanation": ""}, {"question": "For Administrators creating new Service Catalog items, what is a characteristic they\nshould know about Service Catalog variables?", "options": [{"letter": "A", "text": "Service Catalog variables can only be used in Record Producers"}, {"letter": "B", "text": "Service Catalog variables can only be used in Order Guides"}, {"letter": "C", "text": "Service Catalog variables can affect the order price"}, {"letter": "D", "text": "Service Catalog variables are global by default"}], "answer": ["C"], "explanation": "Variables can modify the price or recurring price of a catalog item (for example, extra memory adds cost). Variables are NOT global by default: Global is a checkbox you select to make a variable available to all catalog tasks.", "correction": {"was": "D", "basis": "Verified against ServiceNow docs"}}, {"question": "On what part of the ServiceNow instance, would you find the option to Impersonate\nUser?", "options": [{"letter": "A", "text": "Module"}, {"letter": "B", "text": "Content Frame"}, {"letter": "C", "text": "Application Navigator"}, {"letter": "D", "text": "Banner"}], "answer": ["D"], "explanation": ""}, {"question": "Which application is used primarily to load data into ServiceNow?", "options": [{"letter": "A", "text": "Import Hub"}, {"letter": "B", "text": "System Import Sets"}, {"letter": "C", "text": "Data Import Configuration"}, {"letter": "D", "text": "Import Management"}], "answer": ["B"], "explanation": ""}, {"question": "If a knowledge base has no access details specified, what users are able to read articles\nin that knowledge base?", "options": [{"letter": "A", "text": "itil users"}, {"letter": "B", "text": "Any user with an article's permalink"}, {"letter": "C", "text": "Any active user"}, {"letter": "D", "text": "No users"}, {"letter": "E", "text": "Users with kb_user role"}], "answer": ["C"], "explanation": ""}, {"question": "How would you define an Access Control, to allow a user with itil role to have\npermission to create incident records?", "options": [{"letter": "A", "text": "Name: incident.None; Operation: create; Role: itil"}, {"letter": "B", "text": "Name: incident.Any; Operation: write; Permission: itil"}, {"letter": "C", "text": "Name: incident:*; Permission: write; Role: itil"}, {"letter": "D", "text": "Name: incident.None; Permission: create; Role: itil"}, {"letter": "E", "text": "Name: incident:*;Operation: write; Permission: itil"}], "answer": ["A"], "explanation": "To allow users with the itil role to create Incident records, you need to:\n    • Set the Name of the Access Control to incident.None (this means it applies to\n        the whole table, not a specific field).\n    • Set the Operation to create.\n    • Set the Required Role to itil.\nB: incident.Any isn't a valid table name.\nC & E: incident:* is used for wildcard field-level permissions, not table-level create.\nD:  a member of the Network and Hardware groups."}], "answer": ["D"], "explanation": ""}, {"question": "Which ServiceNow utility provides a modern interactive graphical interface to visualize\nconfiguration items and their relationships?", "options": [{"letter": "A", "text": "Dependency View"}, {"letter": "B", "text": "CI Class Map"}, {"letter": "C", "text": "Business Service Map"}, {"letter": "D", "text": "CSDM Schema"}], "answer": ["A"], "explanation": ""}, {"question": "On the Reports page, what sections allow you to see which reports are visible to\ndifferent audiences? (Choose four.)", "options": [{"letter": "A", "text": "Group"}, {"letter": "B", "text": "Department"}, {"letter": "C", "text": "My reports"}, {"letter": "D", "text": "Team"}, {"letter": "E", "text": "Global"}, {"letter": "F", "text": "All"}], "answer": ["A", "C", "E", "F"], "explanation": ""}, {"question": "On a filter condition, there is an element, which is based on the table, the user access\nrights, and columns on the table. What is this element called?", "options": [{"letter": "A", "text": "Label"}, {"letter": "B", "text": "Column"}, {"letter": "C", "text": "Data Element"}, {"letter": "D", "text": "Field"}, {"letter": "E", "text": "Attribute"}], "answer": ["D"], "explanation": ""}, {"question": "You have been asked to create a way for users to order a new iPhone, but only if they get\ntwo levels of approval. The approvers and users should be automatically notified at\neach approval level. What feature would you use to manage the approvals and\nnotifications?", "options": [{"letter": "A", "text": "Approval Chains"}, {"letter": "B", "text": "Flows"}, {"letter": "C", "text": "Approver Delegates"}, {"letter": "D", "text": "Parent-Child Approvers"}, {"letter": "E", "text": "Approval Criteria"}], "answer": ["B"], "explanation": ""}, {"question": "Groups are stored in what table?", "options": [{"letter": "A", "text": "User Group [user_groups]"}, {"letter": "B", "text": "Groups [sys_user_groups]"}, {"le onfiguring your report. Which\nsection is used to specify grouping and calculations to be run against the data?", "options": [{"letter": "A", "text": "Style"}, {"letter": "B", "text": "Group by"}, {"letter": "C", "text": "Configure"}, {"letter": "D", "text": "Format"}, {"letter": "E", "text": "Data"}], "answer": ["C"], "explanation": "There are only 4 sections and they are DATA, TYPE, CONFIGURE, and STYLE. And Group\nby do not include calculations Aggregation does. Both Group by and Aggregation are\nboth under the Configure section therefore making C. Configure the answer."}, {"question": "What icon do you use to change the icon and color on a Favorite?", "options": [{"letter": "A", "text": "Clock"}, {"letter": "B", "text": "Pencil"}, {"letter": "C", "text": "Triangle"}, {"letter": "D", "text": "Star"}], "answer": ["B"], "explanation": ""}, {"question": "You have heard about a new application released by ServiceNow. You want to try it out,\nto see if it might be useful for your company's ServiceNow implementation. What would\nbe the best way to get hands-on experience with the new application?", "options": [{"letter": "A", "text": "Search the wiki for the sales demo request form"}, {"letter": "B", "text": "Check the latest release notes at docs servicenow.com"}, {"letter": "C", "text": "Activate the application plug in, on your personal dev instance"}, {"letter": "D", "text": "Activate the application plug in, on your company's production instance."}], "answer": ["C"], "explanation": ""}, {"question": "When looking at a long list of records, you want to quickly filter, to show only those\nwhich have Category of Hardware. How might you do that?", "options": [{"letter": "A", "text": "On the Category column header, right click and select Show > Hardware"}, {"letter": "B", "text": "Right click on magnifier, type Hardware and click enter"}, {"letter": "C", "text": "On the list, locate and right click on the value Hardware, select Show Matching"}, {"letter": "D", "text":
